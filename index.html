<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>Blueberry Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  cursor: pointer;
  background: #5968ff;
  color: white;
  font-weight: bold;
}

button:hover {
  filter: brightness(1.1);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.secondary {
  background: #30333a;
}

.danger {
  background: #d83b4b;
}

#startScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.startBox {
  width: 100%;
  max-width: 450px;
  background: #1b1d22;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 70px rgba(0,0,0,.45);
}

.startBox h1 {
  text-align: center;
  margin-top: 0;
}

.startBox p {
  color: #999;
  text-align: center;
  line-height: 1.5;
}

.startBox input {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #3b3e46;
  background: #111216;
  color: white;
}

.startBox button {
  width: 100%;
  margin-top: 10px;
}

.divider {
  height: 1px;
  background: #30333a;
  margin: 20px 0;
}

#status {
  text-align: center;
  min-height: 20px;
  color: #aaa;
  margin-top: 12px;
}

#app {
  display: none;
  min-height: 100vh;
}

.topbar {
  min-height: 65px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1b1d22;
  border-bottom: 1px solid #292c33;
  gap: 10px;
}

.topbarTitle {
  font-size: 19px;
  font-weight: bold;
}

.roomInfo {
  color: #999;
  font-size: 12px;
  margin-top: 3px;
}

#mainArea {
  padding: 18px;
  max-width: 1500px;
  margin: auto;
}

.contentGrid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 15px;
}

.largeVideoBox {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #050506;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid transparent;
  cursor: pointer;
}

.largeVideoBox.speaking {
  border-color: #38d66b;
}

#largeVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.videoName {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: rgba(0,0,0,.65);
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 13px;
}

.noVideo {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  background: #17191e;
}

.thumbnails {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 0;
}

.tile {
  position: relative;
  flex: 0 0 150px;
  height: 95px;
  background: #17191e;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid transparent;
  cursor: pointer;
}

.tile.speaking {
  border-color: #38d66b;
}

.tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.tileName {
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: 5px;
  background: rgba(0,0,0,.65);
  border-radius: 5px;
  padding: 4px 5px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.roomPanel {
  margin-top: 15px;
  background: #1b1d22;
  border-radius: 15px;
  padding: 15px;
}

.roomPanel h2 {
  margin: 0 0 10px;
  font-size: 16px;
}

.participantList {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.participantBadge {
  background: #30333a;
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 12px;
}


/* CHAT */

.chatPanel {
  background: #1b1d22;
  border-radius: 15px;
  overflow: hidden;
  height: 100%;
  min-height: 500px;
  display: flex;
  flex-direction: column;
}

.chatHeader {
  padding: 15px;
  font-size: 17px;
  font-weight: bold;
  border-bottom: 1px solid #30333a;
}

.chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  min-height: 300px;
}

.chatMessage {
  margin-bottom: 11px;
}

.chatName {
  font-size: 12px;
  font-weight: bold;
  color: #8f9aff;
  margin-bottom: 3px;
}

.chatBubble {
  display: inline-block;
  max-width: 95%;
  background: #30333a;
  padding: 8px 10px;
  border-radius: 10px;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.chatMessage.mine .chatName {
  color: #63db86;
}

.chatMessage.mine .chatBubble {
  background: #35483c;
}

.chatInputArea {
  display: flex;
  gap: 7px;
  padding: 10px;
  border-top: 1px solid #30333a;
}

#chatInput {
  flex: 1;
  min-width: 0;
  border: 1px solid #3b3e46;
  background: #111216;
  color: white;
  border-radius: 9px;
  padding: 10px;
}

#sendChatButton {
  padding-left: 14px;
  padding-right: 14px;
}

.hidden {
  display: none !important;
}


@media (max-width: 900px) {

  .contentGrid {
    grid-template-columns: 1fr;
  }

  .chatPanel {
    min-height: 350px;
    height: 450px;
  }
}

@media (max-width: 650px) {

  .topbar {
    padding: 10px;
  }

  #mainArea {
    padding: 10px;
  }

  .tile {
    flex-basis: 125px;
    height: 80px;
  }
}
</style>
</head>

<body>

<div id="startScreen">

  <div class="startBox">

    <h1>🫐 Blueberry Video Chat</h1>

    <p>
      Create a temporary video call or join
      one with a room code.
    </p>

    <input
      id="nameInput"
      maxlength="30"
      placeholder="Your display name"
      autocomplete="nickname"
    >

    <button id="createButton">
      Create Room
    </button>

    <div class="divider"></div>

    <input
      id="roomNameInput"
      maxlength="40"
      placeholder="Room name"
    >

    <input
      id="roomCodeInput"
      maxlength="12"
      placeholder="Room code"
      autocomplete="off"
    >

    <button
      id="joinButton"
      class="secondary"
    >
      Join Room
    </button>

    <div id="status"></div>

  </div>

</div>


<div id="app">

  <div class="topbar">

    <div>
      <div
        id="roomTitle"
        class="topbarTitle"
      >
        Blueberry Video Chat
      </div>

      <div
        id="roomInfo"
        class="roomInfo"
      ></div>
    </div>

    <button
      id="leaveButton"
      class="danger"
    >
      Leave
    </button>

  </div>


  <div id="mainArea">

    <div class="contentGrid">

      <div>

        <div
          id="largeVideoBox"
          class="largeVideoBox"
        >

          <video
            id="largeVideo"
            autoplay
            playsinline
            muted
          ></video>

          <div
            id="noVideo"
            class="noVideo"
          >
            👤
          </div>

          <div
            id="largeVideoName"
            class="videoName"
          >
            You
          </div>

        </div>


        <div
          id="thumbnails"
          class="thumbnails"
        ></div>


        <div class="controls">

          <button id="muteButton">
            🎤 Mute
          </button>

          <button id="cameraButton">
            📷 Camera Off
          </button>

          <button
            id="fullscreenButton"
            class="secondary"
          >
            ⛶ Fullscreen
          </button>

        </div>


        <div class="roomPanel">

          <h2>
            People in the call
          </h2>

          <div
            id="participantList"
            class="participantList"
          ></div>

        </div>

      </div>


      <!-- CHAT -->

      <div class="chatPanel">

        <div class="chatHeader">
          💬 Room Chat
        </div>

        <div
          id="chatMessages"
          class="chatMessages"
        ></div>

        <div class="chatInputArea">

          <input
            id="chatInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
          >

          <button id="sendChatButton">
            Send
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<script>
const socketUrl =
  (
    location.protocol === "https:"
      ? "wss://"
      : "ws://"
  ) +
  location.host +
  "/ws";


let ws = null;
let myId = null;
let myName = "";
let localStream = null;
let currentRoom = null;
let selectedId = null;

const participants = new Map();
const peers = new Map();
const remoteStreams = new Map();
const tiles = new Map();
const pendingCandidates = new Map();

let cameraEnabled = true;
let microphoneEnabled = true;

let audioContext = null;
let audioAnalyser = null;
let audioSource = null;
let speakingTimer = null;


const startScreen =
  document.getElementById("startScreen");

const app =
  document.getElementById("app");

const nameInput =
  document.getElementById("nameInput");

const roomNameInput =
  document.getElementById("roomNameInput");

const roomCodeInput =
  document.getElementById("roomCodeInput");

const createButton =
  document.getElementById("createButton");

const joinButton =
  document.getElementById("joinButton");

const statusElement =
  document.getElementById("status");

const roomTitle =
  document.getElementById("roomTitle");

const roomInfo =
  document.getElementById("roomInfo");

const largeVideo =
  document.getElementById("largeVideo");

const largeVideoBox =
  document.getElementById("largeVideoBox");

const largeVideoName =
  document.getElementById("largeVideoName");

const noVideo =
  document.getElementById("noVideo");

const thumbnails =
  document.getElementById("thumbnails");

const participantList =
  document.getElementById("participantList");

const muteButton =
  document.getElementById("muteButton");

const cameraButton =
  document.getElementById("cameraButton");

const fullscreenButton =
  document.getElementById("fullscreenButton");

const leaveButton =
  document.getElementById("leaveButton");

const chatMessages =
  document.getElementById("chatMessages");

const chatInput =
  document.getElementById("chatInput");

const sendChatButton =
  document.getElementById("sendChatButton");


function setStatus(text) {
  statusElement.textContent =
    text || "";
}


function getClientId() {

  let id =
    localStorage.getItem(
      "blueberryClientId"
    );

  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "blueberryClientId",
      id
    );
  }

  return id;
}


function saveName(name) {

  localStorage.setItem(
    "blueberryDisplayName",
    name
  );
}


function connectSocket() {

  return new Promise(
    (resolve, reject) => {

      ws =
        new WebSocket(
          socketUrl
        );

      let finished = false;

      ws.addEventListener(
        "open",
        () => {

          ws.send(
            JSON.stringify({
              type: "register",
              id:
                getClientId(),
              name:
                myName
            })
          );
        }
      );


      ws.addEventListener(
        "message",
        event => {

          let message;

          try {
            message =
              JSON.parse(
                event.data
              );
          }

          catch {
            return;
          }

          if (
            message.type ===
            "registered"
          ) {

            myId =
              message.userId;

            if (!finished) {

              finished = true;
              resolve();
            }
          }

          handleMessage(
            message
          );
        }
      );


      ws.addEventListener(
        "error",
        () => {

          if (!finished) {

            finished = true;

            reject(
              new Error(
                "Could not connect to the server."
              )
            );
          }
        }
      );


      ws.addEventListener(
        "close",
        () => {

          if (!finished) {

            finished = true;

            reject(
              new Error(
                "Connection closed."
              )
            );
          }
        }
      );

    }
  );
}


function handleMessage(message) {

  switch (message.type) {

    case "roomJoined":
      handleRoomJoined(message);
      break;

    case "userJoined":
      handleUserJoined(message.user);
      break;

    case "userLeft":
      handleUserLeft(message.userId);
      break;

    case "userNameChanged":
      handleUserNameChanged(
        message.userId,
        message.name
      );
      break;

    case "signal":
      handleSignal(message);
      break;

    case "chatMessage":
      addChatMessage(
        message.message
      );
      break;

    case "kicked":
      alert(
        message.message ||
        "You were kicked."
      );

      cleanupCall();
      break;

    case "banned":
      alert(
        message.message ||
        "You were banned."
      );

      cleanupCall();
      break;

    case "roomLeft":
      cleanupCall();
      break;

    case "error":
      if (
        app.style.display ===
        "none"
      ) {
        setStatus(
          message.message
        );
      }

      else {
        alert(
          message.message ||
          "Something went wrong."
        );
      }

      break;
  }
}


async function getMedia() {

  if (localStream) {
    return;
  }

  localStream =
    await navigator.mediaDevices
      .getUserMedia({
        video: true,
        audio: true
      });

  cameraEnabled = true;
  microphoneEnabled = true;

  largeVideo.srcObject =
    localStream;

  updateControls();

  startSpeakingDetection();
}


async function createRoom() {

  const name =
    nameInput.value.trim();

  if (!name) {

    setStatus(
      "Enter your display name first."
    );

    return;
  }

  try {

    myName = name;
    saveName(name);

    createButton.disabled = true;
    joinButton.disabled = true;

    setStatus(
      "Starting camera and microphone..."
    );

    await getMedia();

    await connectSocket();

    const roomName =
      roomNameInput.value.trim() ||
      `${myName}'s Room`;

    ws.send(
      JSON.stringify({
        type: "createRoom",
        name: roomName
      })
    );

    setStatus(
      "Creating room..."
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      error.message
    );

    createButton.disabled = false;
    joinButton.disabled = false;
  }
}


async function joinRoom() {

  const name =
    nameInput.value.trim();

  const code =
    roomCodeInput.value
      .trim()
      .toUpperCase();

  if (!name) {

    setStatus(
      "Enter your display name first."
    );

    return;
  }

  if (!code) {

    setStatus(
      "Enter a room code."
    );

    return;
  }

  try {

    myName = name;
    saveName(name);

    createButton.disabled = true;
    joinButton.disabled = true;

    setStatus(
      "Starting camera and microphone..."
    );

    await getMedia();

    await connectSocket();

    ws.send(
      JSON.stringify({
        type: "joinRoom",
        code
      })
    );

    setStatus(
      "Joining room..."
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      error.message
    );

    createButton.disabled = false;
    joinButton.disabled = false;
  }
}


function handleRoomJoined(message) {

  currentRoom =
    message.room;

  myId =
    message.self.id;

  participants.clear();
  peers.clear();
  remoteStreams.clear();
  pendingCandidates.clear();
  tiles.clear();

  thumbnails.innerHTML = "";
  chatMessages.innerHTML = "";

  participants.set(
    myId,
    {
      id: myId,
      name: myName,
      role: "user"
    }
  );

  for (
    const user of
    message.users || []
  ) {

    participants.set(
      user.id,
      user
    );
  }

  selectedId =
    myId;

  showApp();

  for (
    const messageItem of
    message.messages || []
  ) {

    addChatMessage(
      messageItem
    );
  }

  renderParticipants();

  selectParticipant(
    myId
  );

  for (
    const user of
    message.users || []
  ) {

    if (
      shouldCreateOffer(
        myId,
        user.id
      )
    ) {

      createPeerConnection(
        user.id,
        true
      );
    }
  }
}


function handleUserJoined(user) {

  if (!user || !user.id) {
    return;
  }

  participants.set(
    user.id,
    user
  );

  renderParticipants();

  if (
    shouldCreateOffer(
      myId,
      user.id
    )
  ) {

    createPeerConnection(
      user.id,
      true
    );
  }
}


function handleUserLeft(userId) {

  participants.delete(
    userId
  );

  const peer =
    peers.get(
      userId
    );

  if (peer) {

    try {
      peer.close();
    }

    catch {}

    peers.delete(
      userId
    );
  }

  remoteStreams.delete(
    userId
  );

  const tile =
    tiles.get(
      userId
    );

  if (tile) {

    tile.remove();

    tiles.delete(
      userId
    );
  }

  if (
    selectedId ===
    userId
  ) {

    selectedId =
      myId;

    selectParticipant(
      myId
    );
  }

  renderParticipants();
}


function handleUserNameChanged(
  userId,
  name
) {

  const user =
    participants.get(
      userId
    );

  if (!user) {
    return;
  }

  user.name =
    name;

  const tile =
    tiles.get(
      userId
    );

  if (tile) {

    tile.querySelector(
      ".tileName"
    ).textContent =
      name;
  }

  if (
    selectedId ===
    userId
  ) {

    largeVideoName.textContent =
      name;
  }

  renderParticipants();
}


/* WEBRTC */

function shouldCreateOffer(
  a,
  b
) {
  return String(a) <
    String(b);
}


function createPeerConnection(
  userId,
  createOffer
) {

  if (
    peers.has(userId)
  ) {
    return peers.get(userId);
  }

  const peer =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(
    userId,
    peer
  );

  if (localStream) {

    for (
      const track of
      localStream.getTracks()
    ) {

      peer.addTrack(
        track,
        localStream
      );
    }
  }

  peer.addEventListener(
    "icecandidate",
    event => {

      if (!event.candidate) {
        return;
      }

      sendSignal(
        userId,
        {
          type:
            "candidate",
          candidate:
            event.candidate
        }
      );
    }
  );


  peer.addEventListener(
    "track",
    event => {

      let stream =
        remoteStreams.get(
          userId
        );

      if (!stream) {

        stream =
          new MediaStream();

        remoteStreams.set(
          userId,
          stream
        );
      }

      if (
        !stream
          .getTracks()
          .some(
            track =>
              track.id ===
              event.track.id
          )
      ) {

        stream.addTrack(
          event.track
        );
      }

      updateRemoteTile(
        userId,
        stream
      );

      if (
        selectedId ===
        userId
      ) {

        largeVideo.srcObject =
          stream;

        largeVideo.muted =
          false;

        noVideo.style.display =
          "none";
      }
    }
  );


  peer.addEventListener(
    "connectionstatechange",
    () => {

      if (
        peer.connectionState ===
          "failed" ||
        peer.connectionState ===
          "closed"
      ) {

        peers.delete(
          userId
        );
      }
    }
  );


  if (createOffer) {

    peer.createOffer()
      .then(
        offer =>
          peer.setLocalDescription(
            offer
          )
      )
      .then(
        () => {

          sendSignal(
            userId,
            {
              type:
                "offer",
              offer:
                peer.localDescription
            }
          );
        }
      )
      .catch(
        console.error
      );
  }

  return peer;
}


async function handleSignal(
  message
) {

  const userId =
    message.from;

  const data =
    message.data;

  if (!userId || !data) {
    return;
  }

  let peer =
    peers.get(
      userId
    );

  if (!peer) {

    peer =
      createPeerConnection(
        userId,
        false
      );
  }

  try {

    if (
      data.type ===
      "offer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      await flushCandidates(
        userId,
        peer
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      sendSignal(
        userId,
        {
          type:
            "answer",
          answer:
            peer.localDescription
        }
      );
    }

    else if (
      data.type ===
      "answer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      await flushCandidates(
        userId,
        peer
      );
    }

    else if (
      data.type ===
      "candidate"
    ) {

      if (
        peer.remoteDescription
      ) {

        await peer.addIceCandidate(
          data.candidate
        );

      }

      else {

        if (
          !pendingCandidates.has(
            userId
          )
        ) {

          pendingCandidates.set(
            userId,
            []
          );
        }

        pendingCandidates
          .get(userId)
          .push(
            data.candidate
          );
      }
    }

  }

  catch (error) {

    console.error(
      "WebRTC error:",
      error
    );
  }
}


async function flushCandidates(
  userId,
  peer
) {

  const candidates =
    pendingCandidates.get(
      userId
    );

  if (!candidates) {
    return;
  }

  pendingCandidates.delete(
    userId
  );

  for (
    const candidate of
    candidates
  ) {

    try {

      await peer.addIceCandidate(
        candidate
      );

    }

    catch (error) {

      console.error(error);
    }
  }
}


function sendSignal(
  target,
  data
) {

  if (
    !ws ||
    ws.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  ws.send(
    JSON.stringify({
      type:
        "signal",
      target,
      data
    })
  );
}


/* VIDEO */

function createTile(
  userId
) {

  if (
    tiles.has(userId)
  ) {

    return tiles.get(
      userId
    );
  }

  const tile =
    document.createElement(
      "div"
    );

  tile.className =
    "tile";

  const video =
    document.createElement(
      "video"
    );

  video.autoplay = true;
  video.playsInline = true;

  const label =
    document.createElement(
      "div"
    );

  label.className =
    "tileName";

  const user =
    participants.get(
      userId
    );

  label.textContent =
    user?.name ||
    "User";

  tile.appendChild(video);
  tile.appendChild(label);

  tile.addEventListener(
    "click",
    () => {
      selectParticipant(
        userId
      );
    }
  );

  thumbnails.appendChild(
    tile
  );

  tiles.set(
    userId,
    tile
  );

  return tile;
}


function updateRemoteTile(
  userId,
  stream
) {

  const tile =
    createTile(
      userId
    );

  const video =
    tile.querySelector(
      "video"
    );

  video.srcObject =
    stream;

  tile.style.display =
    userId === selectedId
      ? "none"
      : "";

  video.play()
    .catch(() => {});

  startRemoteSpeakingDetection(
    userId,
    stream,
    tile
  );
}


function updateLocalTile() {

  if (!myId || !localStream) {
    return;
  }

  const tile =
    createTile(
      myId
    );

  tile.querySelector(
    "video"
  ).srcObject =
    localStream;

  tile.style.display =
    myId === selectedId
      ? "none"
      : "";
}


/* SELECT VIDEO */

function selectParticipant(
  userId
) {

  if (
    !participants.has(
      userId
    )
  ) {
    return;
  }

  selectedId =
    userId;

  const user =
    participants.get(
      userId
    );

  largeVideoName.textContent =
    user.name;

  if (
    userId ===
    myId
  ) {

    largeVideo.srcObject =
      localStream;

    largeVideo.muted =
      true;

    noVideo.style.display =
      "none";

  }

  else {

    const stream =
      remoteStreams.get(
        userId
      );

    if (stream) {

      largeVideo.srcObject =
        stream;

      largeVideo.muted =
        false;

      noVideo.style.display =
        "none";

    }

    else {

      largeVideo.srcObject =
        null;

      noVideo.style.display =
        "flex";
    }
  }

  for (
    const [
      id,
      tile
    ] of tiles
  ) {

    tile.style.display =
      id === selectedId
        ? "none"
        : "";
  }
}


function renderParticipants() {

  participantList.innerHTML =
    "";

  for (
    const user of
    participants.values()
  ) {

    const badge =
      document.createElement(
        "div"
      );

    badge.className =
      "participantBadge";

    badge.textContent =
      user.id === myId
        ? `${user.name} (You)`
        : user.name;

    participantList.appendChild(
      badge
    );
  }

  updateLocalTile();

  for (
    const [
      id,
      stream
    ] of remoteStreams
  ) {

    updateRemoteTile(
      id,
      stream
    );
  }
}


/* SPEAKING DETECTION */

function startSpeakingDetection() {

  if (!localStream) {
    return;
  }

  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioAnalyser =
      audioContext.createAnalyser();

    audioAnalyser.fftSize =
      512;

    audioSource =
      audioContext
        .createMediaStreamSource(
          localStream
        );

    audioSource.connect(
      audioAnalyser
    );

    const data =
      new Uint8Array(
        audioAnalyser.fftSize
      );

    speakingTimer =
      setInterval(
        () => {

          if (
            !microphoneEnabled
          ) {
            return;
          }

          audioAnalyser
            .getByteTimeDomainData(
              data
            );

          let total = 0;

          for (
            const value of data
          ) {

            const n =
              (value - 128) /
              128;

            total +=
              n * n;
          }

          const volume =
            Math.sqrt(
              total /
              data.length
            );

          const speaking =
            volume >
            0.035;

          const tile =
            tiles.get(
              myId
            );

          if (speaking) {

            largeVideoBox
              .classList
              .add("speaking");

            if (tile) {
              tile.classList.add(
                "speaking"
              );
            }

          }

          else {

            largeVideoBox
              .classList
              .remove("speaking");

            if (tile) {
              tile.classList.remove(
                "speaking"
              );
            }
          }

        },
        100
      );

  }

  catch (error) {
    console.error(error);
  }
}


/*
 * Visual speaking detection for remote
 * participants.
 */
function startRemoteSpeakingDetection(
  userId,
  stream,
  tile
) {

  if (
    tile.dataset.audioDetection ===
    "yes"
  ) {
    return;
  }

  if (
    !stream.getAudioTracks().length
  ) {
    return;
  }

  tile.dataset.audioDetection =
    "yes";

  try {

    const context =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const analyser =
      context.createAnalyser();

    analyser.fftSize =
      512;

    const source =
      context.createMediaStreamSource(
        stream
      );

    source.connect(
      analyser
    );

    const data =
      new Uint8Array(
        analyser.fftSize
      );

    const timer =
      setInterval(
        () => {

          if (
            !document.body.contains(
              tile
            )
          ) {

            clearInterval(timer);

            context.close()
              .catch(() => {});

            return;
          }

          analyser
            .getByteTimeDomainData(
              data
            );

          let total = 0;

          for (
            const value of data
          ) {

            const n =
              (value - 128) /
              128;

            total +=
              n * n;
          }

          const volume =
            Math.sqrt(
              total /
              data.length
            );

          if (
            volume >
            0.035
          ) {

            tile.classList.add(
              "speaking"
            );

            if (
              selectedId ===
              userId
            ) {

              largeVideoBox
                .classList
                .add("speaking");
            }

          }

          else {

            tile.classList.remove(
              "speaking"
            );

            if (
              selectedId ===
              userId
            ) {

              largeVideoBox
                .classList
                .remove("speaking");
            }
          }

        },
        100
      );

  }

  catch (error) {
    console.error(error);
  }
}


/* CHAT */

function addChatMessage(
  message
) {

  if (!message) {
    return;
  }

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "chatMessage";

  if (
    message.userId ===
    myId
  ) {

    wrapper.classList.add(
      "mine"
    );
  }

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "chatName";

  name.textContent =
    message.name ||
    "User";

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "chatBubble";

  bubble.textContent =
    message.message || "";

  wrapper.appendChild(
    name
  );

  wrapper.appendChild(
    bubble
  );

  chatMessages.appendChild(
    wrapper
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;
}


function sendChat() {

  const text =
    chatInput.value.trim();

  if (!text) {
    return;
  }

  if (
    !ws ||
    ws.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  ws.send(
    JSON.stringify({
      type:
        "chat",
      message:
        text
    })
  );

  chatInput.value =
    "";

  chatInput.focus();
}


/* UI */

function showApp() {

  startScreen.style.display =
    "none";

  app.style.display =
    "block";

  roomTitle.textContent =
    currentRoom?.name ||
    "Video Chat";

  roomInfo.textContent =
    `Room code: ${currentRoom?.code || ""}`;
}


function updateControls() {

  muteButton.textContent =
    microphoneEnabled
      ? "🎤 Mute"
      : "🔇 Unmute";

  cameraButton.textContent =
    cameraEnabled
      ? "📷 Camera Off"
      : "📷 Camera On";
}


/* CONTROLS */

muteButton.addEventListener(
  "click",
  () => {

    if (!localStream) {
      return;
    }

    microphoneEnabled =
      !microphoneEnabled;

    for (
      const track of
      localStream.getAudioTracks()
    ) {

      track.enabled =
        microphoneEnabled;
    }

    updateControls();
  }
);


cameraButton.addEventListener(
  "click",
  () => {

    if (!localStream) {
      return;
    }

    cameraEnabled =
      !cameraEnabled;

    for (
      const track of
      localStream.getVideoTracks()
    ) {

      track.enabled =
        cameraEnabled;
    }

    updateControls();
  }
);


fullscreenButton.addEventListener(
  "click",
  () => {

    if (
      document.fullscreenElement
    ) {

      document.exitFullscreen()
        .catch(() => {});

    }

    else {

      largeVideoBox
        .requestFullscreen()
        .catch(() => {});
    }
  }
);


largeVideoBox.addEventListener(
  "click",
  () => {

    if (
      document.fullscreenElement
    ) {

      document.exitFullscreen()
        .catch(() => {});

    }

    else {

      largeVideoBox
        .requestFullscreen()
        .catch(() => {});
    }
  }
);


/* CHAT BUTTONS */

sendChatButton.addEventListener(
  "click",
  sendChat
);


chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendChat();
    }
  }
);


/* LEAVE */

leaveButton.addEventListener(
  "click",
  () => {

    if (
      confirm(
        "Leave this call?"
      )
    ) {

      if (
        ws &&
        ws.readyState ===
          WebSocket.OPEN
      ) {

        ws.send(
          JSON.stringify({
            type:
              "leaveRoom"
          })
        );
      }

      cleanupCall();
    }
  }
);


function cleanupCall() {

  currentRoom = null;
  selectedId = null;

  participants.clear();
  remoteStreams.clear();
  pendingCandidates.clear();

  for (
    const peer of
    peers.values()
  ) {

    try {
      peer.close();
    }

    catch {}
  }

  peers.clear();

  tiles.clear();

  thumbnails.innerHTML =
    "";

  participantList.innerHTML =
    "";

  chatMessages.innerHTML =
    "";

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream =
      null;
  }

  if (speakingTimer) {

    clearInterval(
      speakingTimer
    );

    speakingTimer =
      null;
  }

  if (audioContext) {

    audioContext.close()
      .catch(() => {});

    audioContext =
      null;
  }

  largeVideo.srcObject =
    null;

  app.style.display =
    "none";

  startScreen.style.display =
    "flex";

  setStatus(
    "You left the room."
  );

  createButton.disabled =
    false;

  joinButton.disabled =
    false;
}


/* START */

createButton.addEventListener(
  "click",
  createRoom
);

joinButton.addEventListener(
  "click",
  joinRoom
);


nameInput.value =
  localStorage.getItem(
    "blueberryDisplayName"
  ) || "";


nameInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {
      createRoom();
    }
  }
);


roomCodeInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {
      joinRoom();
    }
  }
);
</script>
