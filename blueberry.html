<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>Blueberry Moderator</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #0e0e0e;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding: 15px;
}

button,
input,
select {
  font: inherit;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 9px 13px;
  cursor: pointer;
  background: #333;
  color: white;
}

button:hover {
  background: #444;
}

.primary {
  background: #5865f2;
}

.green {
  background: #198754;
}

.danger {
  background: #d33;
}

.warning {
  background: #b8860b;
}

.hidden {
  display: none !important;
}

.login {
  max-width: 450px;
  margin: 100px auto;
  background: #1b1b1b;
  padding: 25px;
  border-radius: 15px;
}

input,
select {
  width: 100%;
  background: #101010;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
  padding: 11px;
  margin-top: 6px;
  margin-bottom: 12px;
}

label {
  display: block;
  margin-top: 10px;
}

.dashboard {
  max-width: 1500px;
  margin: auto;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}

.header h1 {
  margin: 0;
}

.header-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.layout-button.active {
  background: #5865f2;
}

.grid {
  display: grid;
  grid-template-columns:
    minmax(260px, 1fr)
    minmax(260px, 1fr)
    minmax(260px, 1fr);
  gap: 12px;
}

.panel {
  background: #191919;
  border-radius: 14px;
  padding: 15px;
  min-width: 0;
}

.panel h2 {
  margin-top: 0;
  font-size: 18px;
}

.room-card,
.person-card,
.ban-card,
.access-card,
.log-card {
  background: #242424;
  padding: 11px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.room-card strong,
.person-card strong {
  display: block;
}

.small {
  color: #aaa;
  font-size: 12px;
}

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.people-panel {
  margin-top: 12px;
}

.people-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(220px, 1fr));
  gap: 9px;
}

.call-layout {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    320px;
  gap: 12px;
  margin-top: 12px;
}

.main-video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 13px;
  overflow: hidden;
  position: relative;
}

#mainVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

.video-name {
  position: absolute;
  bottom: 8px;
  left: 8px;
  padding: 6px 9px;
  background: rgba(0,0,0,.7);
  border-radius: 7px;
}

.video-thumbnails {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 8px;
}

.video-thumb {
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 9px;
  overflow: hidden;
  border: 2px solid transparent;
}

.video-thumb.speaking {
  border-color: #28d17c;
}

.video-thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.chat {
  background: #191919;
  border-radius: 13px;
  min-height: 500px;
  display: flex;
  flex-direction: column;
}

.chat-title {
  padding: 12px;
  border-bottom: 1px solid #333;
  font-weight: bold;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.message {
  margin-bottom: 10px;
}

.message-name {
  font-weight: bold;
  font-size: 13px;
}

.message-text {
  overflow-wrap: anywhere;
}

.message-time {
  color: #888;
  font-size: 10px;
}

.chat-form {
  display: flex;
  gap: 6px;
  padding: 8px;
  border-top: 1px solid #333;
}

.chat-form input {
  margin: 0;
}

.chat-form button {
  white-space: nowrap;
}

.room-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

@media (max-width: 1000px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }

  .call-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 650px) {
  body {
    padding: 8px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .header-buttons button {
    flex: 1;
  }

  .people-grid {
    grid-template-columns: 1fr;
  }
}

.phone-mode .grid {
  grid-template-columns: 1fr;
}

.phone-mode .call-layout {
  grid-template-columns: 1fr;
}

.phone-mode .header-buttons button {
  flex: 1;
}
</style>
</head>

<body>

<div id="login" class="login">

  <h1>🫐 Moderator</h1>

  <label>
    Moderator name
    <input
      id="moderatorName"
      maxlength="40"
      placeholder="Moderator"
    >
  </label>

  <label>
    Moderator PIN
    <input
      id="moderatorPin"
      type="password"
      placeholder="Enter moderator PIN"
    >
  </label>

  <button
    id="loginButton"
    class="primary"
    style="width:100%;"
  >
    Enter Moderator Dashboard
  </button>

  <div
    id="loginStatus"
    class="small"
    style="margin-top:10px;"
  ></div>

</div>

<div id="dashboard" class="dashboard hidden">

  <div class="header">

    <h1>🫐 Moderator Dashboard</h1>

    <div class="header-buttons">

      <button
        id="autoLayout"
        class="layout-button active"
      >
        Auto
      </button>

      <button
        id="computerLayout"
        class="layout-button"
      >
        Computer
      </button>

      <button
        id="phoneLayout"
        class="layout-button"
      >
        Phone
      </button>

      <button
        id="leaveRoomButton"
        class="danger hidden"
      >
        Leave Room
      </button>

    </div>

  </div>

  <div class="grid">

    <section class="panel">
      <h2>Open Rooms</h2>
      <div id="rooms"></div>

      <hr>

      <h2>Create Room</h2>

      <label>
        Room name
        <input
          id="newRoomName"
          placeholder="Moderator Room"
        >
      </label>

      <label>
        Room code
        <input
          id="newRoomCode"
          placeholder="MODROOM"
        >
      </label>

      <button
        id="createRoomButton"
        class="primary"
      >
        Create Room
      </button>
    </section>

    <section class="panel">

      <h2>View People</h2>

      <div
        id="peopleStatus"
        class="small"
      >
        Join a room to view people.
      </div>

      <div
        id="people"
        class="people-grid"
      ></div>

    </section>

    <section class="panel">

      <h2>Banned Users</h2>

      <div id="bans"></div>

      <hr>

      <h2>Moderator Access</h2>

      <div id="access"></div>

    </section>

  </div>

  <section class="panel people-panel">

    <div class="room-title">

      <div>
        <h2 style="margin-bottom:3px;">
          Current Room
        </h2>

        <div
          id="currentRoomText"
          class="small"
        >
          No room joined
        </div>
      </div>

    </div>

    <div class="call-layout">

      <div>

        <div
          id="mainVideoContainer"
          class="main-video"
        >

          <video
            id="mainVideo"
            autoplay
            playsinline
          ></video>

          <div
            id="videoName"
            class="video-name"
          >
            No video selected
          </div>

        </div>

        <div
          id="videoThumbnails"
          class="video-thumbnails"
        ></div>

      </div>

      <div class="chat">

        <div class="chat-title">
          Room Chat
        </div>

        <div id="messages"></div>

        <form
          id="chatForm"
          class="chat-form"
        >
          <input
            id="chatInput"
            maxlength="500"
            placeholder="Moderator chat..."
          >

          <button class="primary">
            Send
          </button>
        </form>

      </div>

    </div>

  </section>

  <section class="panel" style="margin-top:12px;">

    <h2>Moderation History</h2>

    <div id="logs"></div>

  </section>

</div>

<script>
const ICE_CONFIG = {
  iceServers: [
    {
      urls:
        "stun:stun.l.google.com:19302"
    }
  ]
};

let ws = null;

let moderatorId =
  localStorage.getItem(
    "blueberryModeratorId"
  ) || crypto.randomUUID();

let moderatorLevel = null;
let moderatorName = "";

let currentRoom = null;

const peers = new Map();
const people = new Map();

let layoutMode =
  localStorage.getItem(
    "blueberryModeratorLayout"
  ) || "auto";

const login =
  document.getElementById("login");

const dashboard =
  document.getElementById(
    "dashboard"
  );

const roomsEl =
  document.getElementById("rooms");

const peopleEl =
  document.getElementById("people");

const bansEl =
  document.getElementById("bans");

const accessEl =
  document.getElementById("access");

const logsEl =
  document.getElementById("logs");

const messagesEl =
  document.getElementById("messages");

const mainVideo =
  document.getElementById("mainVideo");

const videoThumbnails =
  document.getElementById(
    "videoThumbnails"
  );

const videoName =
  document.getElementById("videoName");

function send(data) {
  if (
    ws &&
    ws.readyState === WebSocket.OPEN
  ) {
    ws.send(JSON.stringify(data));
  }
}

function connectModerator() {
  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  ws = new WebSocket(
    `${protocol}//${location.host}/ws`
  );

  ws.onopen = () => {
    send({
      type: "moderatorAuth",
      id: moderatorId,
      name: moderatorName,
      pin:
        document.getElementById(
          "moderatorPin"
        ).value
    });
  };

  ws.onclose = () => {
    if (dashboard.classList.contains("hidden")) {
      return;
    }

    alert(
      "Moderator connection closed."
    );

    location.reload();
  };

  ws.onerror = () => {
    document.getElementById(
      "loginStatus"
    ).textContent =
      "Connection error.";
  };

  ws.onmessage = event => {
    let data;

    try {
      data =
        JSON.parse(event.data);
    } catch {
      return;
    }

    handleMessage(data);
  };
}

function handleMessage(data) {

  if (data.type === "error") {
    document.getElementById(
      "loginStatus"
    ).textContent =
      data.message;

    return;
  }

  if (
    data.type ===
    "moderatorAuthSuccess"
  ) {
    moderatorLevel =
      data.level;

    moderatorId =
      data.id;

    localStorage.setItem(
      "blueberryModeratorId",
      moderatorId
    );

    login.classList.add("hidden");
    dashboard.classList.remove(
      "hidden"
    );

    renderRooms(
      data.rooms || []
    );

    renderBans(
      data.bans || []
    );

    renderAccess(
      data.moderatorAccess || []
    );

    renderLogs(
      data.logs || []
    );

    detectLayout();

    return;
  }

  if (
    data.type ===
    "moderatorRoomCreated"
  ) {
    return;
  }

  if (
    data.type ===
    "moderatorRoomJoined"
  ) {
    enterModeratorRoom(
      data.room,
      data.participants || [],
      data.messages || []
    );

    return;
  }

  if (
    data.type ===
    "roomPeopleChanged"
  ) {
    if (
      currentRoom &&
      data.room.code ===
        currentRoom.code
    ) {
      renderPeople(
        data.room.participants || []
      );
    }

    return;
  }

  if (data.type === "userJoined") {
    if (
      currentRoom
    ) {
      addPerson(
        data.participant
      );
    }

    return;
  }

  if (data.type === "userLeft") {
    removePerson(data.id);
    return;
  }

  if (data.type === "signal") {
    handleSignal(
      data.from,
      data.signal
    );

    return;
  }

  if (
    data.type === "chatMessage"
  ) {
    addChatMessage(
      data.message
    );

    return;
  }

  if (data.type === "kicked") {
    alert(
      "The user was kicked."
    );

    return;
  }

  if (data.type === "banned") {
    alert(
      "The user was banned."
    );

    return;
  }

  if (data.type === "moderatorData") {
    renderRooms(
      data.rooms || []
    );

    renderBans(
      data.bans || []
    );

    renderAccess(
      data.moderatorAccess || []
    );

    renderLogs(
      data.logs || []
    );

    return;
  }

  if (
    data.type ===
    "moderatorAccessCreated"
  ) {
    alert(
      `Moderator access created.\n\nName: ${data.name}\nPIN: ${data.pin}\nDuration: ${data.durationText}`
    );

    return;
  }

  if (
    data.type ===
    "moderatorAccessGranted"
  ) {
    alert(
      `You have been given moderator access.\n\nPIN: ${data.pin}\nDuration: ${data.durationText}`
    );

    return;
  }

  if (
    data.type ===
    "moderatorAccessExpired"
  ) {
    alert(
      "Your moderator access expired."
    );

    location.reload();

    return;
  }

  if (
    data.type ===
    "moderatorRevoked"
  ) {
    alert(
      "Your moderator access was revoked."
    );

    location.reload();

    return;
  }
}

function enterModeratorRoom(
  room,
  participants,
  oldMessages
) {
  currentRoom = room;

  people.clear();

  closeAllPeers();

  videoThumbnails.innerHTML = "";
  messagesEl.innerHTML = "";

  document
    .getElementById(
      "leaveRoomButton"
    )
    .classList.remove("hidden");

  document
    .getElementById(
      "currentRoomText"
    )
    .textContent =
    `${room.name} — ${room.code}`;

  for (
    const person of participants
  ) {
    addPerson(person);
  }

  for (
    const message of oldMessages
  ) {
    addChatMessage(message);
  }

  renderPeople(participants);

  setTimeout(() => {
    for (
      const person of participants
    ) {
      createModeratorPeer(
        person.id
      );
    }
  }, 100);
}

function addPerson(person) {
  if (!person) return;

  people.set(
    person.id,
    person
  );

  renderPeople(
    Array.from(
      people.values()
    )
  );

  if (currentRoom) {
    createModeratorPeer(
      person.id
    );
  }
}

function removePerson(id) {
  people.delete(id);

  const thumb =
    document.getElementById(
      `video-${id}`
    );

  if (thumb) {
    thumb.remove();
  }

  closePeer(id);

  renderPeople(
    Array.from(
      people.values()
    )
  );
}

function renderPeople(list) {
  peopleEl.innerHTML = "";

  document.getElementById(
    "peopleStatus"
  ).textContent =
    currentRoom
      ? `${list.length} person${list.length === 1 ? "" : "s"} in this room`
      : "Join a room to view people.";

  for (
    const person of list
  ) {
    const card =
      document.createElement("div");

    card.className =
      "person-card";

    const strong =
      document.createElement("strong");

    strong.textContent =
      person.name;

    const id =
      document.createElement("div");

    id.className = "small";

    id.textContent =
      person.id;

    const actions =
      document.createElement("div");

    actions.className =
      "actions";

    const kick =
      document.createElement("button");

    kick.className =
      "danger";

    kick.textContent =
      "Kick";

    // IMPORTANT:
    // No confirmation dialog.
    kick.addEventListener(
      "click",
      () => {
        kickPerson(person.id);
      }
    );

    const ban =
      document.createElement("button");

    ban.className =
      "warning";

    ban.textContent =
      "Ban";

    ban.addEventListener(
      "click",
      () => {
        banPerson(person.id);
      }
    );

    actions.appendChild(kick);
    actions.appendChild(ban);

    if (
      moderatorLevel ===
      "master"
    ) {
      const give =
        document.createElement(
          "button"
        );

      give.className =
        "primary";

      give.textContent =
        "Give Moderator";

      give.addEventListener(
        "click",
        () => {
          giveModerator(
            person
          );
        }
      );

      actions.appendChild(
        give
      );
    }

    card.appendChild(strong);
    card.appendChild(id);
    card.appendChild(actions);

    peopleEl.appendChild(card);
  }
}

function kickPerson(id) {
  // Directly sends the kick.
  // There is intentionally NO confirmation.
  send({
    type: "kick",
    targetId: id
  });
}

function banPerson(person) {
  const value =
    prompt(
      `Ban ${person.name} for how many units?\n\nExample: 10`
    );

  if (value === null) {
    return;
  }

  const unit =
    prompt(
      "Enter unit:\nseconds, minutes, hours, days, weeks, months, years\n\nOr type permanent"
    );

  if (unit === null) {
    return;
  }

  const cleaned =
    unit.trim().toLowerCase();

  if (
    cleaned ===
    "permanent"
  ) {
    send({
      type: "ban",
      targetId: person.id,
      permanent: true,
      value: 0,
      unit: "minutes"
    });

    return;
  }

  const allowed = [
    "seconds",
    "minutes",
    "hours",
    "days",
    "weeks",
    "months",
    "years"
  ];

  if (
    !allowed.includes(cleaned)
  ) {
    alert(
      "Invalid time unit."
    );
    return;
  }

  send({
    type: "ban",
    targetId: person.id,
    permanent: false,
    value: Number(value),
    unit: cleaned
  });
}

function giveModerator(person) {
  if (
    moderatorLevel !==
    "master"
  ) {
    return;
  }

  const pin =
    prompt(
      `Choose a moderator PIN for ${person.name}:`
    );

  if (
    pin === null ||
    pin.length < 4
  ) {
    return;
  }

  const duration =
    prompt(
      "How long should moderator access last?\n\nExample: 1"
    );

  if (duration === null) {
    return;
  }

  const unit =
    prompt(
      "Enter unit:\nseconds, minutes, hours, days, weeks, months, years\n\nOr type permanent"
    );

  if (unit === null) {
    return;
  }

  const cleaned =
    unit.trim().toLowerCase();

  if (
    cleaned ===
    "permanent"
  ) {
    send({
      type: "giveModerator",
      targetId: person.id,
      pin,
      permanent: true,
      value: 0,
      unit: "hours"
    });

    return;
  }

  const allowed = [
    "seconds",
    "minutes",
    "hours",
    "days",
    "weeks",
    "months",
    "years"
  ];

  if (
    !allowed.includes(cleaned)
  ) {
    alert(
      "Invalid time unit."
    );
    return;
  }

  send({
    type: "giveModerator",
    targetId: person.id,
    pin,
    permanent: false,
    value: Number(duration),
    unit: cleaned
  });
}

function renderRooms(list) {
  roomsEl.innerHTML = "";

  if (!list.length) {
    roomsEl.textContent =
      "No open rooms.";
    return;
  }

  for (
    const room of list
  ) {
    const card =
      document.createElement(
        "div"
      );

    card.className =
      "room-card";

    const title =
      document.createElement(
        "strong"
      );

    title.textContent =
      room.name;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "small";

    info.textContent =
      `${room.code} — ${room.participants} participant${room.participants === 1 ? "" : "s"}`;

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";

    const join =
      document.createElement(
        "button"
      );

    join.className =
      "primary";

    join.textContent =
      "Join Anonymous";

    join.addEventListener(
      "click",
      () => {
        joinModeratorRoom(
          room.code
        );
      }
    );

    const view =
      document.createElement(
        "button"
      );

    view.textContent =
      "View People";

    view.addEventListener(
      "click",
      () => {
        joinModeratorRoom(
          room.code
        );
      }
    );

    actions.appendChild(join);
    actions.appendChild(view);

    card.appendChild(title);
    card.appendChild(info);
    card.appendChild(actions);

    roomsEl.appendChild(card);
  }
}

function joinModeratorRoom(
  code
) {
  send({
    type: "moderatorJoinRoom",
    roomCode: code
  });
}

function leaveModeratorRoom() {
  send({
    type: "leaveRoom"
  });

  currentRoom = null;

  people.clear();

  closeAllPeers();

  videoThumbnails.innerHTML = "";

  messagesEl.innerHTML = "";

  mainVideo.srcObject = null;

  videoName.textContent =
    "No video selected";

  peopleEl.innerHTML = "";

  document.getElementById(
    "peopleStatus"
  ).textContent =
    "Join a room to view people.";

  document
    .getElementById(
      "currentRoomText"
    )
    .textContent =
    "No room joined";

  document
    .getElementById(
      "leaveRoomButton"
    )
    .classList.add("hidden");
}

function createModeratorPeer(
  remoteId
) {
  if (
    peers.has(remoteId)
  ) {
    return peers.get(
      remoteId
    ).pc;
  }

  const pc =
    new RTCPeerConnection(
      ICE_CONFIG
    );

  const state = {
    pc,
    remoteStream:
      new MediaStream(),
    pendingCandidates: []
  };

  peers.set(
    remoteId,
    state
  );

  pc.onicecandidate =
    event => {
      if (
        event.candidate
      ) {
        send({
          type: "signal",
          target: remoteId,
          signal: {
            type: "candidate",
            candidate:
              event.candidate
          }
        });
      }
    };

  pc.ontrack = event => {
    const stream =
      state.remoteStream;

    if (
      !stream
        .getTracks()
        .some(
          track =>
            track.id ===
            event.track.id
        )
    ) {
      stream.addTrack(
        event.track
      );
    }

    attachPersonVideo(
      remoteId,
      stream
    );
  };

  pc.onconnectionstatechange =
    () => {
      if (
        pc.connectionState ===
          "failed" ||
        pc.connectionState ===
          "closed"
      ) {
        closePeer(
          remoteId
        );
      }
    };

  return pc;
}

function attachPersonVideo(
  id,
  stream
) {
  const person =
    people.get(id);

  let box =
    document.getElementById(
      `video-${id}`
    );

  if (!box) {
    box =
      document.createElement(
        "div"
      );

    box.className =
      "video-thumb";

    box.id =
      `video-${id}`;

    const video =
      document.createElement(
        "video"
      );

    video.autoplay = true;
    video.playsInline = true;

    box.appendChild(video);

    box.addEventListener(
      "click",
      () => {
        mainVideo.srcObject =
          stream;

        videoName.textContent =
          person
            ? person.name
            : "Participant";

        mainVideo
          .play()
          .catch(() => {});
      }
    );

    videoThumbnails.appendChild(
      box
    );
  }

  const video =
    box.querySelector(
      "video"
    );

  video.srcObject =
    stream;

  video.autoplay = true;
  video.playsInline = true;

  // This is critical for moderator audio.
  video.muted = false;

  video.play().catch(error => {
    console.log(
      "Browser delayed audio/video playback:",
      error
    );
  });

  // Automatically show the first person.
  if (
    !mainVideo.srcObject
  ) {
    mainVideo.srcObject =
      stream;

    videoName.textContent =
      person
        ? person.name
        : "Participant";

    mainVideo
      .play()
      .catch(() => {});
  }
}

async function handleSignal(
  remoteId,
  signal
) {
  if (!signal) return;

  const pc =
    createModeratorPeer(
      remoteId
    );

  const state =
    peers.get(remoteId);

  try {

    if (
      signal.type ===
      "offer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          signal.sdp
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type: "signal",
        target: remoteId,
        signal: {
          type: "answer",
          sdp:
            pc.localDescription
        }
      });

      // Flush candidates.
      for (
        const candidate
        of state.pendingCandidates
      ) {
        await pc
          .addIceCandidate(
            candidate
          )
          .catch(() => {});
      }

      state.pendingCandidates =
        [];

      return;
    }

    if (
      signal.type ===
      "candidate"
    ) {

      if (
        pc.remoteDescription
      ) {
        await pc.addIceCandidate(
          signal.candidate
        );
      } else {
        state.pendingCandidates.push(
          signal.candidate
        );
      }

      return;
    }

  } catch (error) {
    console.error(
      "Moderator WebRTC error:",
      error
    );
  }
}

function closePeer(id) {
  const state =
    peers.get(id);

  if (!state) return;

  try {
    state.pc.close();
  } catch {}

  peers.delete(id);

  const box =
    document.getElementById(
      `video-${id}`
    );

  if (box) {
    box.remove();
  }
}

function closeAllPeers() {
  for (
    const id of peers.keys()
  ) {
    closePeer(id);
  }
}

function addChatMessage(
  message
) {
  if (!message) return;

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "message";

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "message-name";

  name.textContent =
    message.name;

  const text =
    document.createElement(
      "div"
    );

  text.className =
    "message-text";

  text.textContent =
    message.text;

  const time =
    document.createElement(
      "div"
    );

  time.className =
    "message-time";

  time.textContent =
    new Date(
      message.timestamp
    ).toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  item.appendChild(name);
  item.appendChild(text);
  item.appendChild(time);

  messagesEl.appendChild(
    item
  );

  messagesEl.scrollTop =
    messagesEl.scrollHeight;
}

function sendChat(event) {
  event.preventDefault();

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  send({
    type: "chatMessage",
    text
  });

  input.value = "";
}

function renderBans(list) {
  bansEl.innerHTML = "";

  if (!list.length) {
    bansEl.textContent =
      "No active bans.";
    return;
  }

  for (
    const ban of list
  ) {
    const card =
      document.createElement(
        "div"
      );

    card.className =
      "ban-card";

    const name =
      document.createElement(
        "strong"
      );

    name.textContent =
      ban.name;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "small";

    info.textContent =
      `${ban.durationText} — banned by ${ban.moderatorName}`;

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "green";

    button.textContent =
      "Unban";

    button.addEventListener(
      "click",
      () => {
        send({
          type: "unban",
          banId: ban.id
        });
      }
    );

    card.appendChild(name);
    card.appendChild(info);
    card.appendChild(button);

    bansEl.appendChild(card);
  }
}

function renderAccess(list) {
  accessEl.innerHTML = "";

  if (!list.length) {
    accessEl.textContent =
      "No moderator access records.";
    return;
  }

  for (
    const item of list
  ) {
    const card =
      document.createElement(
        "div"
      );

    card.className =
      "access-card";

    const name =
      document.createElement(
        "strong"
      );

    name.textContent =
      item.name;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "small";

    info.textContent =
      `${item.durationText} — created by ${item.createdBy}`;

    card.appendChild(name);
    card.appendChild(info);

    if (
      moderatorLevel ===
      "master"
    ) {
      const button =
        document.createElement(
          "button"
        );

      button.className =
        "danger";

      button.textContent =
        "Revoke";

      button.addEventListener(
        "click",
        () => {
          send({
            type:
              "revokeModerator",
            accessId:
              item.id
          });
        }
      );

      card.appendChild(
        button
      );
    }

    accessEl.appendChild(
      card
    );
  }
}

function renderLogs(list) {
  logsEl.innerHTML = "";

  if (!list.length) {
    logsEl.textContent =
      "No moderation actions yet.";
    return;
  }

  for (
    const log of list
  ) {
    const card =
      document.createElement(
        "div"
      );

    card.className =
      "log-card";

    const title =
      document.createElement(
        "strong"
      );

    title.textContent =
      `${log.action}: ${log.target}`;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "small";

    info.textContent =
      `${log.moderator} — ${new Date(log.time).toLocaleString()}${log.durationText ? ` — ${log.durationText}` : ""}`;

    card.appendChild(title);
    card.appendChild(info);

    logsEl.appendChild(card);
  }
}

function setLayout(mode) {
  layoutMode = mode;

  localStorage.setItem(
    "blueberryModeratorLayout",
    mode
  );

  document
    .querySelectorAll(
      ".layout-button"
    )
    .forEach(button => {
      button.classList.remove(
        "active"
      );
    });

  if (mode === "auto") {
    document
      .getElementById(
        "autoLayout"
      )
      .classList.add("active");
  }

  if (mode === "computer") {
    document
      .getElementById(
        "computerLayout"
      )
      .classList.add("active");
  }

  if (mode === "phone") {
    document
      .getElementById(
        "phoneLayout"
      )
      .classList.add("active");
  }

  detectLayout();
}

function detectLayout() {
  if (layoutMode === "phone") {
    document.body.classList.add(
      "phone-mode"
    );
    return;
  }

  if (layoutMode === "computer") {
    document.body.classList.remove(
      "phone-mode"
    );
    return;
  }

  if (
    window.innerWidth <= 800
  ) {
    document.body.classList.add(
      "phone-mode"
    );
  } else {
    document.body.classList.remove(
      "phone-mode"
    );
  }
}

document
  .getElementById(
    "autoLayout"
  )
  .addEventListener(
    "click",
    () => setLayout("auto")
  );

document
  .getElementById(
    "computerLayout"
  )
  .addEventListener(
    "click",
    () => setLayout("computer")
  );

document
  .getElementById(
    "phoneLayout"
  )
  .addEventListener(
    "click",
    () => setLayout("phone")
  );

window.addEventListener(
  "resize",
  detectLayout
);

const savedName =
  localStorage.getItem(
    "blueberryModeratorName"
  );

if (savedName) {
  document.getElementById(
    "moderatorName"
  ).value =
    savedName;
}

detectLayout();
