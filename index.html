<body>


<div id="home">

  <div class="homeBox">

    <h1>Video Chat</h1>

    <p>Choose your name:</p>

    <input
      id="nameInput"
      maxlength="30"
      placeholder="Your name"
    >

    <div class="section">

      <h3>Create a call</h3>

      <input
        id="newRoomName"
        maxlength="40"
        placeholder="Room name (example: Family Call)"
      >

      <input
        id="newRoomCode"
        maxlength="12"
        placeholder="Custom room code (optional)"
      >

      <button
        onclick="createRoom()"
        style="width:100%"
      >
        Create Room
      </button>

    </div>


    <div class="section">

      <h3>Join a call</h3>

      <input
        id="roomInput"
        maxlength="12"
        placeholder="Room code"
      >

      <button
        onclick="joinRoom()"
        style="width:100%"
      >
        Join Room
      </button>

    </div>

    <div id="status">
      Connecting...
    </div>

  </div>

</div>


<div id="call">

  <div id="roomTitle">
    Room
  </div>

  <div id="thumbs"></div>

  <div id="mainVideo">

    <div
      id="bigBox"
      onclick="toggleFullscreen()"
    >

      <video
        id="bigVideo"
        autoplay
        playsinline
      ></video>

      <div id="bigName">
        Select someone
      </div>

    </div>

  </div>


  <div id="controls">

    <button
      id="micButton"
      onclick="toggleMic()"
    >
      🎤
    </button>

    <button
      id="cameraButton"
      onclick="toggleCamera()"
    >
      📷
    </button>

    <button
      id="leave"
      onclick="leaveRoom()"
    >
      ☎
    </button>

  </div>

</div>


<script>

const SERVER =
  (location.protocol === "https:"
    ? "wss://"
    : "ws://") +
  location.host +
  "/ws";


let ws;

let myId =
  localStorage.getItem(
    "videoChatUserId"
  );

if (!myId) {

  myId =
    crypto.randomUUID();

  localStorage.setItem(
    "videoChatUserId",
    myId
  );

}


let myName =
  localStorage.getItem(
    "videoChatName"
  ) || "";

let localStream = null;

let peers = {};

let users = {};

let pendingCandidates = {};

let selectedUser = null;

let currentRoom = null;

let audioAnalyzers = {};

let speakingAnimation = {};

let joining = false;


const nameInput =
  document.getElementById(
    "nameInput"
  );

nameInput.value =
  myName;


nameInput.addEventListener(
  "input",
  () => {

    myName =
      nameInput.value.trim();

    localStorage.setItem(
      "videoChatName",
      myName
    );

    send({
      type: "setName",
      name: myName
    });

  }
);


function connect() {

  ws =
    new WebSocket(SERVER);

  ws.onopen = () => {

    document.getElementById(
      "status"
    ).textContent =
      "Connected";

    send({
      type: "register",
      role: "user",
      id: myId,
      name:
        myName || "Guest"
    });

  };


  ws.onmessage =
    async event => {

      const msg =
        JSON.parse(
          event.data
        );


      if (
        msg.type ===
        "roomCreated"
      ) {

        const room =
          msg.room;

        document.getElementById(
          "roomInput"
        ).value =
          room.code;

        alert(
          `Room created!\n\n` +
          `Name: ${room.name}\n` +
          `Code: ${room.code}`
        );

        return;
      }


      if (
        msg.type ===
        "roomJoined"
      ) {

        currentRoom =
          msg.room;

        users = {};

        pendingCandidates = {};


        msg.users.forEach(
          user => {

            users[user.id] =
              user;

          }
        );


        users[msg.self.id] = {
          id: msg.self.id,
          name:
            msg.self.name
        };


        showCall();


        for (
          const id of Object.keys(users)
        ) {

          if (
            id === myId
          ) {
            continue;
          }

          createPeer(
            id,
            myId < id
          );

        }

        return;
      }


      if (
        msg.type ===
        "userJoined"
      ) {

        users[msg.user.id] =
          msg.user;

        createPeer(
          msg.user.id,
          myId < msg.user.id
        );

        return;
      }


      if (
        msg.type ===
        "signal"
      ) {

        await handleSignal(
          msg.from,
          msg.data
        );

        return;
      }


      if (
        msg.type ===
        "userLeft"
      ) {

        removePeer(
          msg.userId
        );

        return;
      }


      if (
        msg.type === "kicked" ||
        msg.type === "banned"
      ) {

        alert(
          msg.message
        );

        location.reload();

        return;
      }


      if (
        msg.type ===
        "error"
      ) {

        alert(
          msg.message
        );

      }

    };


  ws.onclose = () => {

    document.getElementById(
      "status"
    ).textContent =
      "Disconnected — reconnecting...";

    setTimeout(
      connect,
      1500
    );

  };

}


function send(data) {

  if (
    ws &&
    ws.readyState ===
    WebSocket.OPEN
  ) {

    ws.send(
      JSON.stringify(data)
    );

  }

}


async function createRoom() {

  myName =
    nameInput.value.trim();

  if (!myName) {

    alert(
      "Choose your name first."
    );

    nameInput.focus();

    return;

  }


  const roomName =
    document.getElementById(
      "newRoomName"
    ).value.trim();


  const roomCode =
    document.getElementById(
      "newRoomCode"
    ).value.trim();


  if (!roomName) {

    alert(
      "Enter a room name."
    );

    return;

  }


  send({
    type: "createRoom",
    name: roomName,
    code: roomCode
  });

}


async function joinRoom() {

  if (joining) return;

  myName =
    nameInput.value.trim();

  const code =
    document.getElementById(
      "roomInput"
    ).value
      .trim()
      .toUpperCase();


  if (!myName) {

    alert(
      "Choose your name first."
    );

    nameInput.focus();

    return;

  }


  if (!code) {

    alert(
      "Enter a room code."
    );

    return;

  }


  if (
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ) {

    alert(
      "Still connecting to the server."
    );

    return;

  }


  joining = true;


  try {

    /*
     * IMPORTANT:
     *
     * Get the camera/mic BEFORE
     * joining the room.
     *
     * This prevents the other user
     * from sending an offer before
     * our media/peer connection is
     * ready.
     */

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true,
          audio: true
        });


    send({
      type: "setName",
      name: myName
    });


    send({
      type: "joinRoom",
      code
    });


  } catch (error) {

    console.error(
      error
    );

    alert(
      "Camera/microphone permission is required to join a normal call."
    );

    joining = false;

  }

}


function showCall() {

  document.getElementById(
    "home"
  ).style.display =
    "none";

  document.getElementById(
    "call"
  ).style.display =
    "block";


  document.getElementById(
    "roomTitle"
  ).textContent =
    currentRoom.name;


  addParticipant(
    myId,
    localStream
  );


  selectParticipant(
    myId
  );


  /*
   * Start detecting our own voice.
   */

  setupSpeakingDetection(
    myId,
    localStream
  );

}


function createPeer(
  remoteId,
  initiator
) {

  if (
    peers[remoteId]
  ) {

    return peers[remoteId];

  }


  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });


  peers[remoteId] =
    pc;


  pendingCandidates[remoteId] =
    [];


  /*
   * Add our camera/mic immediately.
   */

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "signal",

          target: remoteId,

          data: {
            type: "candidate",
            candidate:
              event.candidate
          }

        });

      }

    };


  pc.ontrack =
    event => {

      const stream =
        event.streams[0];

      if (!stream) {
        return;
      }


      addParticipant(
        remoteId,
        stream
      );


      setupSpeakingDetection(
        remoteId,
        stream
      );


      if (
        !selectedUser ||
        selectedUser ===
        myId
      ) {

        selectParticipant(
          remoteId
        );

      }

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        remoteId,
        "connection:",
        pc.connectionState
      );

      if (
        pc.connectionState ===
        "failed"
      ) {

        try {
          pc.restartIce();
        } catch {}

      }

    };


  if (initiator) {

    makeOffer(
      remoteId,
      pc
    );

  }


  return pc;
}


async function makeOffer(
  remoteId,
  pc
) {

  try {

    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    send({
      type: "signal",

      target: remoteId,

      data: {
        type: "offer",
        sdp:
          pc.localDescription
      }

    });

  } catch (error) {

    console.error(
      "Offer failed:",
      error
    );

  }

}


async function handleSignal(
  remoteId,
  data
) {

  let pc =
    peers[remoteId];


  if (!pc) {

    pc =
      createPeer(
        remoteId,
        false
      );

  }


  try {

    if (
      data.type ===
      "offer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );


      await flushCandidates(
        remoteId,
        pc
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      send({
        type: "signal",

        target: remoteId,

        data: {
          type: "answer",
          sdp:
            pc.localDescription
        }

      });

      return;

    }


    if (
      data.type ===
      "answer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );


      await flushCandidates(
        remoteId,
        pc
      );


      return;

    }


    if (
      data.type ===
      "candidate"
    ) {

      /*
       * ICE can arrive BEFORE the
       * offer/answer.
       *
       * Queue it until the remote
       * description exists.
       */

      if (
        pc.remoteDescription
      ) {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      } else {

        pendingCandidates[
          remoteId
        ].push(
          data.candidate
        );

      }

    }

  } catch (error) {

    console.error(
      "WebRTC signaling error:",
      error
    );

  }

}


async function flushCandidates(
  remoteId,
  pc
) {

  const queue =
    pendingCandidates[
      remoteId
    ] || [];


  pendingCandidates[
    remoteId
  ] = [];


  for (
    const candidate of queue
  ) {

    try {

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.error(
        "ICE candidate error:",
        error
      );

    }

  }

}


function addParticipant(
  id,
  stream
) {

  let box =
    document.getElementById(
      "thumb-" + id
    );


  if (!box) {

    box =
      document.createElement(
        "div"
      );

    box.className =
      "thumb";

    box.id =
      "thumb-" + id;


    box.onclick =
      () => {

        selectParticipant(
          id
        );

      };


    const video =
      document.createElement(
        "video"
      );

    video.autoplay = true;
    video.playsInline = true;

    video.muted =
      id === myId;

    video.srcObject =
      stream;


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "thumbName";

    name.textContent =
      users[id]?.name ||
      (id === myId
        ? myName
        : "Guest");


    box.appendChild(
      video
    );

    box.appendChild(
      name
    );


    document
      .getElementById(
        "thumbs"
      )
      .appendChild(
        box
      );


  } else {

    const video =
      box.querySelector(
        "video"
      );

    if (video) {

      video.srcObject =
        stream;

    }

  }

}


function selectParticipant(
  id
) {

  const box =
    document.getElementById(
      "thumb-" + id
    );

  if (!box) {
    return;
  }


  const video =
    box.querySelector(
      "video"
    );

  if (!video) {
    return;
  }


  selectedUser =
    id;


  document
    .querySelectorAll(
      ".thumb"
    )
    .forEach(
      element => {

        element.classList.remove(
          "selected"
        );

      }
    );


  box.classList.add(
    "selected"
  );


  const big =
    document.getElementById(
      "bigVideo"
    );


  big.srcObject =
    video.srcObject;

  big.muted =
    id === myId;


  document.getElementById(
    "bigName"
  ).textContent =
    users[id]?.name ||
    (id === myId
      ? myName
      : "Guest");

}


function setupSpeakingDetection(
  id,
  stream
) {

  if (
    audioAnalyzers[id]
  ) {
    return;
  }


  if (
    !stream ||
    !stream.getAudioTracks()
      .length
  ) {
    return;
  }


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const context =
      new AudioContext();


    const source =
      context.createMediaStreamSource(
        stream
      );


    const analyser =
      context.createAnalyser();


    analyser.fftSize =
      256;

    analyser.smoothingTimeConstant =
      0.75;


    source.connect(
      analyser
    );


    const data =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    audioAnalyzers[id] = {
      context,
      analyser,
      data
    };


    function check() {

      if (
        !audioAnalyzers[id]
      ) {
        return;
      }


      analyser.getByteFrequencyData(
        data
      );


      let total = 0;

      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        total += data[i];

      }


      const average =
        total / data.length;


      const box =
        document.getElementById(
          "thumb-" + id
        );


      /*
       * The threshold is deliberately
       * low enough to detect normal
       * speech.
       */

      if (
        box &&
        average > 10
      ) {

        box.classList.add(
          "speaking"
        );


        clearTimeout(
          speakingAnimation[id]
        );


        speakingAnimation[id] =
          setTimeout(
            () => {

              box.classList.remove(
                "speaking"
              );

            },
            500
          );

      }


      requestAnimationFrame(
        check
      );

    }


    check();

  } catch (error) {

    console.error(
      "Voice detection error:",
      error
    );

  }

}


function removePeer(
  id
) {

  if (
    peers[id]
  ) {

    try {
      peers[id].close();
    } catch {}

    delete peers[id];

  }


  delete pendingCandidates[
    id
  ];


  const box =
    document.getElementById(
      "thumb-" + id
    );


  if (box) {
    box.remove();
  }


  delete users[id];


  if (
    selectedUser === id
  ) {

    const remaining =
      Object.keys(users)
        .find(
          userId =>
            userId !==
            myId
        );


    if (remaining) {

      selectParticipant(
        remaining
      );

    } else {

      selectParticipant(
        myId
      );

    }

  }

}


function toggleMic() {

  if (!localStream) {
    return;
  }


  const track =
    localStream
      .getAudioTracks()[0];


  if (!track) {
    return;
  }


  track.enabled =
    !track.enabled;


  document.getElementById(
    "micButton"
  ).textContent =
    track.enabled
      ? "🎤"
      : "🔇";

}


function toggleCamera() {

  if (!localStream) {
    return;
  }


  const track =
    localStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  track.enabled =
    !track.enabled;


  document.getElementById(
    "cameraButton"
  ).textContent =
    track.enabled
      ? "📷"
      : "🚫";

}


async function toggleFullscreen() {

  const box =
    document.getElementById(
      "bigBox"
    );


  if (
    !document.fullscreenElement
  ) {

    try {

      await box.requestFullscreen();

    } catch (error) {

      console.error(
        error
      );

    }

  } else {

    await document.exitFullscreen();

  }

}


function leaveRoom() {

  send({
    type: "leaveRoom"
  });


  Object.values(
    peers
  ).forEach(
    pc => {

      try {
        pc.close();
      } catch {}

    }
  );


  peers = {};

  pendingCandidates = {};


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  localStream =
    null;


  location.reload();

}


connect();

</script>

</body>
</html>
