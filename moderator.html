<style>

<body>

<div id="layout">

  <div id="callArea">

    <div id="thumbs"></div>

    <div id="mainVideo">

      <div
        id="bigBox"
        onclick="toggleFullscreen()"
      >

        <video
          id="bigVideo"
          autoplay
          playsinline
        ></video>

        <div id="bigName">
          Select a participant
        </div>

      </div>

    </div>

    <div id="controls">

      <button
        id="micButton"
        onclick="toggleMic()"
      >
        🎤
      </button>

        id="cameraButton"
        onclick="toggleCamera()"
      >
        📷
      </button>

      <button
        id="leave"
        onclick="leaveRoom()"
      >
        ☎
      </button>

    </div>

  </div>


  <aside id="dashboard">

    <h2>Moderator</h2>

    <div id="status">
      Connecting...
    </div>

    <input
      id="moderatorName"
      maxlength="30"
      placeholder="Your moderator name"
    >

    <button
      onclick="createRoom()"
      style="width:100%"
    >
      + Create Room
    </button>

    <div id="joinInfo">
      Select a room below to join it.
    </div>

    <hr
      style="
        border:0;
        border-top:1px solid #303640;
        margin:18px 0;
      "
    >

    <h3>Open Calls</h3>

    <div id="rooms">
      Loading rooms...
    </div>

  </aside>

</div>


<script>

const SERVER =
  (location.protocol === "https:" ? "wss://" : "ws://") +
  location.host +
  "/ws";

let ws;

let moderatorId =
  localStorage.getItem(
    "videoChatModeratorId"
  );

if (!moderatorId) {

  moderatorId =
    crypto.randomUUID();

  localStorage.setItem(
    "videoChatModeratorId",
    moderatorId
  );

}

let moderatorName =
  localStorage.getItem(
    "videoChatModeratorName"
  ) || "";

let localStream = null;

let peers = {};

let users = {};

let selectedUser = null;

let currentRoom = null;

let anonymousMode = false;

let audioAnalyzers = {};

let speakingTimers = {};

document.getElementById(
  "moderatorName"
).value =
  moderatorName;

document.getElementById(
  "moderatorName"
).addEventListener(
  "input",
  event => {

    moderatorName =
      event.target.value;

    localStorage.setItem(
      "videoChatModeratorName",
      moderatorName
    );

  }
);

function connect() {

  ws =
    new WebSocket(SERVER);

  ws.onopen = () => {

    document.getElementById(
      "status"
    ).textContent =
      "Connected";

    ws.send(JSON.stringify({
      type: "register",
      role: "moderator",
      id: moderatorId,
      name:
        moderatorName || "Moderator"
    }));

  };

  ws.onmessage = async event => {

    const msg =
      JSON.parse(event.data);

    if (
      msg.type === "roomList" ||
      msg.type === "roomsUpdated"
    ) {

      renderRooms(
        msg.rooms
      );

      return;
    }

    if (
      msg.type === "roomCreated"
    ) {

      renderRoomsFromCurrent();

      return;
    }

    if (
      msg.type === "roomJoined"
    ) {

      currentRoom =
        msg.room;

      users = {};

      msg.users.forEach(user => {

        users[user.id] =
          user;

      });

      users[msg.self.id] = {
        id: msg.self.id,
        name:
          anonymousMode
            ? "Moderator"
            : msg.self.name
      };

      await setupCall();

      document.getElementById(
        "joinInfo"
      ).textContent =
        "Joined room " +
        currentRoom +
        (
          anonymousMode
            ? " anonymously"
            : ""
        );

      return;
    }

    if (
      msg.type === "userJoined"
    ) {

      users[msg.user.id] =
        msg.user;

      createPeer(
        msg.user.id,
        moderatorId < msg.user.id
      );

      return;
    }

    if (
      msg.type === "signal"
    ) {

      await handleSignal(
        msg.from,
        msg.data
      );

      return;
    }

    if (
      msg.type === "userLeft"
    ) {

      removePeer(
        msg.userId
      );

      return;
    }

    if (
      msg.type === "kicked" ||
      msg.type === "banned"
    ) {

      alert(msg.message);

      location.reload();

      return;
    }

    if (
      msg.type === "error"
    ) {

      alert(msg.message);

      return;
    }

  };

  ws.onclose = () => {

    document.getElementById(
      "status"
    ).textContent =
      "Disconnected — reconnecting...";

    setTimeout(
      connect,
      1500
    );

  };

}

function send(data) {

  if (
    ws &&
    ws.readyState ===
    WebSocket.OPEN
  ) {

    ws.send(
      JSON.stringify(data)
    );

  }

}

function createRoom() {

  send({
    type:
      "moderatorCreateRoom"
  });

}

function joinNormal(code) {

  anonymousMode = false;

  send({
    type:
      "moderatorJoinRoom",
    code,
    anonymous: false
  });

}

function joinAnonymous(code) {

  anonymousMode = true;

  send({
    type:
      "moderatorJoinRoom",
    code,
    anonymous: true
  });

}

function kick(userId) {

  if (
    confirm(
      "Kick this participant?"
    )
  ) {

    send({
      type: "kick",
      userId
    });

  }

}

function ban(userId) {

  if (
    confirm(
      "Ban this participant?"
    )
  ) {

    send({
      type: "ban",
      userId
    });

  }

}

function renderRooms(rooms) {

  const container =
    document.getElementById(
      "rooms"
    );

  if (!rooms.length) {

    container.innerHTML =
      "<p>No open calls.</p>";

    return;

  }

  container.innerHTML = "";

  rooms.forEach(room => {

    const card =
      document.createElement("div");

    card.className =
      "roomCard";

    const header =
      document.createElement("div");

    header.className =
      "roomHeader";

    header.innerHTML = `
      <span class="roomCode">
        ${escapeHtml(room.code)}
      </span>

      <span class="count">
        ${room.userCount} participant${room.userCount === 1 ? "" : "s"}
      </span>
    `;

    card.appendChild(header);

    room.participants.forEach(
      participant => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "participant";

        const name =
          document.createElement(
            "span"
          );

        name.className =
          "participantName";

        name.textContent =
          participant.name;

        row.appendChild(name);

        if (
          participant.role !==
          "moderator"
        ) {

          const buttons =
            document.createElement(
              "span"
            );

          buttons.innerHTML = `
            <button
              class="kick"
              onclick="kick('${participant.id}')"
            >
              Kick
            </button>

            <button
              class="ban"
              onclick="ban('${participant.id}')"
            >
              Ban
            </button>
          `;

          row.appendChild(
            buttons
          );

        }

        card.appendChild(row);

      }
    );

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";

    const normal =
      document.createElement(
        "button"
      );

    normal.textContent =
      "Join Normally";

    normal.onclick =
      () => joinNormal(room.code);

    const anon =
      document.createElement(
        "button"
      );

    anon.className =
      "secondary";

    anon.textContent =
      "Anonymous";

    anon.onclick =
      () => joinAnonymous(room.code);

    actions.appendChild(
      normal
    );

    actions.appendChild(
      anon
    );

    card.appendChild(
      actions
    );

    container.appendChild(
      card
    );

  });

}

let lastRooms = [];

function renderRoomsFromCurrent() {

  /*
   * The next roomsUpdated message
   * will refresh this automatically.
   */

}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

async function setupCall() {

  /*
   * Anonymous moderator:
   * don't ask for camera/mic.
   */

  if (!anonymousMode) {

    try {

      localStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true,
            audio: true
          });

      addParticipant(
        moderatorId,
        localStream
      );

      selectParticipant(
        moderatorId
      );

    } catch (error) {

      alert(
        "Camera/microphone permission was denied."
      );

      return;

    }

  }

  for (
    const id of Object.keys(users)
  ) {

    if (
      id === moderatorId
    ) continue;

    createPeer(
      id,
      moderatorId < id
    );

  }

}

function createPeer(
  remoteId,
  initiator
) {

  if (peers[remoteId]) {
    return peers[remoteId];
  }

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers[remoteId] =
    pc;

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "signal",
          target: remoteId,
          data: {
            type: "candidate",
            candidate:
              event.candidate
          }
        });

      }

    };

  pc.ontrack =
    event => {

      const stream =
        event.streams[0];

      if (!stream) return;

      addParticipant(
        remoteId,
        stream
      );

      setupSpeakingDetection(
        remoteId,
        stream
      );

      if (!selectedUser) {

        selectParticipant(
          remoteId
        );

      }

    };

  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
        "failed"
      ) {

        try {
          pc.restartIce();
        } catch {}

      }

    };

  if (initiator) {

    makeOffer(
      remoteId,
      pc
    );

  }

  return pc;
}

async function makeOffer(
  remoteId,
  pc
) {

  try {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "signal",
      target: remoteId,
      data: {
        type: "offer",
        sdp:
          pc.localDescription
      }
    });

  } catch (error) {

    console.error(
      error
    );

  }

}

async function handleSignal(
  remoteId,
  data
) {

  let pc =
    peers[remoteId];

  if (!pc) {

    pc =
      createPeer(
        remoteId,
        false
      );

  }

  try {

    if (
      data.type ===
      "offer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type: "signal",
        target: remoteId,
        data: {
          type: "answer",
          sdp:
            pc.localDescription
        }
      });

    }

    else if (
      data.type ===
      "answer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );

    }

    else if (
      data.type ===
      "candidate"
    ) {

      if (
        pc.remoteDescription
      ) {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    }

  } catch (error) {

    console.error(
      "Signal error:",
      error
    );

  }

}

function addParticipant(
  id,
  stream
) {

  let box =
    document.getElementById(
      "thumb-" + id
    );

  if (!box) {

    box =
      document.createElement(
        "div"
      );

    box.className =
      "thumb";

    box.id =
      "thumb-" + id;

    box.onclick =
      () => selectParticipant(id);

    const video =
      document.createElement(
        "video"
      );

    video.autoplay = true;
    video.playsInline = true;
    video.muted =
      id === moderatorId;

    video.srcObject =
      stream;

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "thumbName";

    name.textContent =
      users[id]?.name ||
      "Guest";

    box.appendChild(
      video
    );

    box.appendChild(
      name
    );

    document
      .getElementById(
        "thumbs"
      )
      .appendChild(
        box
      );

  } else {

    const video =
      box.querySelector(
        "video"
      );

    if (video) {

      video.srcObject =
        stream;

    }

  }

}

function selectParticipant(id) {

  const box =
    document.getElementById(
      "thumb-" + id
    );

  if (!box) return;

  const video =
    box.querySelector(
      "video"
    );

  if (!video) return;

  selectedUser =
    id;

  document
    .querySelectorAll(
      ".thumb"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );

  box.classList.add(
    "selected"
  );

  const big =
    document.getElementById(
      "bigVideo"
    );

  big.srcObject =
    video.srcObject;

  big.muted =
    id === moderatorId;

  document.getElementById(
    "bigName"
  ).textContent =
    users[id]?.name ||
    "Guest";

}

function setupSpeakingDetection(
  id,
  stream
) {

  if (
    audioAnalyzers[id] ||
    !stream.getAudioTracks()
      .length
  ) {
    return;
  }

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const context =
      new AudioContext();

    const source =
      context.createMediaStreamSource(
        stream
      );

    const analyser =
      context.createAnalyser();

    analyser.fftSize =
      256;

    source.connect(
      analyser
    );

    const data =
      new Uint8Array(
        analyser.frequencyBinCount
      );

    audioAnalyzers[id] = {
      analyser,
      data
    };

    function check() {

      if (
        !audioAnalyzers[id]
      ) {
        return;
      }

      analyser.getByteFrequencyData(
        data
      );

      let total = 0;

      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        total += data[i];

      }

      const average =
        total / data.length;

      const box =
        document.getElementById(
          "thumb-" + id
        );

      if (
        box &&
        average > 20
      ) {

        box.classList.add(
          "speaking"
        );

        clearTimeout(
          speakingTimers[id]
        );

        speakingTimers[id] =
          setTimeout(
            () => {

              box.classList.remove(
                "speaking"
              );

            },
            500
          );

      }

      requestAnimationFrame(
        check
      );

    }

    check();

  } catch (error) {

    console.error(
      error
    );

  }

}

function removePeer(id) {

  if (peers[id]) {

    try {
      peers[id].close();
    } catch {}

    delete peers[id];

  }

  const box =
    document.getElementById(
      "thumb-" + id
    );

  if (box) {
    box.remove();
  }

  delete users[id];

  if (
    selectedUser === id
  ) {

    selectedUser =
      null;

    const remaining =
      Object.keys(users)
        .find(
          userId =>
            userId !==
            moderatorId
        );

    if (remaining) {

      selectParticipant(
        remaining
      );

    }

  }

}

function leaveRoom() {

  send({
    type: "leaveRoom"
  });

  Object.values(peers)
    .forEach(
      pc => {

        try {
          pc.close();
        } catch {}

      }
    );

  peers = {};

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }

  localStream =
    null;

  currentRoom =
    null;

  anonymousMode =
    false;

  document.getElementById(
    "thumbs"
  ).innerHTML = "";

  document.getElementById(
    "bigVideo"
  ).srcObject =
    null;

  document.getElementById(
    "bigName"
  ).textContent =
    "Select a participant";

  document.getElementById(
    "joinInfo"
  ).textContent =
    "Select a room below to join it.";

}

function toggleMic() {

  if (!localStream) return;

  const track =
    localStream
      .getAudioTracks()[0];

  if (!track) return;

  track.enabled =
    !track.enabled;

  document.getElementById(
    "micButton"
  ).textContent =
    track.enabled
      ? "🎤"
      : "🔇";

}

function toggleCamera() {

  if (!localStream) return;

  const track =
    localStream
      .getVideoTracks()[0];

  if (!track) return;

  track.enabled =
    !track.enabled;

  document.getElementById(
    "cameraButton"
  ).textContent =
    track.enabled
      ? "📷"
      : "🚫";

}

async function toggleFullscreen() {

  const box =
    document.getElementById(
      "bigBox"
    );

  if (!document.fullscreenElement) {

    try {

      await box.requestFullscreen();

    } catch (error) {

      console.error(
        error
      );

    }

  } else {

    await document.exitFullscreen();

  }

}

connect();

</script>

</body>
</html>
