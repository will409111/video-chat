<!DOCTYPE html>
<html lang="en">

<title>Video Chat</title>

<style>

body {

<body>

<div id="home">

  <div class="homeBox">

    <h1>Video Chat</h1>

    <p>Choose your name:</p>

    <input
      id="nameInput"
      maxlength="30"
      placeholder="Your name"
    >

    <button onclick="createRoom()">
      Create Room
    </button>

    <br><br>

    <input
      id="roomInput"
      maxlength="5"
      placeholder="Room code"
      style="text-transform:uppercase"
    >

    <button onclick="joinRoom()">
      Join Room
    </button>

    <div class="roomList">

      <h3>Open Calls</h3>

      <div id="rooms">
        Loading...
      </div>

    </div>

  </div>

</div>


<div id="call">

  <div id="videoArea">

    <div id="thumbs"></div>

    <div id="mainVideo">

      <div id="bigBox" onclick="toggleFullscreen()">

        <video
          id="bigVideo"
          autoplay
          playsinline
        ></video>

        <div id="bigName">
          No video selected
        </div>

      </div>

    </div>

  </div>

  <div id="controls">

    <button onclick="toggleMic()" id="micButton">
      🎤
    </button>

    <button onclick="toggleCamera()" id="cameraButton">
      📷
    </button>

    <button onclick="leaveRoom()" id="leave">
      ☎
    </button>

  </div>

</div>


<script>

const SERVER =
  (location.protocol === "https:" ? "wss://" : "ws://") +
  location.host +
  "/ws";

let ws;

let myId =
  localStorage.getItem("videoChatUserId");

if (!myId) {
  myId =
    crypto.randomUUID();

  localStorage.setItem(
    "videoChatUserId",
    myId
  );
}

let myName = "";

let localStream = null;

let peers = {};

let users = {};

let selectedUser = null;

let audioAnalyzers = {};

let speakingTimers = {};

function connect() {

  ws = new WebSocket(SERVER);

  ws.onopen = () => {

    ws.send(JSON.stringify({
      type: "register",
      role: "user",
      id: myId,
      name: myName || "Guest"
    }));

  };

  ws.onmessage = async event => {

    const msg =
      JSON.parse(event.data);

    if (msg.type === "roomCreated") {

      document.getElementById(
        "roomInput"
      ).value = msg.code;

      alert(
        "Room created: " + msg.code
      );

      return;
    }

    if (msg.type === "roomJoined") {

      users = {};

      msg.users.forEach(user => {
        users[user.id] = user;
      });

      users[msg.self.id] = {
        id: msg.self.id,
        name: msg.self.name
      };

      await setupCall();

      return;
    }

    if (msg.type === "userJoined") {

      users[msg.user.id] = msg.user;

      createPeer(
        msg.user.id,
        myId < msg.user.id
      );

      return;
    }

    if (msg.type === "signal") {

      await handleSignal(
        msg.from,
        msg.data
      );

      return;
    }

    if (msg.type === "userLeft") {

      removePeer(msg.userId);

      return;
    }

    if (msg.type === "kicked" ||
        msg.type === "banned") {

      alert(msg.message);

      location.reload();

      return;
    }

    if (msg.type === "error") {

      alert(msg.message);

      return;
    }
  };

  ws.onclose = () => {

    setTimeout(() => {

      if (!ws ||
          ws.readyState !== WebSocket.OPEN) {

        connect();

      }

    }, 1500);

  };
}

function send(data) {

  if (
    ws &&
    ws.readyState === WebSocket.OPEN
  ) {
    ws.send(JSON.stringify(data));
  }
}

async function setupCall() {

  document.getElementById(
    "home"
  ).style.display = "none";

  document.getElementById(
    "call"
  ).style.display = "block";

  localStream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

  users[myId] = {
    id: myId,
    name: myName
  };

  addParticipant(
    myId,
    localStream
  );

  selectParticipant(myId);

  /*
   * Create connections to everyone
   * already in the room.
   *
   * Only the participant with the
   * lower ID starts the offer.
   */

  for (const id of Object.keys(users)) {

    if (id === myId) continue;

    createPeer(
      id,
      myId < id
    );
  }
}

function createPeer(remoteId, initiator) {

  if (peers[remoteId]) {
    return peers[remoteId];
  }

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers[remoteId] = pc;

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  pc.onicecandidate = event => {

    if (event.candidate) {

      send({
        type: "signal",
        target: remoteId,
        data: {
          type: "candidate",
          candidate:
            event.candidate
        }
      });

    }

  };

  pc.ontrack = event => {

    const stream =
      event.streams[0];

    if (!stream) return;

    addParticipant(
      remoteId,
      stream
    );

    setupSpeakingDetection(
      remoteId,
      stream
    );

    if (
      !selectedUser ||
      selectedUser === myId
    ) {

      selectParticipant(
        remoteId
      );

    }

  };

  pc.onconnectionstatechange = () => {

    const state =
      pc.connectionState;

    if (
      state === "failed" ||
      state === "closed" ||
      state === "disconnected"
    ) {

      /*
       * Give the connection a moment
       * before destroying it. This helps
       * with temporary network changes.
       */

      setTimeout(() => {

        if (
          pc.connectionState ===
          "failed" ||
          pc.connectionState ===
          "closed"
        ) {

          removePeer(remoteId);

        }

      }, 3000);

    }

  };

  if (initiator) {

    makeOffer(
      remoteId,
      pc
    );

  }

  return pc;
}

async function makeOffer(
  remoteId,
  pc
) {

  try {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "signal",
      target: remoteId,
      data: {
        type: "offer",
        sdp: pc.localDescription
      }
    });

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  }
}

async function handleSignal(
  remoteId,
  data
) {

  let pc =
    peers[remoteId];

  if (!pc) {

    pc =
      createPeer(
        remoteId,
        false
      );

  }

  try {

    if (data.type === "offer") {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type: "signal",
        target: remoteId,
        data: {
          type: "answer",
          sdp: pc.localDescription
        }
      });

    }

    else if (
      data.type === "answer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );

    }

    else if (
      data.type === "candidate"
    ) {

      if (
        pc.remoteDescription
      ) {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    }

  } catch (error) {

    console.error(
      "WebRTC error:",
      error
    );

  }
}

function addParticipant(
  id,
  stream
) {

  let box =
    document.getElementById(
      "thumb-" + id
    );

  if (!box) {

    box =
      document.createElement("div");

    box.className = "thumb";

    box.id =
      "thumb-" + id;

    box.onclick = () => {

      selectParticipant(id);

    };

    const video =
      document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.muted = id === myId;

    video.srcObject =
      stream;

    const name =
      document.createElement("div");

    name.className = "name";

    name.id =
      "name-" + id;

    name.textContent =
      users[id]?.name ||
      (id === myId
        ? myName
        : "Guest");

    box.appendChild(video);
    box.appendChild(name);

    document
      .getElementById("thumbs")
      .appendChild(box);

  } else {

    const video =
      box.querySelector("video");

    if (
      video &&
      video.srcObject !== stream
    ) {

      video.srcObject =
        stream;

    }

  }
}

function selectParticipant(id) {

  const box =
    document.getElementById(
      "thumb-" + id
    );

  if (!box) return;

  const video =
    box.querySelector("video");

  if (!video) return;

  selectedUser = id;

  document
    .querySelectorAll(".thumb")
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });

  box.classList.add("selected");

  const big =
    document.getElementById(
      "bigVideo"
    );

  big.srcObject =
    video.srcObject;

  big.muted =
    id === myId;

  document.getElementById(
    "bigName"
  ).textContent =
    users[id]?.name ||
    (id === myId
      ? myName
      : "Guest");
}

function setupSpeakingDetection(
  id,
  stream
) {

  if (
    audioAnalyzers[id] ||
    !stream.getAudioTracks().length
  ) {
    return;
  }

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const context =
      new AudioContext();

    const source =
      context.createMediaStreamSource(
        stream
      );

    const analyser =
      context.createAnalyser();

    analyser.fftSize = 256;

    source.connect(analyser);

    const data =
      new Uint8Array(
        analyser.frequencyBinCount
      );

    audioAnalyzers[id] = {
      context,
      analyser,
      data
    };

    function check() {

      if (
        !audioAnalyzers[id]
      ) {
        return;
      }

      analyser.getByteFrequencyData(
        data
      );

      let total = 0;

      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        total += data[i];

      }

      const average =
        total / data.length;

      const box =
        document.getElementById(
          "thumb-" + id
        );

      if (
        box &&
        average > 20
      ) {

        box.classList.add(
          "speaking"
        );

        clearTimeout(
          speakingTimers[id]
        );

        speakingTimers[id] =
          setTimeout(() => {

            box.classList.remove(
              "speaking"
            );

          }, 500);

      }

      requestAnimationFrame(
        check
      );

    }

    check();

  } catch (error) {

    console.error(
      "Audio detection error:",
      error
    );

  }
}

function removePeer(id) {

  if (peers[id]) {

    try {
      peers[id].close();
    } catch {}

    delete peers[id];

  }

  const box =
    document.getElementById(
      "thumb-" + id
    );

  if (box) {
    box.remove();
  }

  delete users[id];

  if (
    selectedUser === id
  ) {

    const remaining =
      Object.keys(users)
        .find(id2 => id2 !== myId);

    if (remaining) {

      selectParticipant(
        remaining
      );

    } else {

      selectParticipant(myId);

    }

  }
}

function createRoom() {

  myName =
    document.getElementById(
      "nameInput"
    ).value.trim();

  if (!myName) {

    alert(
      "Please choose a name first."
    );

    return;

  }

  send({
    type: "createRoom"
  });
}

async function joinRoom() {

  myName =
    document.getElementById(
      "nameInput"
    ).value.trim();

  const code =
    document.getElementById(
      "roomInput"
    ).value
      .trim()
      .toUpperCase();

  if (!myName) {

    alert(
      "Please choose a name first."
    );

    return;

  }

  if (!code) {

    alert(
      "Enter a room code."
    );

    return;

  }

  send({
    type: "joinRoom",
    code
  });
}

function leaveRoom() {

  send({
    type: "leaveRoom"
  });

  Object.values(peers)
    .forEach(pc => {

      try {
        pc.close();
      } catch {}

    });

  peers = {};

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }

  location.reload();
}

function toggleMic() {

  if (!localStream) return;

  const track =
    localStream.getAudioTracks()[0];

  if (!track) return;

  track.enabled =
    !track.enabled;

  document.getElementById(
    "micButton"
  ).textContent =
    track.enabled
      ? "🎤"
      : "🔇";
}

function toggleCamera() {

  if (!localStream) return;

  const track =
    localStream.getVideoTracks()[0];

  if (!track) return;

  track.enabled =
    !track.enabled;

  document.getElementById(
    "cameraButton"
  ).textContent =
    track.enabled
      ? "📷"
      : "🚫";
}

async function toggleFullscreen() {

  const box =
    document.getElementById(
      "bigBox"
    );

  if (!document.fullscreenElement) {

    try {

      await box.requestFullscreen();

    } catch (error) {

      console.error(error);

    }

  } else {

    await document.exitFullscreen();

  }
}

function loadRooms() {

  /*
   * Normal users don't need the
   * complete authoritative room list
   * from the server in this version.
   *
   * They can create or join by code.
   */

  document.getElementById(
    "rooms"
  ).innerHTML =
    "<p>Enter a room code to join a call.</p>";

}

document.getElementById(
  "nameInput"
).value =
  localStorage.getItem(
    "videoChatName"
  ) || "";

document.getElementById(
  "nameInput"
).addEventListener(
  "input",
  event => {

    localStorage.setItem(
      "videoChatName",
      event.target.value
    );

  }
);

myName =
  document.getElementById(
    "nameInput"
  ).value.trim();

connect();

loadRooms();

</script>

</body>
</html>
