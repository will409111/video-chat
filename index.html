<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blueberry Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

#joinScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 460px;
  background: #1b1d22;
  border-radius: 22px;
  padding: 30px;
  box-shadow: 0 15px 50px rgba(0,0,0,.4);
}

h1 {
  margin-top: 0;
  text-align: center;
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 7px;
  color: #bbb;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #3a3d44;
  border-radius: 12px;
  background: #111216;
  color: white;
  outline: none;
}

input:focus {
  border-color: #6d7cff;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  background: #5968ff;
  color: white;
  font-weight: bold;
}

button:hover {
  filter: brightness(1.1);
}

.secondary {
  background: #30333a;
}

.danger {
  background: #d83b4b;
}

.row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.row button {
  flex: 1;
}

#status {
  min-height: 24px;
  text-align: center;
  margin-top: 16px;
  color: #aaa;
}

#roomScreen {
  display: none;
  min-height: 100vh;
  flex-direction: column;
}

.topbar {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #181a1f;
  border-bottom: 1px solid #2b2d33;
}

.roomTitle {
  font-weight: bold;
}

.roomCode {
  color: #999;
  font-size: 13px;
}

#videoArea {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 12px;
}

#largeArea {
  flex: 1;
  min-height: 55vh;
  position: relative;
  background: #08090b;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid transparent;
}

#largeVideo {
  width: 100%;
  height: 100%;
  min-height: 55vh;
  object-fit: contain;
  background: #050506;
  cursor: pointer;
}

#largeName {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: rgba(0,0,0,.65);
  padding: 7px 10px;
  border-radius: 9px;
}

#thumbnails {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  min-height: 105px;
}

.tile {
  width: 150px;
  min-width: 150px;
  height: 95px;
  position: relative;
  background: #08090b;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid transparent;
  cursor: pointer;
}

.tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tileName {
  position: absolute;
  left: 6px;
  bottom: 5px;
  font-size: 12px;
  background: rgba(0,0,0,.65);
  padding: 4px 6px;
  border-radius: 6px;
}

.speaking {
  border-color: #22c55e !important;
}

#controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 12px;
  background: #181a1f;
}

@media (max-width: 600px) {
  #largeArea,
  #largeVideo {
    min-height: 45vh;
  }

  .tile {
    width: 120px;
    min-width: 120px;
  }
}
</style>
</head>

<body>

<div id="joinScreen">
  <div class="card">
    <h1>Blueberry Video Chat</h1>

    <label for="nameInput">Your name</label>
    <input
      id="nameInput"
      maxlength="30"
      placeholder="Your name"
    >

    <label for="roomNameInput">Room name</label>
    <input
      id="roomNameInput"
      maxlength="40"
      placeholder="My Room"
    >

    <label for="roomCodeInput">Room code</label>
    <input
      id="roomCodeInput"
      maxlength="12"
      placeholder="Leave blank to generate one"
    >

    <div class="row">
      <button id="createButton">
        Create Room
      </button>

      <button
        id="joinButton"
        class="secondary"
      >
        Join Room
      </button>
    </div>

    <div id="status"></div>
  </div>
</div>

<div id="roomScreen">

  <div class="topbar">
    <div>
      <div class="roomTitle" id="roomTitle">
        Room
      </div>

      <div class="roomCode" id="roomCodeDisplay">
        Code
      </div>
    </div>

    <button
      id="leaveButton"
      class="danger"
    >
      Leave
    </button>
  </div>

  <div id="videoArea">

    <div id="largeArea">
      <video
        id="largeVideo"
        autoplay
        playsinline
        muted
      ></video>

      <div id="largeName">
        You
      </div>
    </div>

    <div id="thumbnails"></div>

  </div>

  <div id="controls">
    <button id="muteButton">
      Mute
    </button>

    <button id="cameraButton">
      Camera Off
    </button>
  </div>

</div>

<script>
const WS_URL =
  (location.protocol === "https:"
    ? "wss://"
    : "ws://") +
  location.host +
  "/ws";

const nameInput =
  document.getElementById("nameInput");

const roomNameInput =
  document.getElementById("roomNameInput");

const roomCodeInput =
  document.getElementById("roomCodeInput");

const createButton =
  document.getElementById("createButton");

const joinButton =
  document.getElementById("joinButton");

const status =
  document.getElementById("status");

const joinScreen =
  document.getElementById("joinScreen");

const roomScreen =
  document.getElementById("roomScreen");

const roomTitle =
  document.getElementById("roomTitle");

const roomCodeDisplay =
  document.getElementById("roomCodeDisplay");

const largeArea =
  document.getElementById("largeArea");

const largeVideo =
  document.getElementById("largeVideo");

const largeName =
  document.getElementById("largeName");

const thumbnails =
  document.getElementById("thumbnails");

const leaveButton =
  document.getElementById("leaveButton");

const muteButton =
  document.getElementById("muteButton");

const cameraButton =
  document.getElementById("cameraButton");

let socket = null;
let localStream = null;
let myId = null;
let currentRoom = null;
let selectedId = null;

const participants = new Map();
const peers = new Map();
const remoteStreams = new Map();
const tiles = new Map();
const pendingCandidates = new Map();

let audioContext = null;
let audioAnalyser = null;
let audioSource = null;
let speakingTimer = null;

nameInput.value =
  localStorage.getItem("blueberry_name") || "";

function setStatus(text) {
  status.textContent = text;
}

function getName() {
  return (
    nameInput.value.trim() ||
    "Guest"
  );
}

function saveName() {
  localStorage.setItem(
    "blueberry_name",
    getName()
  );
}

function makeClientId() {
  let id =
    localStorage.getItem(
      "blueberry_client_id"
    );

  if (!id) {
    id =
      crypto.randomUUID();

    localStorage.setItem(
      "blueberry_client_id",
      id
    );
  }

  return id;
}

function send(message) {
  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    socket.send(
      JSON.stringify(message)
    );
  }
}

async function getCamera() {
  if (localStream) {
    return localStream;
  }

  localStream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

  return localStream;
}

async function connectSocket() {
  return new Promise(
    (resolve, reject) => {

      socket =
        new WebSocket(WS_URL);

      socket.onopen = () => {
        send({
          type: "register",
          id: makeClientId(),
          name: getName(),
          role: "user"
        });

        resolve();
      };

      socket.onerror = () => {
        reject(
          new Error(
            "Could not connect to server."
          )
        );
      };

      socket.onmessage =
        event => {
          handleMessage(
            JSON.parse(
              event.data
            )
          );
        };

      socket.onclose = () => {
        if (
          roomScreen.style.display !==
          "none"
        ) {
          leaveRoom(false);
        }
      };
    }
  );
}

async function createRoom() {
  try {
    createButton.disabled = true;
    joinButton.disabled = true;

    saveName();

    setStatus(
      "Starting camera..."
    );

    await getCamera();

    setStatus(
      "Connecting..."
    );

    await connectSocket();

    send({
      type: "createRoom",
      name:
        roomNameInput.value.trim() ||
        "My Room",
      code:
        roomCodeInput.value.trim()
    });

  } catch (error) {
    console.error(error);

    setStatus(
      error.message ||
      "Something went wrong."
    );

    createButton.disabled = false;
    joinButton.disabled = false;
  }
}

async function joinRoom() {
  try {
    const code =
      roomCodeInput.value
        .trim()
        .toUpperCase();

    if (!code) {
      setStatus(
        "Enter a room code."
      );

      return;
    }

    createButton.disabled = true;
    joinButton.disabled = true;

    saveName();

    setStatus(
      "Starting camera..."
    );

    await getCamera();

    setStatus(
      "Connecting..."
    );

    await connectSocket();

    send({
      type: "joinRoom",
      code
    });

  } catch (error) {
    console.error(error);

    setStatus(
      error.message ||
      "Something went wrong."
    );

    createButton.disabled = false;
    joinButton.disabled = false;
  }
}

async function handleMessage(message) {

  switch (message.type) {

    case "roomCreated":
      roomCodeInput.value =
        message.room.code;

      break;

    case "roomJoined":
      await handleRoomJoined(
        message
      );
      break;

    case "userJoined":
      await handleUserJoined(
        message.user
      );
      break;

    case "userLeft":
      removeParticipant(
        message.userId
      );
      break;

    case "userNameChanged": {
      const participant =
        participants.get(
          message.userId
        );

      if (participant) {
        participant.name =
          message.name;
      }

      const tile =
        tiles.get(
          message.userId
        );

      if (tile) {
        const name =
          tile.querySelector(
            ".tileName"
          );

        if (name) {
          name.textContent =
            message.name;
        }
      }

      if (
        selectedId ===
        message.userId
      ) {
        largeName.textContent =
          message.name;
      }

      break;
    }

    case "signal":
      await handleSignal(
        message.from,
        message.data
      );
      break;

    case "error":
      setStatus(
        message.message
      );

      createButton.disabled =
        false;

      joinButton.disabled =
        false;

      break;

    case "banned":
      alert(
        message.message
      );

      cleanupEverything();

      setStatus(
        message.message
      );

      break;

    case "kicked":
      alert(
        message.message
      );

      cleanupEverything();

      setStatus(
        "You were kicked."
      );

      break;
  }
}

async function handleRoomJoined(message) {
  myId =
    message.self.id;

  currentRoom =
    message.room.code;

  joinScreen.style.display =
    "none";

  roomScreen.style.display =
    "flex";

  roomTitle.textContent =
    message.room.name;

  roomCodeDisplay.textContent =
    "Code: " +
    message.room.code;

  participants.clear();
  remoteStreams.clear();

  for (const user of message.users || []) {
    participants.set(
      user.id,
      user
    );
  }

  participants.set(
    myId,
    {
      id: myId,
      name: message.self.name,
      role: "user"
    }
  );

  addLocalTile();

  const users =
    message.users || [];

  for (const user of users) {
    await createPeer(
      user.id,
      user.name,
      myId < user.id
    );
  }

  selectParticipant(myId);

  startSpeakingDetection();
}

async function handleUserJoined(user) {
  if (!user || !user.id) {
    return;
  }

  if (user.id === myId) {
    return;
  }

  if (participants.has(user.id)) {
    return;
  }

  participants.set(
    user.id,
    user
  );

  await createPeer(
    user.id,
    user.name,
    myId < user.id
  );
}

function addLocalTile() {
  if (tiles.has(myId)) {
    return;
  }

  const tile =
    document.createElement("div");

  tile.className =
    "tile";

  tile.dataset.userId =
    myId;

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;
  video.srcObject =
    localStream;

  const name =
    document.createElement("div");

  name.className =
    "tileName";

  name.textContent =
    getName() + " (You)";

  tile.appendChild(video);
  tile.appendChild(name);

  tile.onclick = () => {
    selectParticipant(myId);
  };

  thumbnails.appendChild(tile);

  tiles.set(
    myId,
    tile
  );
}

function addRemoteTile(userId) {
  if (tiles.has(userId)) {
    return tiles.get(userId);
  }

  const participant =
    participants.get(userId);

  const tile =
    document.createElement("div");

  tile.className =
    "tile";

  tile.dataset.userId =
    userId;

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;

  video.srcObject =
    remoteStreams.get(userId);

  const name =
    document.createElement("div");

  name.className =
    "tileName";

  name.textContent =
    participant?.name ||
    "Guest";

  tile.appendChild(video);
  tile.appendChild(name);

  tile.onclick = () => {
    selectParticipant(userId);
  };

  thumbnails.appendChild(tile);

  tiles.set(
    userId,
    tile
  );

  return tile;
}

function selectParticipant(userId) {
  let stream = null;

  if (userId === myId) {
    stream = localStream;
  } else {
    stream =
      remoteStreams.get(userId);
  }

  if (!stream) {
    return;
  }

  selectedId =
    userId;

  largeVideo.srcObject =
    stream;

  if (userId === myId) {
    largeName.textContent =
      getName() + " (You)";
  } else {
    largeName.textContent =
      participants.get(
        userId
      )?.name || "Guest";
  }

  for (
    const [id, tile]
    of tiles
  ) {
    /*
     * THIS is what prevents
     * the selected person from
     * appearing twice.
     */
    tile.style.display =
      id === selectedId
        ? "none"
        : "";
  }
}

async function createPeer(
  userId,
  userName,
  shouldOffer
) {
  if (peers.has(userId)) {
    return peers.get(userId);
  }

  const peer =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(
    userId,
    peer
  );

  pendingCandidates.set(
    userId,
    []
  );

  if (localStream) {
    for (
      const track
      of localStream.getTracks()
    ) {
      peer.addTrack(
        track,
        localStream
      );
    }
  }

  peer.onicecandidate =
    event => {
      if (event.candidate) {
        send({
          type: "signal",
          target: userId,
          data: {
            type: "ice",
            candidate:
              event.candidate
          }
        });
      }
    };

  peer.ontrack =
    event => {
      let stream =
        remoteStreams.get(
          userId
        );

      if (!stream) {
        stream =
          new MediaStream();

        remoteStreams.set(
          userId,
          stream
        );
      }

      for (
        const track
        of event.streams[0]
          ? event.streams[0].getTracks()
          : [event.track]
      ) {
        if (
          !stream.getTracks()
            .some(
              existing =>
                existing.id ===
                track.id
            )
        ) {
          stream.addTrack(track);
        }
      }

      const tile =
        addRemoteTile(userId);

      const video =
        tile.querySelector(
          "video"
        );

      video.srcObject =
        stream;

      if (
        selectedId ===
        userId
      ) {
        largeVideo.srcObject =
          stream;
      }
    };

  peer.onconnectionstatechange =
    () => {
      if (
        peer.connectionState ===
          "failed" ||
        peer.connectionState ===
          "closed"
      ) {
        removePeer(userId);
      }
    };

  if (shouldOffer) {
    try {
      const offer =
        await peer.createOffer();

      await peer.setLocalDescription(
        offer
      );

      send({
        type: "signal",
        target: userId,
        data: {
          type: "offer",
          offer:
            peer.localDescription
        }
      });
    } catch (error) {
      console.error(
        "Offer error:",
        error
      );
    }
  }

  return peer;
}

async function handleSignal(
  from,
  data
) {
  let peer =
    peers.get(from);

  if (!peer) {
    const participant =
      participants.get(from);

    peer =
      await createPeer(
        from,
        participant?.name ||
          "Guest",
        false
      );
  }

  try {

    if (data.type === "offer") {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const candidates =
        pendingCandidates.get(
          from
        ) || [];

      for (
        const candidate
        of candidates
      ) {
        try {
          await peer.addIceCandidate(
            candidate
          );
        } catch {}
      }

      pendingCandidates.set(
        from,
        []
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      send({
        type: "signal",
        target: from,
        data: {
          type: "answer",
          answer:
            peer.localDescription
        }
      });

      return;
    }

    if (data.type === "answer") {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      const candidates =
        pendingCandidates.get(
          from
        ) || [];

      for (
        const candidate
        of candidates
      ) {
        try {
          await peer.addIceCandidate(
            candidate
          );
        } catch {}
      }

      pendingCandidates.set(
        from,
        []
      );

      return;
    }

    if (data.type === "ice") {

      const candidate =
        new RTCIceCandidate(
          data.candidate
        );

      if (
        peer.remoteDescription &&
        peer.remoteDescription.type
      ) {
        await peer.addIceCandidate(
          candidate
        );
      } else {
        const queue =
          pendingCandidates.get(
            from
          ) || [];

        queue.push(
          candidate
        );

        pendingCandidates.set(
          from,
          queue
        );
      }
    }

  } catch (error) {
    console.error(
      "Signal error:",
      error
    );
  }
}

function removePeer(userId) {
  const peer =
    peers.get(userId);

  if (peer) {
    try {
      peer.close();
    } catch {}
  }

  peers.delete(userId);
  pendingCandidates.delete(
    userId
  );
}

function removeParticipant(userId) {
  removePeer(userId);

  remoteStreams.delete(
    userId
  );

  participants.delete(
    userId
  );

  const tile =
    tiles.get(userId);

  if (tile) {
    tile.remove();
  }

  tiles.delete(userId);

  if (selectedId === userId) {
    selectParticipant(myId);
  }
}

function startSpeakingDetection() {
  if (!localStream) {
    return;
  }

  try {
    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioAnalyser =
      audioContext.createAnalyser();

    audioAnalyser.fftSize =
      512;

    audioSource =
      audioContext.createMediaStreamSource(
        localStream
      );

    audioSource.connect(
      audioAnalyser
    );

    const data =
      new Uint8Array(
        audioAnalyser.fftSize
      );

    speakingTimer =
      setInterval(() => {

        audioAnalyser.getByteTimeDomainData(
          data
        );

        let total = 0;

        for (
          let i = 0;
          i < data.length;
          i++
        ) {
          const value =
            (data[i] - 128) / 128;

          total +=
            value * value;
        }

        const volume =
          Math.sqrt(
            total / data.length
          );

        const localTile =
          tiles.get(myId);

        if (localTile) {
          localTile.classList.toggle(
            "speaking",
            volume > 0.045
          );
        }

      }, 100);

  } catch (error) {
    console.error(
      "Audio detection error:",
      error
    );
  }
}

function cleanupEverything() {
  for (
    const peer
    of peers.values()
  ) {
    try {
      peer.close();
    } catch {}
  }

  peers.clear();
  pendingCandidates.clear();
  remoteStreams.clear();
  participants.clear();

  for (
    const tile
    of tiles.values()
  ) {
    tile.remove();
  }

  tiles.clear();

  if (speakingTimer) {
    clearInterval(
      speakingTimer
    );

    speakingTimer = null;
  }

  if (audioContext) {
    try {
      audioContext.close();
    } catch {}

    audioContext = null;
  }

  if (localStream) {
    for (
      const track
      of localStream.getTracks()
    ) {
      track.stop();
    }

    localStream = null;
  }

  if (socket) {
    try {
      socket.close();
    } catch {}

    socket = null;
  }

  largeVideo.srcObject =
    null;

  selectedId = null;
  myId = null;
  currentRoom = null;

  roomScreen.style.display =
    "none";

  joinScreen.style.display =
    "flex";

  createButton.disabled =
    false;

  joinButton.disabled =
    false;
}

function leaveRoom(sendLeave = true) {
  if (
    sendLeave &&
    socket
  ) {
    send({
      type: "leaveRoom"
    });
  }

  cleanupEverything();
}

createButton.onclick =
  createRoom;

joinButton.onclick =
  joinRoom;

leaveButton.onclick =
  () => leaveRoom(true);

muteButton.onclick =
  () => {
    if (!localStream) {
      return;
    }

    const track =
      localStream.getAudioTracks()[0];

    if (!track) {
      return;
    }

    track.enabled =
      !track.enabled;

    muteButton.textContent =
      track.enabled
        ? "Mute"
        : "Unmute";
  };

cameraButton.onclick =
  () => {
    if (!localStream) {
      return;
    }

    const track =
      localStream.getVideoTracks()[0];

    if (!track) {
      return;
    }

    track.enabled =
      !track.enabled;

    cameraButton.textContent =
      track.enabled
        ? "Camera Off"
        : "Camera On";
  };

largeVideo.onclick =
  async () => {
    try {
      if (
        document.fullscreenElement
      ) {
        await document.exitFullscreen();
      } else {
        await largeVideo.requestFullscreen();
      }
    } catch {}
  };

window.addEventListener(
  "beforeunload",
  () => {
    try {
      send({
        type: "leaveRoom"
      });
    } catch {}
  }
);
</script>

</body>
</html>
