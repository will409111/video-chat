<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Moderator Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  background: #090b0f;
  color: white;

  font-family: Arial, sans-serif;

  height: 100vh;

  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  border-radius: 9px;

  padding: 10px 12px;

  color: white;

  background: #2563eb;

  cursor: pointer;
}

button:hover {
  filter: brightness(1.1);
}

input {
  width: 100%;

  background: #11151b;
  color: white;

  border: 1px solid #303640;

  border-radius: 9px;

  padding: 11px;

  margin-bottom: 8px;
}


/* MAIN LAYOUT */

#layout {
  height: 100vh;

  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    340px;
}


/* CALL */

#callArea {
  position: relative;

  min-width: 0;

  background: #0b0e13;
}

#thumbs {
  position: absolute;

  left: 12px;
  top: 12px;
  bottom: 12px;

  width: 155px;

  display: flex;
  flex-direction: column;

  gap: 10px;

  overflow-y: auto;

  z-index: 10;
}

.thumb {
  position: relative;

  width: 140px;
  height: 90px;

  flex-shrink: 0;

  background: #1b2028;

  border-radius: 12px;

  overflow: hidden;

  border: 2px solid transparent;

  cursor: pointer;
}

.thumb:hover {
  border-color: #60a5fa;
}

.thumb.selected {
  border-color: #60a5fa;
}

.thumb.speaking {
  border-color: #22c55e;

  box-shadow:
    0 0 15px
    rgba(34,197,94,.7);
}

.thumb video {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.thumbName {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  padding: 5px 7px;

  font-size: 13px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.85)
    );
}

#mainVideo {
  position: absolute;

  left: 175px;
  right: 15px;

  top: 15px;
  bottom: 15px;
}

#bigBox {
  width: 100%;
  height: 100%;

  background: black;

  border-radius: 18px;

  overflow: hidden;

  position: relative;

  cursor: pointer;
}

#bigVideo {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: black;
}

#bigName {
  position: absolute;

  left: 15px;
  bottom: 15px;

  padding: 8px 12px;

  background:
    rgba(0,0,0,.65);

  border-radius: 8px;
}

#roomTitle {
  position: absolute;

  top: 15px;
  right: 20px;

  z-index: 20;

  padding: 8px 12px;

  background:
    rgba(0,0,0,.65);

  border-radius: 8px;
}

#controls {
  position: absolute;

  left: 50%;
  bottom: 20px;

  transform:
    translateX(-50%);

  display: flex;

  gap: 10px;

  z-index: 30;
}

#controls button {
  width: 52px;
  height: 52px;

  border-radius: 50%;
}

#leave {
  background: #dc2626;
}


/* DASHBOARD */

#dashboard {
  background: #14181e;

  border-left:
    1px solid #292f38;

  padding: 18px;

  overflow-y: auto;
}

#dashboard h2 {
  margin-top: 0;
}

#status {
  font-size: 13px;

  opacity: .65;

  margin-bottom: 15px;
}

.roomCard {
  background: #1d232b;

  border-radius: 12px;

  padding: 13px;

  margin-bottom: 12px;
}

.roomName {
  font-size: 17px;

  font-weight: bold;

  margin-bottom: 3px;
}

.roomCode {
  font-size: 12px;

  opacity: .6;
}

.roomCount {
  font-size: 12px;

  opacity: .6;

  margin-top: 8px;
}

.participant {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 6px;

  background: #11151a;

  border-radius: 8px;

  padding: 7px;

  margin-top: 6px;
}

.participantName {
  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.participantButtons {
  display: flex;

  gap: 4px;
}

.participantButtons button {
  padding: 5px 7px;

  font-size: 11px;
}

.kick {
  background: #d97706;
}

.ban {
  background: #dc2626;
}

.roomActions {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 6px;

  margin-top: 10px;
}

.anonymous {
  background: #252b34;
}

.empty {
  opacity: .6;

  font-size: 13px;
}

@media(max-width:800px) {

  #layout {
    grid-template-columns: 1fr;
  }

  #dashboard {
    position: absolute;

    right: 0;
    top: 0;
    bottom: 0;

    width: 320px;

    z-index: 100;
  }

}

</style>

</head>

<body>


<div id="layout">


  <div id="callArea">

    <div id="roomTitle">
      No room joined
    </div>


    <div id="thumbs"></div>


    <div id="mainVideo">

      <div
        id="bigBox"
        onclick="toggleFullscreen()"
      >

        <video
          id="bigVideo"
          autoplay
          playsinline
        ></video>

        <div id="bigName">
          Select someone
        </div>

      </div>

    </div>


    <div id="controls">

      <button
        id="micButton"
        onclick="toggleMic()"
      >
        🎤
      </button>

      <button
        id="cameraButton"
        onclick="toggleCamera()"
      >
        📷
      </button>

      <button
        id="leave"
        onclick="leaveRoom()"
      >
        ☎
      </button>

    </div>

  </div>


  <aside id="dashboard">

    <h2>Moderator Dashboard</h2>

    <div id="status">
      Connecting...
    </div>


    <input
      id="moderatorName"
      maxlength="30"
      placeholder="Your moderator name"
    >


    <h3>Create Room</h3>

    <input
      id="newRoomName"
      maxlength="40"
      placeholder="Room name"
    >

    <input
      id="newRoomCode"
      maxlength="12"
      placeholder="Custom code (optional)"
    >

    <button
      onclick="createRoom()"
      style="width:100%"
    >
      + Create Room
    </button>


    <hr
      style="
        border:0;
        border-top:1px solid #303640;
        margin:18px 0;
      "
    >


    <h3>Open Calls</h3>

    <div id="rooms">
      Loading...
    </div>

  </aside>

</div>


<script>

const SERVER =
  (location.protocol === "https:"
    ? "wss://"
    : "ws://") +
  location.host +
  "/ws";


let ws;


let moderatorId =
  localStorage.getItem(
    "videoChatModeratorId"
  );


if (!moderatorId) {

  moderatorId =
    crypto.randomUUID();

  localStorage.setItem(
    "videoChatModeratorId",
    moderatorId
  );

}


let moderatorName =
  localStorage.getItem(
    "videoChatModeratorName"
  ) || "Moderator";


let localStream = null;

let peers = {};

let users = {};

let pendingCandidates = {};

let selectedUser = null;

let currentRoom = null;

let anonymousMode = false;

let audioAnalyzers = {};

let speakingAnimation = {};


const moderatorNameInput =
  document.getElementById(
    "moderatorName"
  );


moderatorNameInput.value =
  moderatorName;


moderatorNameInput.addEventListener(
  "input",
  () => {

    moderatorName =
      moderatorNameInput.value
        .trim() ||
      "Moderator";


    localStorage.setItem(
      "videoChatModeratorName",
      moderatorName
    );


    send({
      type: "setName",
      name: moderatorName
    });

  }
);


function connect() {

  ws =
    new WebSocket(SERVER);


  ws.onopen = () => {

    document.getElementById(
      "status"
    ).textContent =
      "Connected";


    send({
      type: "register",

      role: "moderator",

      id: moderatorId,

      name:
        moderatorName
    });

  };


  ws.onmessage =
    async event => {

      const msg =
        JSON.parse(
          event.data
        );


      if (
        msg.type ===
        "roomList" ||
        msg.type ===
        "roomsUpdated"
      ) {

        renderRooms(
          msg.rooms
        );

        return;
      }


      if (
        msg.type ===
        "roomCreated"
      ) {

        alert(
          `Room created!\n\n` +
          `Name: ${msg.room.name}\n` +
          `Code: ${msg.room.code}`
        );

        return;
      }


      if (
        msg.type ===
        "roomJoined"
      ) {

        currentRoom =
          msg.room;

        users = {};

        pendingCandidates = {};


        msg.users.forEach(
          user => {

            users[user.id] =
              user;

          }
        );


        users[msg.self.id] = {
          id: msg.self.id,

          name:
            anonymousMode
              ? "Moderator"
              : msg.self.name
        };


        showCall();


        for (
          const id of Object.keys(users)
        ) {

          if (
            id === moderatorId
          ) {
            continue;
          }


          createPeer(
            id,
            moderatorId < id
          );

        }


        return;
      }


      if (
        msg.type ===
        "userJoined"
      ) {

        users[msg.user.id] =
          msg.user;


        createPeer(
          msg.user.id,
          moderatorId < msg.user.id
        );


        return;
      }


      if (
        msg.type ===
        "signal"
      ) {

        await handleSignal(
          msg.from,
          msg.data
        );


        return;
      }


      if (
        msg.type ===
        "userLeft"
      ) {

        removePeer(
          msg.userId
        );


        return;
      }


      if (
        msg.type ===
        "kicked" ||
        msg.type ===
        "banned"
      ) {

        alert(
          msg.message
        );


        location.reload();


        return;
      }


      if (
        msg.type ===
        "error"
      ) {

        alert(
          msg.message
        );

      }

    };


  ws.onclose = () => {

    document.getElementById(
      "status"
    ).textContent =
      "Disconnected — reconnecting...";


    setTimeout(
      connect,
      1500
    );

  };

}


function send(data) {

  if (
    ws &&
    ws.readyState ===
    WebSocket.OPEN
  ) {

    ws.send(
      JSON.stringify(data)
    );

  }

}


function createRoom() {

  const name =
    document.getElementById(
      "newRoomName"
    ).value.trim();


  const code =
    document.getElementById(
      "newRoomCode"
    ).value.trim();


  if (!name) {

    alert(
      "Enter a room name."
    );

    return;

  }


  send({
    type:
      "moderatorCreateRoom",

    name,

    code
  });

}


async function joinNormal(code) {

  anonymousMode =
    false;


  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true,
          audio: true
        });


    send({
      type: "setName",
      name: moderatorName
    });


    send({
      type:
        "moderatorJoinRoom",

      code,

      anonymous: false
    });

  } catch (error) {

    console.error(
      error
    );

    alert(
      "Camera/microphone permission is required for normal moderator mode."
    );

  }

}


function joinAnonymous(code) {

  anonymousMode =
    true;

  localStream =
    null;


  send({
    type:
      "moderatorJoinRoom",

    code,

    anonymous: true
  });

}


function showCall() {

  document.getElementById(
    "roomTitle"
  ).textContent =
    currentRoom.name;


  if (localStream) {

    addParticipant(
      moderatorId,
      localStream
    );


    selectParticipant(
      moderatorId
    );


    setupSpeakingDetection(
      moderatorId,
      localStream
    );

  }

}


function createPeer(
  remoteId,
  initiator
) {

  if (
    peers[remoteId]
  ) {

    return peers[remoteId];

  }


  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });


  peers[remoteId] =
    pc;


  pendingCandidates[
    remoteId
  ] = [];


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "signal",

          target: remoteId,

          data: {
            type: "candidate",

            candidate:
              event.candidate
          }

        });

      }

    };


  pc.ontrack =
    event => {

      const stream =
        event.streams[0];

      if (!stream) {
        return;
      }


      addParticipant(
        remoteId,
        stream
      );


      setupSpeakingDetection(
        remoteId,
        stream
      );


      if (!selectedUser) {

        selectParticipant(
          remoteId
        );

      }

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "Connection",
        remoteId,
        pc.connectionState
      );


      if (
        pc.connectionState ===
        "failed"
      ) {

        try {
          pc.restartIce();
        } catch {}

      }

    };


  if (initiator) {

    makeOffer(
      remoteId,
      pc
    );

  }


  return pc;

}


async function makeOffer(
  remoteId,
  pc
) {

  try {

    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    send({
      type: "signal",

      target: remoteId,

      data: {
        type: "offer",

        sdp:
          pc.localDescription
      }

    });

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  }

}


async function handleSignal(
  remoteId,
  data
) {

  let pc =
    peers[remoteId];


  if (!pc) {

    pc =
      createPeer(
        remoteId,
        false
      );

  }


  try {

    if (
      data.type ===
      "offer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );


      await flushCandidates(
        remoteId,
        pc
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      send({
        type: "signal",

        target: remoteId,

        data: {
          type: "answer",

          sdp:
            pc.localDescription
        }

      });


      return;

    }


    if (
      data.type ===
      "answer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.sdp
        )
      );


      await flushCandidates(
        remoteId,
        pc
      );


      return;

    }


    if (
      data.type ===
      "candidate"
    ) {

      if (
        pc.remoteDescription
      ) {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      } else {

        pendingCandidates[
          remoteId
        ].push(
          data.candidate
        );

      }

    }

  } catch (error) {

    console.error(
      "WebRTC error:",
      error
    );

  }

}


async function flushCandidates(
  remoteId,
  pc
) {

  const candidates =
    pendingCandidates[
      remoteId
    ] || [];


  pendingCandidates[
    remoteId
  ] = [];


  for (
    const candidate of candidates
  ) {

    try {

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.error(
        "ICE error:",
        error
      );

    }

  }

}


function addParticipant(
  id,
  stream
) {

  let box =
    document.getElementById(
      "thumb-" + id
    );


  if (!box) {

    box =
      document.createElement(
        "div"
      );


    box.className =
      "thumb";


    box.id =
      "thumb-" + id;


    box.onclick =
      () =>
        selectParticipant(id);


    const video =
      document.createElement(
        "video"
      );


    video.autoplay = true;
    video.playsInline = true;

    video.muted =
      id === moderatorId;


    video.srcObject =
      stream;


    const name =
      document.createElement(
        "div"
      );


    name.className =
      "thumbName";


    name.textContent =
      users[id]?.name ||
      "Guest";


    box.appendChild(
      video
    );


    box.appendChild(
      name
    );


    document
      .getElementById(
        "thumbs"
      )
      .appendChild(
        box
      );


  } else {

    const video =
      box.querySelector(
        "video"
      );


    if (video) {

      video.srcObject =
        stream;

    }

  }

}


function selectParticipant(
  id
) {

  const box =
    document.getElementById(
      "thumb-" + id
    );


  if (!box) {
    return;
  }


  const video =
    box.querySelector(
      "video"
    );


  if (!video) {
    return;
  }


  selectedUser =
    id;


  document
    .querySelectorAll(
      ".thumb"
    )
    .forEach(
      element =>
        element.classList.remove(
          "selected"
        )
    );


  box.classList.add(
    "selected"
  );


  const big =
    document.getElementById(
      "bigVideo"
    );


  big.srcObject =
    video.srcObject;


  big.muted =
    id === moderatorId;


  document.getElementById(
    "bigName"
  ).textContent =
    users[id]?.name ||
    "Guest";

}


function setupSpeakingDetection(
  id,
  stream
) {

  if (
    audioAnalyzers[id]
  ) {
    return;
  }


  if (
    !stream ||
    !stream.getAudioTracks()
      .length
  ) {
    return;
  }


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const context =
      new AudioContext();


    const source =
      context.createMediaStreamSource(
        stream
      );


    const analyser =
      context.createAnalyser();


    analyser.fftSize =
      256;


    analyser.smoothingTimeConstant =
      0.75;


    source.connect(
      analyser
    );


    const data =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    audioAnalyzers[id] = {
      analyser,
      data
    };


    function check() {

      if (
        !audioAnalyzers[id]
      ) {
        return;
      }


      analyser.getByteFrequencyData(
        data
      );


      let total = 0;


      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        total += data[i];

      }


      const average =
        total / data.length;


      const box =
        document.getElementById(
          "thumb-" + id
        );


      if (
        box &&
        average > 10
      ) {

        box.classList.add(
          "speaking"
        );


        clearTimeout(
          speakingAnimation[id]
        );


        speakingAnimation[id] =
          setTimeout(
            () => {

              box.classList.remove(
                "speaking"
              );

            },
            500
          );

      }


      requestAnimationFrame(
        check
      );

    }


    check();

  } catch (error) {

    console.error(
      "Voice detection error:",
      error
    );

  }

}


function removePeer(
  id
) {

  if (
    peers[id]
  ) {

    try {
      peers[id].close();
    } catch {}

    delete peers[id];

  }


  delete pendingCandidates[
    id
  ];


  const box =
    document.getElementById(
      "thumb-" + id
    );


  if (box) {
    box.remove();
  }


  delete users[id];


  if (
    selectedUser === id
  ) {

    selectedUser =
      null;


    const remaining =
      Object.keys(users)
        .find(
          userId =>
            userId !==
            moderatorId
        );


    if (remaining) {

      selectParticipant(
        remaining
      );

    }

  }

}


function renderRooms(
  rooms
) {

  const container =
    document.getElementById(
      "rooms"
    );


  container.innerHTML = "";


  if (!rooms.length) {

    container.innerHTML =
      `<p class="empty">
        No open calls.
      </p>`;

    return;

  }


  rooms.forEach(
    room => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "roomCard";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "roomName";


      title.textContent =
        room.name;


      card.appendChild(
        title
      );


      const code =
        document.createElement(
          "div"
        );


      code.className =
        "roomCode";


      code.textContent =
        "Code: " +
        room.code;


      card.appendChild(
        code
      );


      const count =
        document.createElement(
          "div"
        );


      count.className =
        "roomCount";


      count.textContent =
        `${room.userCount} participant${
          room.userCount === 1
            ? ""
            : "s"
        }`;


      card.appendChild(
        count
      );


      room.participants.forEach(
        participant => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "participant";


          const name =
            document.createElement(
              "span"
            );


          name.className =
            "participantName";


          name.textContent =
            participant.name;


          row.appendChild(
            name
          );


          if (
            participant.role !==
            "moderator"
          ) {

            const buttons =
              document.createElement(
                "div"
              );


            buttons.className =
              "participantButtons";


            const kick =
              document.createElement(
                "button"
              );


            kick.className =
              "kick";


            kick.textContent =
              "Kick";


            kick.onclick =
              () =>
                kickUser(
                  participant.id
                );


            const ban =
              document.createElement(
                "button"
              );


            ban.className =
              "ban";


            ban.textContent =
              "Ban";


            ban.onclick =
              () =>
                banUser(
                  participant.id
                );


            buttons.appendChild(
              kick
            );


            buttons.appendChild(
              ban
            );


            row.appendChild(
              buttons
            );

          }


          card.appendChild(
            row
          );

        }
      );


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "roomActions";


      const normal =
        document.createElement(
          "button"
        );


      normal.textContent =
        "Join Normally";


      normal.onclick =
        () =>
          joinNormal(
            room.code
          );


      const anonymous =
        document.createElement(
          "button"
        );


      anonymous.className =
        "anonymous";


      anonymous.textContent =
        "Anonymous";


      anonymous.onclick =
        () =>
          joinAnonymous(
            room.code
          );


      actions.appendChild(
        normal
      );


      actions.appendChild(
        anonymous
      );


      card.appendChild(
        actions
      );


      container.appendChild(
        card
      );

    }
  );

}


function kickUser(
  userId
) {

  if (
    confirm(
      "Kick this participant?"
    )
  ) {

    send({
      type: "kick",
      userId
    });

  }

}


function banUser(
  userId
) {

  if (
    confirm(
      "Ban this participant?"
    )
  ) {

    send({
      type: "ban",
      userId
    });

  }

}


function toggleMic() {

  if (!localStream) {
    return;
  }


  const track =
    localStream
      .getAudioTracks()[0];


  if (!track) {
    return;
  }


  track.enabled =
    !track.enabled;


  document.getElementById(
    "micButton"
  ).textContent =
    track.enabled
      ? "🎤"
      : "🔇";

}


function toggleCamera() {

  if (!localStream) {
    return;
  }


  const track =
    localStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  track.enabled =
    !track.enabled;


  document.getElementById(
    "cameraButton"
  ).textContent =
    track.enabled
      ? "📷"
      : "🚫";

}


async function toggleFullscreen() {

  const box =
    document.getElementById(
      "bigBox"
    );


  if (
    !document.fullscreenElement
  ) {

    await box.requestFullscreen();

  } else {

    await document.exitFullscreen();

  }

}


function leaveRoom() {

  send({
    type:
      "leaveRoom"
  });


  Object.values(
    peers
  ).forEach(
    pc => {

      try {
        pc.close();
      } catch {}

    }
  );


  peers = {};

  pendingCandidates = {};


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  localStream =
    null;


  currentRoom =
    null;


  anonymousMode =
    false;


  document.getElementById(
    "thumbs"
  ).innerHTML = "";


  document.getElementById(
    "bigVideo"
  ).srcObject =
    null;


  document.getElementById(
    "bigName"
  ).textContent =
    "Select someone";


  document.getElementById(
    "roomTitle"
  ).textContent =
    "No room joined";

}


connect();

</script>
