<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueberry Video Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #08090d;
      color: white;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .panel {
      width: min(520px, 100%);
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #9da3b0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #dfe3ea;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #343946;
      background: #090b10;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #6977ff;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 15px;
      background: #5664ff;
      color: white;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button.secondary {
      background: #292d38;
    }

    button.danger {
      background: #b83c4d;
    }

    .status {
      min-height: 22px;
      margin-top: 15px;
      color: #aeb4c0;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    /* ROOM */

    #roomScreen {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    .roomHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .roomTitle {
      font-size: 22px;
      font-weight: bold;
    }

    .roomCode {
      color: #9da3b0;
      font-size: 14px;
      margin-top: 4px;
    }

    .roomLayout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 15px;
    }

    .videoArea {
      min-width: 0;
    }

    .mainVideoBox {
      position: relative;
      width: 100%;
      height: min(68vh, 650px);
      background: #050609;
      border: 2px solid #292d38;
      border-radius: 18px;
      overflow: hidden;
    }

    .mainVideoBox.talking {
      border-color: #35e06f;
      box-shadow: 0 0 18px rgba(53,224,111,.45);
    }

    #mainVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050609;
      cursor: pointer;
    }

    .mainLabel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 7px 10px;
      background: rgba(0,0,0,.7);
      border-radius: 9px;
      pointer-events: none;
    }

    .thumbnailRow {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 2px 4px;
    }

    .thumbnail {
      position: relative;
      flex: 0 0 145px;
      height: 90px;
      background: #11131a;
      border: 2px solid #292d38;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .thumbnail.talking {
      border-color: #35e06f;
      box-shadow: 0 0 12px rgba(53,224,111,.4);
    }

    .thumbnail video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnailName {
      position: absolute;
      bottom: 5px;
      left: 5px;
      right: 5px;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(0,0,0,.7);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* CHAT */

    .chatPanel {
      min-height: 500px;
      height: min(68vh, 650px);
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chatHeader {
      padding: 15px;
      border-bottom: 1px solid #292d38;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .message {
      margin-bottom: 12px;
    }

    .messageName {
      font-size: 12px;
      color: #8e97a8;
      margin-bottom: 3px;
    }

    .messageBubble {
      display: inline-block;
      max-width: 90%;
      padding: 8px 11px;
      border-radius: 10px;
      background: #252934;
      word-wrap: break-word;
    }

    .message.mine .messageBubble {
      background: #4c59d9;
    }

    .message.moderator .messageName {
      color: #c4b6ff;
    }

    .chatForm {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #292d38;
    }

    .chatForm input {
      min-width: 0;
    }

    .chatForm button {
      flex: 0 0 auto;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .controls button {
      min-width: 110px;
    }

    @media (max-width: 850px) {
      .roomLayout {
        grid-template-columns: 1fr;
      }

      .chatPanel {
        height: 400px;
      }

      .mainVideoBox {
        height: 55vh;
      }
    }

    @media (max-width: 550px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      #roomScreen {
        padding: 8px;
      }

      .mainVideoBox {
        height: 45vh;
      }
    }
  </style>
</head>

<body>

  <!-- JOIN SCREEN -->
  <div id="joinScreen" class="page">
    <div class="panel">
      <h1>Blueberry Video Chat</h1>
      <div class="subtitle">
        Video, audio, and text chat.
      </div>

      <label for="nameInput">Your name</label>
      <input
        id="nameInput"
        maxlength="30"
        placeholder="Enter your name"
        autocomplete="off"
      >

      <label for="roomNameInput">Room name</label>
      <input
        id="roomNameInput"
        maxlength="50"
        placeholder="Example: Game Night"
        autocomplete="off"
      >

      <label for="roomCodeInput">
        Room code
        <span style="color:#777d89">(leave blank for a random code)</span>
      </label>

      <input
        id="roomCodeInput"
        maxlength="30"
        placeholder="Example: FRIENDS123"
        autocomplete="off"
      >

      <div class="buttons">
        <button id="createButton">
          Create Room
        </button>

        <button id="joinButton" class="secondary">
          Join Room
        </button>
      </div>

      <div id="joinStatus" class="status"></div>
    </div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="roomScreen" class="hidden">

    <div class="roomHeader">
      <div>
        <div id="roomTitle" class="roomTitle">
          Room
        </div>

        <div id="roomCodeDisplay" class="roomCode">
          Code:
        </div>
      </div>

      <button id="leaveButton" class="danger">
        Leave Room
      </button>
    </div>

    <div class="roomLayout">

      <div class="videoArea">

        <div id="mainVideoBox" class="mainVideoBox">
          <video
            id="mainVideo"
            autoplay
            playsinline
            muted
          ></video>

          <div id="mainLabel" class="mainLabel">
            You
          </div>
        </div>

        <div id="thumbnailRow" class="thumbnailRow"></div>

        <div class="controls">
          <button id="muteButton">
            Mute Mic
          </button>

          <button id="cameraButton">
            Turn Camera Off
          </button>
        </div>

      </div>

      <div class="chatPanel">

        <div class="chatHeader">
          Chat
        </div>

        <div id="messages"></div>

        <form id="chatForm" class="chatForm">
          <input
            id="chatInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
          >

          <button type="submit">
            Send
          </button>
        </form>

      </div>

    </div>
  </div>

<script>
  const joinScreen = document.getElementById("joinScreen");
  const roomScreen = document.getElementById("roomScreen");

  const nameInput = document.getElementById("nameInput");
  const roomNameInput = document.getElementById("roomNameInput");
  const roomCodeInput = document.getElementById("roomCodeInput");

  const createButton = document.getElementById("createButton");
  const joinButton = document.getElementById("joinButton");

  const joinStatus = document.getElementById("joinStatus");

  const roomTitle = document.getElementById("roomTitle");
  const roomCodeDisplay = document.getElementById("roomCodeDisplay");

  const mainVideoBox = document.getElementById("mainVideoBox");
  const mainVideo = document.getElementById("mainVideo");
  const mainLabel = document.getElementById("mainLabel");

  const thumbnailRow = document.getElementById("thumbnailRow");

  const muteButton = document.getElementById("muteButton");
  const cameraButton = document.getElementById("cameraButton");
  const leaveButton = document.getElementById("leaveButton");

  const messages = document.getElementById("messages");
  const chatForm = document.getElementById("chatForm");
  const chatInput = document.getElementById("chatInput");

  let socket = null;

  let myId =
    localStorage.getItem("blueberryUserId") ||
    crypto.randomUUID();

  localStorage.setItem("blueberryUserId", myId);

  let myName =
    localStorage.getItem("blueberryUserName") || "";

  nameInput.value = myName;

  let localStream = null;

  let currentRoom = null;

  const peers = new Map();

  const participants = new Map();

  const remoteStreams = new Map();

  const pendingIce = new Map();

  const speakingDetectors = new Map();

  let selectedId = null;

  let micEnabled = true;
  let cameraEnabled = true;

  /*
   * WebSocket URL
   */
  function getWebSocketUrl() {
    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    return `${protocol}//${location.host}/ws`;
  }

  /*
   * Escape HTML
   */
  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  /*
   * CONNECT
   */
  function connectSocket() {
    return new Promise((resolve, reject) => {
      socket = new WebSocket(getWebSocketUrl());

      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({
          type: "register",
          id: myId,
          name: myName
        }));

        resolve();
      });

      socket.addEventListener("error", () => {
        reject(new Error("Could not connect to the server."));
      });

      socket.addEventListener("message", event => {
        handleMessage(JSON.parse(event.data));
      });

      socket.addEventListener("close", () => {
        socket = null;
      });
    });
  }

  /*
   * SEND
   */
  function send(data) {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      return;
    }

    socket.send(JSON.stringify(data));
  }

  /*
   * CAMERA + MIC
   *
   * Get these BEFORE joining the room so that normal users
   * can immediately publish their streams to everyone.
   */
  async function getMedia() {
    if (localStream) {
      return localStream;
    }

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

      return localStream;
    } catch (error) {
      throw new Error(
        "Camera/microphone permission was denied or unavailable."
      );
    }
  }

  /*
   * CREATE ROOM
   */
  async function createRoom() {
    myName = nameInput.value.trim();

    if (!myName) {
      joinStatus.textContent = "Enter your name first.";
      return;
    }

    const customRoomName =
      roomNameInput.value.trim();

    const customRoomCode =
      roomCodeInput.value.trim();

    if (!customRoomName) {
      joinStatus.textContent = "Enter a room name.";
      return;
    }

    joinStatus.textContent =
      "Getting camera and microphone...";

    localStorage.setItem(
      "blueberryUserName",
      myName
    );

    try {
      await getMedia();

      if (!socket) {
        await connectSocket();
      }

      /*
       * THIS IS THE IMPORTANT PART.
       *
       * The exact room code typed by the user is sent
       * to the server.
       *
       * Blank = server generates a random code.
       */
      send({
        type: "createRoom",
        roomName: customRoomName,
        roomCode: customRoomCode
      });

      joinStatus.textContent =
        customRoomCode
          ? `Creating room "${customRoomName}" with code "${customRoomCode}"...`
          : `Creating room "${customRoomName}"...`;

    } catch (error) {
      joinStatus.textContent = error.message;
    }
  }

  /*
   * JOIN EXISTING ROOM
   */
  async function joinRoom() {
    myName = nameInput.value.trim();

    if (!myName) {
      joinStatus.textContent = "Enter your name first.";
      return;
    }

    const code = roomCodeInput.value.trim();

    if (!code) {
      joinStatus.textContent = "Enter a room code.";
      return;
    }

    localStorage.setItem(
      "blueberryUserName",
      myName
    );

    joinStatus.textContent =
      "Getting camera and microphone...";

    try {
      await getMedia();

      if (!socket) {
        await connectSocket();
      }

      send({
        type: "joinRoom",
        roomCode: code
      });

      joinStatus.textContent =
        "Joining room...";

    } catch (error) {
      joinStatus.textContent = error.message;
    }
  }

  /*
   * ROOM JOINED
   */
  function enterRoom(room, existingParticipants, oldMessages) {
    currentRoom = room;

    joinScreen.classList.add("hidden");
    roomScreen.classList.remove("hidden");

    roomTitle.textContent = room.name;
    roomCodeDisplay.textContent =
      `Code: ${room.code}`;

    messages.innerHTML = "";

    for (const message of oldMessages || []) {
      addChatMessage(message);
    }

    participants.clear();

    for (const participant of existingParticipants || []) {
      participants.set(
        participant.id,
        participant
      );
    }

    /*
     * Select ourselves initially.
     */
    selectedId = myId;

    renderVideos();

    /*
     * Create WebRTC connections to existing users.
     */
    for (const participant of existingParticipants || []) {
      createPeerConnection(
        participant.id,
        true
      );
    }
  }

  /*
   * CREATE PEER CONNECTION
   */
  async function createPeerConnection(remoteId, makeOffer) {
    if (peers.has(remoteId)) {
      return peers.get(remoteId);
    }

    const pc = new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    });

    peers.set(remoteId, pc);

    pendingIce.set(remoteId, []);

    /*
     * Add our camera and microphone.
     */
    if (localStream) {
      for (const track of localStream.getTracks()) {
        pc.addTrack(track, localStream);
      }
    }

    pc.onicecandidate = event => {
      if (!event.candidate) {
        return;
      }

      send({
        type: "signal",
        target: remoteId,
        signal: {
          type: "ice",
          candidate: event.candidate
        }
      });
    };

    pc.ontrack = event => {
      let stream = event.streams[0];

      if (!stream) {
        stream = remoteStreams.get(remoteId);

        if (!stream) {
          stream = new MediaStream();
          remoteStreams.set(remoteId, stream);
        }

        if (!stream.getTracks().includes(event.track)) {
          stream.addTrack(event.track);
        }
      } else {
        remoteStreams.set(remoteId, stream);
      }

      renderVideos();
      setupSpeakingDetection(
        remoteId,
        stream
      );
    };

    pc.onconnectionstatechange = () => {
      if (
        pc.connectionState === "failed" ||
        pc.connectionState === "closed" ||
        pc.connectionState === "disconnected"
      ) {
        /*
         * Don't immediately destroy on disconnected because
         * WebRTC can recover.
         */
      }
    };

    /*
     * Only one side creates the initial offer.
     */
    if (makeOffer) {
      try {
        const offer = await pc.createOffer();

        await pc.setLocalDescription(offer);

        send({
          type: "signal",
          target: remoteId,
          signal: {
            type: "offer",
            description: pc.localDescription
          }
        });
      } catch (error) {
        console.error(error);
      }
    }

    return pc;
  }

  /*
   * HANDLE WEBRTC SIGNAL
   */
  async function handleSignal(from, signal) {
    let pc = peers.get(from);

    if (!pc) {
      pc = await createPeerConnection(
        from,
        false
      );
    }

    try {
      if (signal.type === "offer") {
        await pc.setRemoteDescription(
          new RTCSessionDescription(
            signal.description
          )
        );

        const queued =
          pendingIce.get(from) || [];

        for (const candidate of queued) {
          try {
            await pc.addIceCandidate(
              new RTCIceCandidate(candidate)
            );
          } catch {}
        }

        pendingIce.set(from, []);

        const answer =
          await pc.createAnswer();

        await pc.setLocalDescription(answer);

        send({
          type: "signal",
          target: from,
          signal: {
            type: "answer",
            description: pc.localDescription
          }
        });
      }

      if (signal.type === "answer") {
        await pc.setRemoteDescription(
          new RTCSessionDescription(
            signal.description
          )
        );

        const queued =
          pendingIce.get(from) || [];

        for (const candidate of queued) {
          try {
            await pc.addIceCandidate(
              new RTCIceCandidate(candidate)
            );
          } catch {}
        }

        pendingIce.set(from, []);
      }

      if (signal.type === "ice") {
        if (!pc.remoteDescription) {
          const queue =
            pendingIce.get(from) || [];

          queue.push(signal.candidate);

          pendingIce.set(from, queue);

          return;
        }

        try {
          await pc.addIceCandidate(
            new RTCIceCandidate(
              signal.candidate
            )
          );
        } catch {}
      }

    } catch (error) {
      console.error(
        "WebRTC signaling error:",
        error
      );
    }
  }

  /*
   * USER JOINED
   */
  function handleUserJoined(participant) {
    participants.set(
      participant.id,
      participant
    );

    renderVideos();

    /*
     * Deterministic offer:
     * the user with the lower ID creates the offer.
     */
    const shouldOffer =
      String(myId) <
      String(participant.id);

    createPeerConnection(
      participant.id,
      shouldOffer
    );
  }

  /*
   * USER LEFT
   */
  function handleUserLeft(id) {
    participants.delete(id);

    const pc = peers.get(id);

    if (pc) {
      try {
        pc.close();
      } catch {}
    }

    peers.delete(id);
    pendingIce.delete(id);
    remoteStreams.delete(id);

    const detector =
      speakingDetectors.get(id);

    if (detector) {
      try {
        detector.stop();
      } catch {}
    }

    speakingDetectors.delete(id);

    if (selectedId === id) {
      selectedId = myId;
    }

    renderVideos();
  }

  /*
   * VIDEO RENDERING
   */
  function renderVideos() {
    if (!localStream) {
      return;
    }

    const all = [
      {
        id: myId,
        name: myName,
        stream: localStream,
        local: true
      }
    ];

    for (const participant of participants.values()) {
      if (participant.id === myId) {
        continue;
      }

      const stream =
        remoteStreams.get(
          participant.id
        );

      all.push({
        id: participant.id,
        name: participant.name,
        stream,
        local: false
      });
    }

    let selected =
      all.find(item =>
        item.id === selectedId
      );

    if (!selected) {
      selected = all[0];
      selectedId = selected.id;
    }

    mainVideo.srcObject =
      selected.stream || null;

    mainVideo.muted =
      selected.local;

    mainLabel.textContent =
      selected.local
        ? `${selected.name} (You)`
        : selected.name;

    thumbnailRow.innerHTML = "";

    for (const item of all) {
      if (item.id === selected.id) {
        continue;
      }

      const thumbnail =
        document.createElement("div");

      thumbnail.className =
        "thumbnail";

      thumbnail.dataset.id =
        item.id;

      const video =
        document.createElement("video");

      video.autoplay = true;
      video.playsInline = true;
      video.muted = item.local;

      if (item.stream) {
        video.srcObject =
          item.stream;
      }

      const name =
        document.createElement("div");

      name.className =
        "thumbnailName";

      name.textContent =
        item.local
          ? `${item.name} (You)`
          : item.name;

      thumbnail.appendChild(video);
      thumbnail.appendChild(name);

      thumbnail.addEventListener(
        "click",
        () => {
          selectedId = item.id;
          renderVideos();
        }
      );

      thumbnailRow.appendChild(
        thumbnail
      );
    }

    /*
     * Make sure the main video can play.
     */
    mainVideo.play().catch(() => {});

    updateTalkingVisuals();
  }

  /*
   * FULLSCREEN VIDEO
   *
   * Clicking the large video enters fullscreen.
   * Clicking it again exits fullscreen.
   */
  mainVideo.addEventListener(
    "click",
    async () => {
      try {
        if (
          document.fullscreenElement
        ) {
          await document.exitFullscreen();
        } else {
          await mainVideo.requestFullscreen();
        }
      } catch {}
    }
  );

  /*
   * TALKING DETECTION
   */
  function setupSpeakingDetection(
    id,
    stream
  ) {
    if (
      speakingDetectors.has(id)
    ) {
      return;
    }

    const audioTracks =
      stream.getAudioTracks();

    if (!audioTracks.length) {
      return;
    }

    try {
      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const context =
        new AudioContext();

      const source =
        context.createMediaStreamSource(
          stream
        );

      const analyser =
        context.createAnalyser();

      analyser.fftSize = 512;

      const data =
        new Uint8Array(
          analyser.fftSize
        );

      source.connect(analyser);

      let talking = false;

      function check() {
        if (
          !speakingDetectors.has(id)
        ) {
          return;
        }

        analyser.getByteTimeDomainData(
          data
        );

        let total = 0;

        for (let i = 0; i < data.length; i++) {
          const value =
            (data[i] - 128) / 128;

          total += value * value;
        }

        const volume =
          Math.sqrt(
            total / data.length
          );

        const newTalking =
          volume > 0.035;

        if (newTalking !== talking) {
          talking = newTalking;

          speakingDetectors
            .get(id)
            .talking = talking;

          updateTalkingVisuals();
        }

        requestAnimationFrame(check);
      }

      speakingDetectors.set(id, {
        context,
        analyser,
        talking: false,
        stop() {
          try {
            source.disconnect();
          } catch {}

          try {
            analyser.disconnect();
          } catch {}

          try {
            context.close();
          } catch {}
        }
      });

      check();

    } catch (error) {
      console.error(
        "Speaking detection failed:",
        error
      );
    }
  }

  function setupLocalSpeakingDetection() {
    if (!localStream) {
      return;
    }

    setupSpeakingDetection(
      myId,
      localStream
    );
  }

  function updateTalkingVisuals() {
    const localDetector =
      speakingDetectors.get(myId);

    mainVideoBox.classList.toggle(
      "talking",
      Boolean(
        speakingDetectors.get(
          selectedId
        )?.talking
      )
    );

    document
      .querySelectorAll(".thumbnail")
      .forEach(thumbnail => {
        const id =
          thumbnail.dataset.id;

        thumbnail.classList.toggle(
          "talking",
          Boolean(
            speakingDetectors.get(
              id
            )?.talking
          )
        );
      });
  }

  /*
   * CHAT
   */
  function addChatMessage(message) {
    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message";

    if (message.userId === myId) {
      wrapper.classList.add("mine");
    }

    if (message.moderator) {
      wrapper.classList.add("moderator");
    }

    const name =
      document.createElement("div");

    name.className =
      "messageName";

    name.textContent =
      message.moderator
        ? `${message.name} • Moderator`
        : message.name;

    const bubble =
      document.createElement("div");

    bubble.className =
      "messageBubble";

    bubble.textContent =
      message.text;

    wrapper.appendChild(name);
    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    messages.scrollTop =
      messages.scrollHeight;
  }

  chatForm.addEventListener(
    "submit",
    event => {
      event.preventDefault();

      const text =
        chatInput.value.trim();

      if (!text) {
        return;
      }

      send({
        type: "chatMessage",
        text
      });

      chatInput.value = "";
      chatInput.focus();
    }
  );

  /*
   * MUTE
   */
  muteButton.addEventListener(
    "click",
    () => {
      if (!localStream) {
        return;
      }

      const tracks =
        localStream.getAudioTracks();

      for (const track of tracks) {
        track.enabled =
          !track.enabled;
      }

      micEnabled =
        tracks.length
          ? tracks[0].enabled
          : false;

      muteButton.textContent =
        micEnabled
          ? "Mute Mic"
          : "Unmute Mic";
    }
  );

  /*
   * CAMERA
   */
  cameraButton.addEventListener(
    "click",
    () => {
      if (!localStream) {
        return;
      }

      const tracks =
        localStream.getVideoTracks();

      for (const track of tracks) {
        track.enabled =
          !track.enabled;
      }

      cameraEnabled =
        tracks.length
          ? tracks[0].enabled
          : false;

      cameraButton.textContent =
        cameraEnabled
          ? "Turn Camera Off"
          : "Turn Camera On";
    }
  );

  /*
   * LEAVE
   */
  function leaveRoom() {
    send({
      type: "leaveRoom"
    });

    cleanupRoom();

    roomScreen.classList.add("hidden");
    joinScreen.classList.remove("hidden");

    joinStatus.textContent =
      "You left the room.";
  }

  leaveButton.addEventListener(
    "click",
    leaveRoom
  );

  function cleanupRoom() {
    for (const pc of peers.values()) {
      try {
        pc.close();
      } catch {}
    }

    peers.clear();
    participants.clear();
    remoteStreams.clear();
    pendingIce.clear();

    for (const detector of speakingDetectors.values()) {
      try {
        detector.stop();
      } catch {}
    }

    speakingDetectors.clear();

    selectedId = null;
    currentRoom = null;

    thumbnailRow.innerHTML = "";
    messages.innerHTML = "";

    mainVideo.srcObject = null;
  }

  /*
   * SERVER MESSAGES
   */
  function handleMessage(message) {
    switch (message.type) {

      case "registered":
        myId = message.id;

        localStorage.setItem(
          "blueberryUserId",
          myId
        );

        break;

      case "roomCreated":
        /*
         * The server automatically joins us.
         * DO NOT call joinRoom() here.
         */
        joinStatus.textContent =
          `Room created: ${message.room.code}`;

        break;

      case "roomJoined":
        enterRoom(
          message.room,
          message.participants,
          message.messages
        );

        setupLocalSpeakingDetection();

        break;

      case "userJoined":
        handleUserJoined(
          message.participant
        );

        break;

      case "userLeft":
        handleUserLeft(
          message.id
        );

        break;

      case "userNameChanged":
        if (
          message.id === myId
        ) {
          myName =
            message.name;

          localStorage.setItem(
            "blueberryUserName",
            myName
          );
        }

        const participant =
          participants.get(
            message.id
          );

        if (participant) {
          participant.name =
            message.name;
        }

        renderVideos();

        break;

      case "signal":
        handleSignal(
          message.from,
          message.signal
        );

        break;

      case "chatMessage":
        addChatMessage(
          message.message
        );

        break;

      case "kicked":
        alert(
          message.message ||
          "You were kicked."
        );

        cleanupRoom();

        roomScreen.classList.add(
          "hidden"
        );

        joinScreen.classList.remove(
          "hidden"
        );

        break;

      case "banned":
        alert(
          message.message ||
          "You are banned."
        );

        cleanupRoom();

        roomScreen.classList.add(
          "hidden"
        );

        joinScreen.classList.remove(
          "hidden"
        );

        break;

      case "roomLeft":
        cleanupRoom();
        break;

      case "error":
        joinStatus.textContent =
          message.message ||
          "Something went wrong.";

        /*
         * If already in the room, show errors as an alert.
         */
        if (
          !roomScreen.classList.contains(
            "hidden"
          )
        ) {
          alert(
            message.message ||
            "Something went wrong."
          );
        }

        break;
    }
  }

  /*
   * BUTTONS
   */
  createButton.addEventListener(
    "click",
    createRoom
  );

  joinButton.addEventListener(
    "click",
    joinRoom
  );

  /*
   * Enter in room code = join
   */
  roomCodeInput.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Enter"
      ) {
        joinRoom();
      }
    }
  );

  /*
   * Enter in create fields = create.
   */
  roomNameInput.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Enter"
      ) {
        createRoom();
      }
    }
  );

  /*
   * Page unload:
   * WebSocket closes automatically.
   */
  window.addEventListener(
    "beforeunload",
    () => {
      try {
        send({
          type: "leaveRoom"
        });
      } catch {}
    }
  );
</script>

</body>
</html>
