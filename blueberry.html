<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Blueberry Console</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #08090d;
      color: white;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      background: #5664ff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button.secondary {
      background: #292d38;
    }

    button.danger {
      background: #b83c4d;
    }

    button.green {
      background: #287a49;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .loginBox {
      width: min(430px, 100%);
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 20px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
    }

    .sub {
      color: #969dab;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      background: #090b10;
      color: white;
      border: 1px solid #343946;
      border-radius: 10px;
      outline: none;
    }

    .loginButton {
      width: 100%;
      margin-top: 20px;
    }

    #loginStatus {
      color: #aab0bd;
      margin-top: 12px;
      font-size: 14px;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
    }

    .moderatorBadge {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 8px;
      background: #272b38;
      border-radius: 8px;
      color: #b9c0cf;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .card {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 16px;
      padding: 16px;
      min-width: 0;
    }

    .card.full {
      grid-column: 1 / -1;
    }

    .cardHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .cardTitle {
      font-size: 18px;
      font-weight: bold;
    }

    .count {
      color: #8f96a5;
      font-size: 13px;
    }

    .room {
      border: 1px solid #2b303b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .room:last-child {
      margin-bottom: 0;
    }

    .roomName {
      font-weight: bold;
      font-size: 16px;
    }

    .roomCode {
      color: #9299a7;
      font-size: 13px;
      margin-top: 3px;
    }

    .participants {
      margin-top: 10px;
    }

    .participant {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #252934;
      padding: 9px 0;
    }

    .participantName {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participantRole {
      color: #999faf;
      font-size: 11px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty {
      color: #737b89;
      padding: 8px 0;
    }

    .banItem,
    .accessItem,
    .logItem {
      border-top: 1px solid #252934;
      padding: 10px 0;
    }

    .banItem:first-child,
    .accessItem:first-child,
    .logItem:first-child {
      border-top: 0;
    }

    .muted {
      color: #858d9c;
      font-size: 12px;
      margin-top: 3px;
    }

    .createRoomForm {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }

    .createRoomForm button {
      grid-column: 1 / -1;
    }

    /* MODAL */

    .modalBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      width: min(430px, 100%);
      background: #151821;
      border: 1px solid #303541;
      border-radius: 18px;
      padding: 20px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .durationGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .durationGrid .full {
      grid-column: 1 / -1;
    }

    .modalButtons {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .modalButtons button {
      flex: 1;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card.full {
        grid-column: auto;
      }
    }

    @media (max-width: 550px) {
      .createRoomForm {
        grid-template-columns: 1fr;
      }

      .createRoomForm button {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">

    <div class="loginBox">

      <h1>Blueberry Console</h1>

      <div class="sub">
        Moderator control panel
      </div>

      <label for="moderatorName">
        Moderator name
      </label>

      <input
        id="moderatorName"
        maxlength="30"
        placeholder="Your moderator name"
        autocomplete="off"
      >

      <label for="moderatorPin">
        Moderator PIN
      </label>

      <input
        id="moderatorPin"
        type="password"
        placeholder="Moderator PIN"
        autocomplete="off"
      >

      <button
        id="loginButton"
        class="loginButton"
      >
        Enter Console
      </button>

      <div id="loginStatus"></div>

    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="topbar">

      <div>
        <div class="title">
          Blueberry Console
        </div>

        <div
          id="moderatorBadge"
          class="moderatorBadge"
        >
          Moderator
        </div>
      </div>

      <button
        id="refreshButton"
        class="secondary"
      >
        Refresh
      </button>

    </div>


    <div class="grid">

      <!-- ROOMS -->
      <div class="card full">

        <div class="cardHeader">

          <div class="cardTitle">
            Open Rooms
          </div>

          <div
            id="roomCount"
            class="count"
          >
            0 rooms
          </div>

        </div>

        <div class="createRoomForm">

          <input
            id="moderatorRoomName"
            maxlength="50"
            placeholder="Custom room name"
          >

          <input
            id="moderatorRoomCode"
            maxlength="30"
            placeholder="Custom room code (optional)"
          >

          <button id="moderatorCreateRoomButton">
            Create Room
          </button>

        </div>

        <div id="roomsList"></div>

      </div>


      <!-- BANS -->
      <div class="card">

        <div class="cardHeader">

          <div class="cardTitle">
            Banned Users
          </div>

          <div
            id="banCount"
            class="count"
          >
            0
          </div>

        </div>

        <div id="bansList"></div>

      </div>


      <!-- MODERATOR ACCESS -->
      <div class="card">

        <div class="cardHeader">

          <div class="cardTitle">
            Moderator Access
          </div>

          <div
            id="accessCount"
            class="count"
          >
            0
          </div>

        </div>

        <div id="accessList"></div>

      </div>


      <!-- LOG -->
      <div class="card full">

        <div class="cardHeader">

          <div class="cardTitle">
            Moderation History
          </div>

        </div>

        <div id="logsList"></div>

      </div>

    </div>

  </div>


  <!-- BAN MODAL -->
  <div
    id="banModal"
    class="modalBackdrop hidden"
  >

    <div class="modal">

      <h2>Ban User</h2>

      <div id="banTargetName"></div>

      <label>
        Duration
      </label>

      <div class="durationGrid">

        <input
          id="banAmount"
          type="number"
          min="1"
          value="10"
        >

        <select id="banUnit">
          <option value="seconds">Seconds</option>
          <option value="minutes" selected>Minutes</option>
          <option value="hours">Hours</option>
          <option value="days">Days</option>
          <option value="weeks">Weeks</option>
          <option value="months">Months</option>
          <option value="years">Years</option>
        </select>

        <button
          id="banPermanent"
          class="secondary full"
        >
          Permanent
        </button>

      </div>

      <div class="modalButtons">

        <button
          id="cancelBan"
          class="secondary"
        >
          Cancel
        </button>

        <button
          id="confirmBan"
          class="danger"
        >
          Ban User
        </button>

      </div>

    </div>

  </div>


  <!-- GIVE MODERATOR MODAL -->
  <div
    id="moderatorModal"
    class="modalBackdrop hidden"
  >

    <div class="modal">

      <h2>Give Moderator Access</h2>

      <div id="moderatorTargetName"></div>

      <label>
        Custom Moderator PIN
      </label>

      <input
        id="newModeratorPin"
        maxlength="100"
        placeholder="Create a PIN"
      >

      <label>
        Duration
      </label>

      <div class="durationGrid">

        <input
          id="moderatorAmount"
          type="number"
          min="1"
          value="1"
        >

        <select id="moderatorUnit">
          <option value="seconds">Seconds</option>
          <option value="minutes">Minutes</option>
          <option value="hours" selected>Hours</option>
          <option value="days">Days</option>
          <option value="weeks">Weeks</option>
          <option value="months">Months</option>
          <option value="years">Years</option>
        </select>

        <button
          id="moderatorPermanent"
          class="secondary full"
        >
          Permanent
        </button>

      </div>

      <div class="modalButtons">

        <button
          id="cancelModerator"
          class="secondary"
        >
          Cancel
        </button>

        <button
          id="confirmModerator"
          class="green"
        >
          Give Moderator
        </button>

      </div>

    </div>

  </div>


<script>
  const loginScreen =
    document.getElementById(
      "loginScreen"
    );

  const dashboard =
    document.getElementById(
      "dashboard"
    );

  const moderatorName =
    document.getElementById(
      "moderatorName"
    );

  const moderatorPin =
    document.getElementById(
      "moderatorPin"
    );

  const loginButton =
    document.getElementById(
      "loginButton"
    );

  const loginStatus =
    document.getElementById(
      "loginStatus"
    );

  const moderatorBadge =
    document.getElementById(
      "moderatorBadge"
    );

  const roomsList =
    document.getElementById(
      "roomsList"
    );

  const bansList =
    document.getElementById(
      "bansList"
    );

  const accessList =
    document.getElementById(
      "accessList"
    );

  const logsList =
    document.getElementById(
      "logsList"
    );

  const roomCount =
    document.getElementById(
      "roomCount"
    );

  const banCount =
    document.getElementById(
      "banCount"
    );

  const accessCount =
    document.getElementById(
      "accessCount"
    );

  const refreshButton =
    document.getElementById(
      "refreshButton"
    );

  const moderatorRoomName =
    document.getElementById(
      "moderatorRoomName"
    );

  const moderatorRoomCode =
    document.getElementById(
      "moderatorRoomCode"
    );

  const moderatorCreateRoomButton =
    document.getElementById(
      "moderatorCreateRoomButton"
    );

  const banModal =
    document.getElementById(
      "banModal"
    );

  const banTargetName =
    document.getElementById(
      "banTargetName"
    );

  const banAmount =
    document.getElementById(
      "banAmount"
    );

  const banUnit =
    document.getElementById(
      "banUnit"
    );

  const banPermanent =
    document.getElementById(
      "banPermanent"
    );

  const cancelBan =
    document.getElementById(
      "cancelBan"
    );

  const confirmBan =
    document.getElementById(
      "confirmBan"
    );

  const moderatorModal =
    document.getElementById(
      "moderatorModal"
    );

  const moderatorTargetName =
    document.getElementById(
      "moderatorTargetName"
    );

  const newModeratorPin =
    document.getElementById(
      "newModeratorPin"
    );

  const moderatorAmount =
    document.getElementById(
      "moderatorAmount"
    );

  const moderatorUnit =
    document.getElementById(
      "moderatorUnit"
    );

  const moderatorPermanent =
    document.getElementById(
      "moderatorPermanent"
    );

  const cancelModerator =
    document.getElementById(
      "cancelModerator"
    );

  const confirmModerator =
    document.getElementById(
      "confirmModerator"
    );

  let socket = null;

  let myId =
    localStorage.getItem(
      "blueberryModeratorId"
    ) || crypto.randomUUID();

  localStorage.setItem(
    "blueberryModeratorId",
    myId
  );

  let moderatorLevel = null;

  let selectedBanTarget = null;
  let selectedModeratorTarget = null;

  let currentBans = [];
  let currentAccess = [];

  let banIsPermanent = false;
  let moderatorIsPermanent = false;


  function getWebSocketUrl() {
    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    return `${protocol}//${location.host}/ws`;
  }


  function send(data) {
    if (
      socket &&
      socket.readyState === WebSocket.OPEN
    ) {
      socket.send(
        JSON.stringify(data)
      );
    }
  }


  function connectModerator() {
    socket = new WebSocket(
      getWebSocketUrl()
    );

    socket.addEventListener(
      "open",
      () => {
        send({
          type: "moderatorAuth",
          id: myId,
          name:
            moderatorName.value.trim() ||
            "Moderator",
          pin:
            moderatorPin.value
        });
      }
    );

    socket.addEventListener(
      "message",
      event => {
        try {
          handleMessage(
            JSON.parse(event.data)
          );
        } catch {
          console.error(
            "Invalid server message."
          );
        }
      }
    );

    socket.addEventListener(
      "error",
      () => {
        loginStatus.textContent =
          "Could not connect to the server.";
      }
    );

    socket.addEventListener(
      "close",
      () => {
        if (
          !dashboard.classList.contains(
            "hidden"
          )
        ) {
          alert(
            "The moderator connection closed."
          );
        }
      }
    );
  }


  function formatDate(timestamp) {
    if (!timestamp) {
      return "Never";
    }

    return new Date(
      timestamp
    ).toLocaleString();
  }


  function formatRemaining(expiresAt) {
    if (!expiresAt) {
      return "Permanent";
    }

    const remaining =
      expiresAt - Date.now();

    if (remaining <= 0) {
      return "Expired";
    }

    const seconds =
      Math.floor(
        remaining / 1000
      );

    const minutes =
      Math.floor(seconds / 60);

    const hours =
      Math.floor(minutes / 60);

    const days =
      Math.floor(hours / 24);

    if (days > 0) {
      return `${days}d ${hours % 24}h remaining`;
    }

    if (hours > 0) {
      return `${hours}h ${minutes % 60}m remaining`;
    }

    if (minutes > 0) {
      return `${minutes}m ${seconds % 60}s remaining`;
    }

    return `${seconds}s remaining`;
  }


  function clearElement(element) {
    element.innerHTML = "";
  }


  /*
   * ROOM LIST
   */
  function renderRooms(rooms) {
    clearElement(roomsList);

    roomCount.textContent =
      `${rooms.length} room${rooms.length === 1 ? "" : "s"}`;

    if (!rooms.length) {
      roomsList.innerHTML =
        `<div class="empty">No open rooms.</div>`;

      return;
    }

    for (const room of rooms) {

      const roomElement =
        document.createElement("div");

      roomElement.className =
        "room";

      const title =
        document.createElement("div");

      title.className =
        "roomName";

      title.textContent =
        room.name;

      const code =
        document.createElement("div");

      code.className =
        "roomCode";

      code.textContent =
        `Code: ${room.code}`;

      roomElement.appendChild(title);
      roomElement.appendChild(code);

      const actions =
        document.createElement("div");

      actions.className =
        "actions";

      const joinButton =
        document.createElement("button");

      joinButton.textContent =
        "Join Normally";

      joinButton.addEventListener(
        "click",
        () => {
          joinRoom(
            room.code,
            false
          );
        }
      );

      const anonymousButton =
        document.createElement("button");

      anonymousButton.textContent =
        "Join Anonymously";

      anonymousButton.className =
        "secondary";

      anonymousButton.addEventListener(
        "click",
        () => {
          joinRoom(
            room.code,
            true
          );
        }
      );

      actions.appendChild(
        joinButton
      );

      actions.appendChild(
        anonymousButton
      );

      roomElement.appendChild(
        actions
      );

      const participants =
        document.createElement(
          "div"
        );

      participants.className =
        "participants";

      for (
        const participant
        of room.participants
      ) {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "participant";

        const info =
          document.createElement(
            "div"
          );

        const participantName =
          document.createElement(
            "div"
          );

        participantName.className =
          "participantName";

        participantName.textContent =
          participant.name;

        const role =
          document.createElement(
            "div"
          );

        role.className =
          "participantRole";

        role.textContent =
          participant.role === "moderator"
            ? "Moderator"
            : "User";

        info.appendChild(
          participantName
        );

        info.appendChild(
          role
        );

        const controls =
          document.createElement(
            "div"
          );

        controls.className =
          "actions";

        /*
         * Delegated moderators cannot control
         * other moderators.
         */
        const canControl =
          participant.role !== "moderator";

        if (canControl) {

          const kick =
            document.createElement(
              "button"
            );

          kick.textContent =
            "Kick";

          kick.className =
            "secondary";

          kick.addEventListener(
            "click",
            () => {
              send({
                type: "kick",
                targetId:
                  participant.id
              });
            }
          );

          controls.appendChild(
            kick
          );


          const ban =
            document.createElement(
              "button"
            );

          ban.textContent =
            "Ban";

          ban.className =
            "danger";

          ban.addEventListener(
            "click",
            () => {
              openBanModal(
                participant.id,
                participant.name
              );
            }
          );

          controls.appendChild(
            ban
          );


          /*
           * ONLY MASTER can give moderator.
           */
          if (
            moderatorLevel ===
            "master"
          ) {

            const give =
              document.createElement(
                "button"
              );

            give.textContent =
              "Give Moderator";

            give.className =
              "green";

            give.addEventListener(
              "click",
              () => {
                openModeratorModal(
                  participant.id,
                  participant.name
                );
              }
            );

            controls.appendChild(
              give
            );
          }
        }

        row.appendChild(info);
        row.appendChild(controls);

        participants.appendChild(row);
      }

      roomElement.appendChild(
        participants
      );

      roomsList.appendChild(
        roomElement
      );
    }
  }


  /*
   * JOIN ROOM AS MODERATOR
   *
   * Anonymous moderators publish no camera/mic,
   * but they DO receive users' WebRTC streams.
   */
  function joinRoom(
    roomCode,
    anonymous
  ) {
    send({
      type: "moderatorJoinRoom",
      roomCode
    });

    /*
     * The normal moderator console does not publish
     * a local camera stream. The normal user page
     * publishes camera/mic to this moderator through WebRTC.
     */
  }


  /*
   * BANS
   */
  function renderBans(bans) {
    currentBans = bans || [];

    clearElement(bansList);

    banCount.textContent =
      currentBans.length;

    if (!currentBans.length) {
      bansList.innerHTML =
        `<div class="empty">No active bans.</div>`;

      return;
    }

    for (const ban of currentBans) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "banItem";

      const name =
        document.createElement(
          "div"
        );

      name.textContent =
        ban.name;

      const details =
        document.createElement(
          "div"
        );

      details.className =
        "muted";

      details.textContent =
        `${ban.durationText} • ${formatRemaining(ban.expiresAt)}`;

      const created =
        document.createElement(
          "div"
        );

      created.className =
        "muted";

      created.textContent =
        `Banned by ${ban.moderatorName} • ${formatDate(ban.createdAt)}`;

      const unban =
        document.createElement(
          "button"
        );

      unban.textContent =
        "Unban";

      unban.className =
        "green";

      unban.style.marginTop =
        "7px";

      unban.addEventListener(
        "click",
        () => {
          send({
            type: "unban",
            banId: ban.id
          });
        }
      );

      item.appendChild(name);
      item.appendChild(details);
      item.appendChild(created);
      item.appendChild(unban);

      bansList.appendChild(item);
    }
  }


  /*
   * MODERATOR ACCESS
   */
  function renderAccess(accessListData) {
    currentAccess =
      accessListData || [];

    clearElement(accessList);

    accessCount.textContent =
      currentAccess.length;

    if (!currentAccess.length) {
      accessList.innerHTML =
        `<div class="empty">No delegated moderators.</div>`;

      return;
    }

    for (const access of currentAccess) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "accessItem";

      const name =
        document.createElement(
          "div"
        );

      name.textContent =
        access.name;

      const details =
        document.createElement(
          "div"
        );

      details.className =
        "muted";

      details.textContent =
        `${access.durationText} • ${formatRemaining(access.expiresAt)}`;

      const creator =
        document.createElement(
          "div"
        );

      creator.className =
        "muted";

      creator.textContent =
        `Granted by ${access.createdBy} • ${formatDate(access.createdAt)}`;

      item.appendChild(name);
      item.appendChild(details);
      item.appendChild(creator);

      /*
       * Only master can revoke.
       */
      if (
        moderatorLevel ===
        "master"
      ) {

        const revoke =
          document.createElement(
            "button"
          );

        revoke.textContent =
          "Revoke";

        revoke.className =
          "danger";

        revoke.style.marginTop =
          "7px";

        revoke.addEventListener(
          "click",
          () => {
            send({
              type: "revokeModerator",
              accessId:
                access.id
            });
          }
        );

        item.appendChild(
          revoke
        );
      }

      accessList.appendChild(
        item
      );
    }
  }


  /*
   * LOG
   */
  function renderLogs(logs) {
    clearElement(logsList);

    if (!logs || !logs.length) {
      logsList.innerHTML =
        `<div class="empty">No moderation history yet.</div>`;

      return;
    }

    for (const log of logs) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "logItem";

      const action =
        document.createElement(
          "div"
        );

      action.textContent =
        `${log.action}: ${log.target}`;

      const details =
        document.createElement(
          "div"
        );

      details.className =
        "muted";

      details.textContent =
        `${log.moderator}${log.durationText ? " • " + log.durationText : ""} • ${formatDate(log.createdAt)}`;

      item.appendChild(action);
      item.appendChild(details);

      logsList.appendChild(item);
    }
  }


  /*
   * BAN MODAL
   */
  function openBanModal(
    targetId,
    targetName
  ) {
    selectedBanTarget =
      targetId;

    banTargetName.textContent =
      `Ban: ${targetName}`;

    banModal.classList.remove(
      "hidden"
    );
  }


  function closeBanModal() {
    selectedBanTarget =
      null;

    banModal.classList.add(
      "hidden"
    );
  }


  banPermanent.addEventListener(
    "click",
    () => {
      banIsPermanent =
        !banIsPermanent;

      banPermanent.textContent =
        banIsPermanent
          ? "Permanent: ON"
          : "Permanent";
    }
  );


  cancelBan.addEventListener(
    "click",
    closeBanModal
  );


  confirmBan.addEventListener(
    "click",
    () => {

      if (!selectedBanTarget) {
        return;
      }

      send({
        type: "ban",
        targetId:
          selectedBanTarget,
        amount:
          Number(
            banAmount.value
          ),
        unit:
          banUnit.value,
        permanent:
          banIsPermanent
      });

      banIsPermanent =
        false;

      banPermanent.textContent =
        "Permanent";

      closeBanModal();
    }
  );


  /*
   * GIVE MODERATOR MODAL
   */
  function openModeratorModal(
    targetId,
    targetName
  ) {
    if (
      moderatorLevel !==
      "master"
    ) {
      return;
    }

    selectedModeratorTarget =
      targetId;

    moderatorTargetName.textContent =
      `Give moderator access to: ${targetName}`;

    newModeratorPin.value =
      "";

    moderatorModal.classList.remove(
      "hidden"
    );
  }


  function closeModeratorModal() {
    selectedModeratorTarget =
      null;

    moderatorModal.classList.add(
      "hidden"
    );
  }


  moderatorPermanent.addEventListener(
    "click",
    () => {
      moderatorIsPermanent =
        !moderatorIsPermanent;

      moderatorPermanent.textContent =
        moderatorIsPermanent
          ? "Permanent: ON"
          : "Permanent";
    }
  );


  cancelModerator.addEventListener(
    "click",
    closeModeratorModal
  );


  confirmModerator.addEventListener(
    "click",
    () => {

      if (
        !selectedModeratorTarget
      ) {
        return;
      }

      const pin =
        newModeratorPin.value.trim();

      if (pin.length < 4) {
        alert(
          "Moderator PIN must be at least 4 characters."
        );

        return;
      }

      send({
        type: "giveModerator",
        targetId:
          selectedModeratorTarget,
        pin,
        amount:
          Number(
            moderatorAmount.value
          ),
        unit:
          moderatorUnit.value,
        permanent:
          moderatorIsPermanent
      });

      moderatorIsPermanent =
        false;

      moderatorPermanent.textContent =
        "Permanent";

      closeModeratorModal();
    }
  );


  /*
   * CREATE MODERATOR ROOM
   *
   * Uses the EXACT custom room code entered.
   */
  moderatorCreateRoomButton.addEventListener(
    "click",
    () => {

      const name =
        moderatorRoomName.value.trim();

      const code =
        moderatorRoomCode.value.trim();

      if (!name) {
        alert(
          "Enter a room name."
        );

        return;
      }

      send({
        type: "moderatorCreateRoom",
        roomName: name,
        roomCode: code
      });

      moderatorRoomName.value =
        "";

      moderatorRoomCode.value =
        "";
    }
  );


  /*
   * REFRESH
   */
  refreshButton.addEventListener(
    "click",
    () => {
      send({
        type: "getModeratorData"
      });
    }
  );


  /*
   * SERVER MESSAGES
   */
  function handleMessage(message) {

    switch (message.type) {

      case "moderatorAuthSuccess":

        myId =
          message.id;

        moderatorLevel =
          message.moderatorLevel;

        localStorage.setItem(
          "blueberryModeratorId",
          myId
        );

        loginScreen.classList.add(
          "hidden"
        );

        dashboard.classList.remove(
          "hidden"
        );

        moderatorBadge.textContent =
          moderatorLevel === "master"
            ? "Master Moderator"
            : "Delegated Moderator";

        renderRooms(
          message.rooms || []
        );

        renderBans(
          message.bans || []
        );

        renderAccess(
          message.moderatorAccess || []
        );

        renderLogs(
          message.logs || []
        );

        break;


      case "moderatorAuthFailed":

        loginStatus.textContent =
          message.message ||
          "Incorrect PIN.";

        break;


      case "moderatorData":

        renderRooms(
          message.rooms || []
        );

        renderBans(
          message.bans || []
        );

        renderAccess(
          message.moderatorAccess || []
        );

        renderLogs(
          message.logs || []
        );

        break;


      case "roomList":

        renderRooms(
          message.rooms || []
        );

        break;


      case "moderatorRoomCreated":

        alert(
          `Room created!\n\nName: ${message.room.name}\nCode: ${message.room.code}`
        );

        send({
          type: "getModeratorData"
        });

        break;


      case "moderatorAccessCreated":

        alert(
          "Moderator access created.\n\nGive the new moderator the custom PIN you entered."
        );

        send({
          type: "getModeratorData"
        });

        break;


      case "moderatorAccessGranted":

        alert(
          message.message ||
          "You have been granted moderator access."
        );

        break;


      case "moderatorAccessRevoked":

        alert(
          message.reason ||
          "Your moderator access was revoked."
        );

        try {
          socket.close();
        } catch {}

        location.reload();

        break;


      case "error":

        alert(
          message.message ||
          "Something went wrong."
        );

        break;

    }
  }


  /*
   * LOGIN
   */
  loginButton.addEventListener(
    "click",
    () => {

      if (
        !moderatorPin.value
      ) {
        loginStatus.textContent =
          "Enter the moderator PIN.";

        return;
      }

      loginStatus.textContent =
        "Connecting...";

      connectModerator();
    }
  );


  moderatorPin.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Enter"
      ) {
        loginButton.click();
      }
    }
  );


  /*
   * Live countdown refresh.
   */
  setInterval(
    () => {

      if (
        dashboard.classList.contains(
          "hidden"
        )
      ) {
        return;
      }

      /*
       * Re-render only when necessary.
       * This keeps expiration times current.
       */
      if (
        currentBans.length ||
        currentAccess.length
      ) {
        renderBans(
          currentBans
        );

        renderAccess(
          currentAccess
        );
      }

    },
    1000
  );

</script>

</body>
</html>
