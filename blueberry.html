<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>Blueberry Console</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0f13;
  color: white;
  font-family: Arial, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  border: none;
  border-radius: 9px;
  padding: 9px 13px;
  cursor: pointer;
  background: #5968ff;
  color: white;
  font-weight: bold;
}

button:hover {
  filter: brightness(1.1);
}

.secondary {
  background: #30333a;
}

.danger {
  background: #d83b4b;
}

.green {
  background: #299b56;
}

.hidden {
  display: none !important;
}


/* LOGIN */

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.loginBox {
  width: 100%;
  max-width: 400px;
  background: #191c22;
  padding: 30px;
  border-radius: 18px;
}

.loginBox h1 {
  text-align: center;
}

.loginBox input {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #3b3f48;
  background: #0f1115;
  color: white;
}

.loginBox button {
  width: 100%;
  margin-top: 10px;
}

#loginStatus {
  margin-top: 12px;
  color: #aaa;
  text-align: center;
}


/* DASHBOARD */

#dashboard {
  display: none;
}

.header {
  min-height: 65px;
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #191c22;
  border-bottom: 1px solid #292d35;
  gap: 10px;
}

.headerTitle {
  font-size: 20px;
  font-weight: bold;
}

.headerSub {
  color: #999;
  font-size: 12px;
  margin-top: 3px;
}

.container {
  max-width: 1600px;
  margin: auto;
  padding: 15px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.panel {
  background: #191c22;
  border-radius: 15px;
  overflow: hidden;
}

.panelHeader {
  padding: 14px;
  border-bottom: 1px solid #30333a;
  font-weight: bold;
}

.panelBody {
  padding: 13px;
}


/* ROOMS */

.room {
  background: #25282f;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.roomName {
  font-weight: bold;
}

.roomCode {
  color: #8e97ff;
  font-family: monospace;
  margin-top: 4px;
}

.roomActions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 9px;
}


/* PARTICIPANTS */

.participant {
  background: #25282f;
  padding: 10px;
  border-radius: 9px;
  margin-bottom: 7px;
}

.participantName {
  font-weight: bold;
}

.participantActions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
}


/* BANS / ACCESS / LOG */

.listItem {
  background: #25282f;
  border-radius: 9px;
  padding: 10px;
  margin-bottom: 7px;
}

.small {
  color: #999;
  font-size: 12px;
  margin-top: 3px;
}

.listActions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 7px;
}


/* WATCH AREA */

#watchArea {
  display: none;
  margin-top: 15px;
}

.watchGrid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 15px;
}

.watchVideoBox {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #050506;
  border-radius: 15px;
  overflow: hidden;
  border: 3px solid transparent;
}

.watchVideoBox.speaking {
  border-color: #38d66b;
}

#watchLargeVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.watchName {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(0,0,0,.7);
  padding: 7px 9px;
  border-radius: 7px;
}

.watchThumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
}

.watchThumb {
  position: relative;
  flex: 0 0 140px;
  height: 85px;
  border-radius: 10px;
  overflow: hidden;
  background: #17191e;
  border: 3px solid transparent;
  cursor: pointer;
}

.watchThumb.speaking {
  border-color: #38d66b;
}

.watchThumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.watchThumbName {
  position: absolute;
  bottom: 4px;
  left: 5px;
  right: 5px;
  padding: 3px 5px;
  background: rgba(0,0,0,.7);
  font-size: 11px;
  border-radius: 4px;
}


/* CHAT */

.chatBox {
  height: 100%;
  min-height: 500px;
  background: #191c22;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chatTitle {
  padding: 14px;
  border-bottom: 1px solid #30333a;
  font-weight: bold;
}

.chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.chatMessage {
  margin-bottom: 10px;
}

.chatName {
  font-size: 12px;
  color: #8f9aff;
  font-weight: bold;
  margin-bottom: 3px;
}

.chatBubble {
  display: inline-block;
  max-width: 95%;
  background: #30333a;
  border-radius: 9px;
  padding: 8px 10px;
  white-space: pre-wrap;
  word-break: break-word;
}

.chatInput {
  display: flex;
  gap: 6px;
  padding: 10px;
  border-top: 1px solid #30333a;
}

.chatInput input {
  flex: 1;
  min-width: 0;
  padding: 10px;
  background: #101216;
  color: white;
  border: 1px solid #3b3f48;
  border-radius: 8px;
}


/* MODALS */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modalBox {
  width: 100%;
  max-width: 430px;
  background: #1a1d23;
  border-radius: 15px;
  padding: 20px;
}

.modalBox h2 {
  margin-top: 0;
}

.modalBox input,
.modalBox select {
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  background: #101216;
  color: white;
  border: 1px solid #3b3f48;
  border-radius: 8px;
}

.modalButtons {
  display: flex;
  gap: 7px;
  margin-top: 15px;
}

.modalButtons button {
  flex: 1;
}

.durationRow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 8px;
}

.durationRow input,
.durationRow select {
  margin-top: 0;
}

.checkboxRow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.checkboxRow input {
  width: auto;
}


/* RESPONSIVE */

@media (max-width: 1000px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .watchGrid {
    grid-template-columns: 1fr;
  }

  .chatBox {
    min-height: 400px;
  }
}
</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>🫐 Blueberry Console</h1>

    <input
      id="moderatorName"
      maxlength="30"
      placeholder="Moderator name"
    >

    <input
      id="moderatorPin"
      type="password"
      placeholder="Moderator PIN"
    >

    <button id="loginButton">
      Enter Console
    </button>

    <div id="loginStatus"></div>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <div class="header">

    <div>

      <div class="headerTitle">
        🫐 Blueberry Console
      </div>

      <div
        id="headerSub"
        class="headerSub"
      ></div>

    </div>

    <button
      id="logoutButton"
      class="danger"
    >
      Logout
    </button>

  </div>


  <div class="container">

    <div class="grid">


      <!-- ROOMS -->

      <div class="panel">

        <div class="panelHeader">
          Open Rooms
        </div>

        <div
          id="roomsList"
          class="panelBody"
        ></div>

      </div>


      <!-- PARTICIPANTS -->

      <div class="panel">

        <div class="panelHeader">
          Participants
        </div>

        <div
          id="participantsList"
          class="panelBody"
        ></div>

      </div>


      <!-- BANS -->

      <div class="panel">

        <div class="panelHeader">
          Banned Users
        </div>

        <div
          id="bansList"
          class="panelBody"
        ></div>

      </div>


      <!-- MODERATOR ACCESS -->

      <div class="panel">

        <div class="panelHeader">
          Moderator Access
        </div>

        <div
          id="moderatorAccessList"
          class="panelBody"
        ></div>

      </div>


      <!-- HISTORY -->

      <div class="panel">

        <div class="panelHeader">
          Moderation History
        </div>

        <div
          id="logsList"
          class="panelBody"
        ></div>

      </div>


    </div>


    <!-- WATCH ROOM -->

    <div id="watchArea">

      <div class="watchGrid">

        <div>

          <div
            id="watchLargeBox"
            class="watchVideoBox"
          >

            <video
              id="watchLargeVideo"
              autoplay
              playsinline
            ></video>

            <div
              id="watchLargeName"
              class="watchName"
            >
              Select a participant
            </div>

          </div>

          <div
            id="watchThumbs"
            class="watchThumbs"
          ></div>

        </div>


        <!-- MODERATOR CHAT -->

        <div class="chatBox">

          <div class="chatTitle">
            💬 Room Chat
          </div>

          <div
            id="watchChatMessages"
            class="chatMessages"
          ></div>

          <div class="chatInput">

            <input
              id="moderatorChatInput"
              maxlength="1000"
              placeholder="Moderator message..."
            >

            <button
              id="moderatorChatButton"
            >
              Send
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- BAN MODAL -->

<div
  id="banModal"
  class="modal"
>

  <div class="modalBox">

    <h2>Ban User</h2>

    <div id="banTargetName"></div>

    <div class="durationRow">

      <input
        id="banAmount"
        type="number"
        min="1"
        value="10"
      >

      <select id="banUnit">

        <option value="seconds">
          Seconds
        </option>

        <option value="minutes" selected>
          Minutes
        </option>

        <option value="hours">
          Hours
        </option>

        <option value="days">
          Days
        </option>

        <option value="weeks">
          Weeks
        </option>

        <option value="months">
          Months
        </option>

        <option value="years">
          Years
        </option>

      </select>

    </div>

    <label class="checkboxRow">

      <input
        id="banPermanent"
        type="checkbox"
      >

      Permanent ban

    </label>

    <div class="modalButtons">

      <button
        id="banCancel"
        class="secondary"
      >
        Cancel
      </button>

      <button
        id="banConfirm"
        class="danger"
      >
        Ban
      </button>

    </div>

  </div>

</div>


<!-- GIVE MODERATOR MODAL -->

<div
  id="moderatorModal"
  class="modal"
>

  <div class="modalBox">

    <h2>
      Give Moderator Access
    </h2>

    <div id="moderatorTargetName"></div>

    <input
      id="newModeratorPin"
      type="text"
      maxlength="100"
      placeholder="Custom moderator PIN"
    >

    <div class="durationRow">

      <input
        id="moderatorAmount"
        type="number"
        min="1"
        value="1"
      >

      <select id="moderatorUnit">

        <option value="seconds">
          Seconds
        </option>

        <option value="minutes">
          Minutes
        </option>

        <option value="hours">
          Hours
        </option>

        <option value="days" selected>
          Days
        </option>

        <option value="weeks">
          Weeks
        </option>

        <option value="months">
          Months
        </option>

        <option value="years">
          Years
        </option>

      </select>

    </div>

    <label class="checkboxRow">

      <input
        id="moderatorPermanent"
        type="checkbox"
      >

      Permanent access

    </label>

    <div class="modalButtons">

      <button
        id="moderatorCancel"
        class="secondary"
      >
        Cancel
      </button>

      <button
        id="moderatorConfirm"
      >
        Give Moderator
      </button>

    </div>

  </div>

</div>


<script>
const socketUrl =
  (
    location.protocol === "https:"
      ? "wss://"
      : "ws://"
  ) +
  location.host +
  "/ws";


let ws = null;
let moderatorId = null;
let moderatorName = "";
let moderatorLevel = null;

let rooms = [];
let bans = [];
let moderatorAccess = [];
let logs = [];

let selectedBanUser = null;
let selectedModeratorUser = null;

let watchingRoom = null;
let selectedWatchUser = null;

const watchPeers = new Map();
const watchStreams = new Map();
const watchThumbs = new Map();
const watchPendingCandidates = new Map();
const watchParticipants = new Map();


const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const dashboard =
  document.getElementById(
    "dashboard"
  );

const moderatorNameInput =
  document.getElementById(
    "moderatorName"
  );

const moderatorPinInput =
  document.getElementById(
    "moderatorPin"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const headerSub =
  document.getElementById(
    "headerSub"
  );

const roomsList =
  document.getElementById(
    "roomsList"
  );

const participantsList =
  document.getElementById(
    "participantsList"
  );

const bansList =
  document.getElementById(
    "bansList"
  );

const moderatorAccessList =
  document.getElementById(
    "moderatorAccessList"
  );

const logsList =
  document.getElementById(
    "logsList"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const watchArea =
  document.getElementById(
    "watchArea"
  );

const watchLargeBox =
  document.getElementById(
    "watchLargeBox"
  );

const watchLargeVideo =
  document.getElementById(
    "watchLargeVideo"
  );

const watchLargeName =
  document.getElementById(
    "watchLargeName"
  );

const watchThumbs =
  document.getElementById(
    "watchThumbs"
  );

const watchChatMessages =
  document.getElementById(
    "watchChatMessages"
  );

const moderatorChatInput =
  document.getElementById(
    "moderatorChatInput"
  );

const moderatorChatButton =
  document.getElementById(
    "moderatorChatButton"
  );


/* MODALS */

const banModal =
  document.getElementById(
    "banModal"
  );

const banTargetName =
  document.getElementById(
    "banTargetName"
  );

const banAmount =
  document.getElementById(
    "banAmount"
  );

const banUnit =
  document.getElementById(
    "banUnit"
  );

const banPermanent =
  document.getElementById(
    "banPermanent"
  );

const banCancel =
  document.getElementById(
    "banCancel"
  );

const banConfirm =
  document.getElementById(
    "banConfirm"
  );


const moderatorModal =
  document.getElementById(
    "moderatorModal"
  );

const moderatorTargetName =
  document.getElementById(
    "moderatorTargetName"
  );

const newModeratorPin =
  document.getElementById(
    "newModeratorPin"
  );

const moderatorAmount =
  document.getElementById(
    "moderatorAmount"
  );

const moderatorUnit =
  document.getElementById(
    "moderatorUnit"
  );

const moderatorPermanent =
  document.getElementById(
    "moderatorPermanent"
  );

const moderatorCancel =
  document.getElementById(
    "moderatorCancel"
  );

const moderatorConfirm =
  document.getElementById(
    "moderatorConfirm"
  );


function getModeratorId() {

  let id =
    localStorage.getItem(
      "blueberryModeratorId"
    );

  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "blueberryModeratorId",
      id
    );
  }

  return id;
}


function connectModerator() {

  return new Promise(
    (resolve, reject) => {

      ws =
        new WebSocket(
          socketUrl
        );

      let finished = false;

      ws.addEventListener(
        "open",
        () => {

          ws.send(
            JSON.stringify({
              type:
                "moderatorAuth",
              id:
                getModeratorId(),
              name:
                moderatorName,
              pin:
                moderatorPinInput.value
            })
          );
        }
      );


      ws.addEventListener(
        "message",
        event => {

          let message;

          try {
            message =
              JSON.parse(
                event.data
              );
          }

          catch {
            return;
          }

          if (
            message.type ===
            "moderatorAuthSuccess"
          ) {

            moderatorId =
              message.userId;

            moderatorLevel =
              message.level;

            rooms =
              message.rooms ||
              [];

            bans =
              message.bans ||
              [];

            moderatorAccess =
              message.moderatorAccess ||
              [];

            logs =
              message.logs ||
              [];

            if (!finished) {

              finished = true;
              resolve();
            }
          }

          handleMessage(
            message
          );
        }
      );


      ws.addEventListener(
        "error",
        () => {

          if (!finished) {

            finished = true;

            reject(
              new Error(
                "Could not connect."
              )
            );
          }
        }
      );


      ws.addEventListener(
        "close",
        () => {

          if (!finished) {

            finished = true;

            reject(
              new Error(
                "Connection closed."
              )
            );
          }
        }
      );

    }
  );
}


function handleMessage(message) {

  switch (message.type) {

    case "moderatorAuthSuccess":

      showDashboard();

      renderAll();

      break;


    case "moderatorData":

      rooms =
        message.rooms ||
        [];

      bans =
        message.bans ||
        [];

      moderatorAccess =
        message.moderatorAccess ||
        [];

      logs =
        message.logs ||
        [];

      renderAll();

      break;


    case "roomList":

      rooms =
        message.rooms ||
        [];

      renderRooms();

      break;


    case "moderatorRoomCreated":

      renderAll();

      break;


    case "moderatorRoomJoined":

      startWatchingRoom(
        message
      );

      break;


    case "userJoined":

      if (
        watchingRoom &&
        message.user
      ) {

        watchParticipants.set(
          message.user.id,
          message.user
        );

        createWatchPeer(
          message.user.id,
          true
        );

        renderWatchThumbs();
      }

      break;


    case "userLeft":

      removeWatchUser(
        message.userId
      );

      break;


    case "userNameChanged":

      if (
        watchParticipants.has(
          message.userId
        )
      ) {

        const user =
          watchParticipants.get(
            message.userId
          );

        user.name =
          message.name;

        renderWatchThumbs();
      }

      break;


    case "signal":

      handleWatchSignal(
        message
      );

      break;


    case "chatMessage":

      addWatchChatMessage(
        message.message
      );

      break;


    case "moderatorChatMessage":

      addWatchChatMessage(
        message.message,
        true
      );

      break;


    case "moderatorAccessCreated":

      alert(
        `Moderator access created.\n\nPIN: ${message.access.pin}\nDuration: ${message.access.durationText}`
      );

      renderAll();

      break;


    case "moderatorAccessGranted":

      alert(
        `You have been granted moderator access.\n\nPIN: ${message.pin}\nDuration: ${message.durationText}`
      );

      break;


    case "moderatorAccessRevoked":

      alert(
        message.message ||
        "Moderator access revoked."
      );

      location.reload();

      break;


    case "moderatorRoomClosed":

      stopWatching();

      break;


    case "error":

      alert(
        message.message ||
        "Something went wrong."
      );

      break;
  }
}


/* DASHBOARD */

function showDashboard() {

  loginScreen.style.display =
    "none";

  dashboard.style.display =
    "block";

  headerSub.textContent =
    `${moderatorName} • ${
      moderatorLevel === "master"
        ? "Master Moderator"
        : "Delegated Moderator"
    }`;
}


function renderAll() {

  renderRooms();
  renderParticipants();
  renderBans();
  renderModeratorAccess();
  renderLogs();
}


/* ROOMS */

function renderRooms() {

  roomsList.innerHTML =
    "";

  if (!rooms.length) {

    roomsList.innerHTML =
      "<div class='small'>No open rooms.</div>";

    return;
  }

  for (
    const room of rooms
  ) {

    const element =
      document.createElement(
        "div"
      );

    element.className =
      "room";

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "roomName";

    title.textContent =
      room.name;

    const code =
      document.createElement(
        "div"
      );

    code.className =
      "roomCode";

    code.textContent =
      room.code;

    const count =
      document.createElement(
        "div"
      );

    count.className =
      "small";

    count.textContent =
      `${room.participants.length} participant${
        room.participants.length === 1
          ? ""
          : "s"
      }`;

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "roomActions";

    const watchButton =
      document.createElement(
        "button"
      );

    watchButton.textContent =
      "👁 Join Anonymously";

    watchButton.addEventListener(
      "click",
      () => {

        joinRoomAnonymously(
          room.code
        );
      }
    );

    actions.appendChild(
      watchButton
    );

    element.appendChild(title);
    element.appendChild(code);
    element.appendChild(count);
    element.appendChild(actions);

    roomsList.appendChild(
      element
    );
  }
}


/* PARTICIPANTS */

function renderParticipants() {

  participantsList.innerHTML =
    "";

  const allUsers = [];

  for (
    const room of rooms
  ) {

    for (
      const participant of
      room.participants
    ) {

      allUsers.push({
        ...participant,
        roomCode:
          room.code,
        roomName:
          room.name
      });
    }
  }

  if (!allUsers.length) {

    participantsList.innerHTML =
      "<div class='small'>No participants.</div>";

    return;
  }

  for (
    const user of
    allUsers
  ) {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "participant";

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "participantName";

    name.textContent =
      user.name;

    const room =
      document.createElement(
        "div"
      );

    room.className =
      "small";

    room.textContent =
      `${user.roomName} (${user.roomCode})`;

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "participantActions";


    const watchButton =
      document.createElement(
        "button"
      );

    watchButton.textContent =
      "👁 Watch";

    watchButton.addEventListener(
      "click",
      () => {

        joinRoomAnonymously(
          user.roomCode
        );
      }
    );

    actions.appendChild(
      watchButton
    );


    const kickButton =
      document.createElement(
        "button"
      );

    kickButton.textContent =
      "Kick";

    kickButton.className =
      "secondary";

    kickButton.addEventListener(
      "click",
      () => {

        kickUser(
          user.id
        );
      }
    );

    actions.appendChild(
      kickButton
    );


    const banButton =
      document.createElement(
        "button"
      );

    banButton.textContent =
      "Ban";

    banButton.className =
      "danger";

    banButton.addEventListener(
      "click",
      () => {

        openBanModal(
          user
        );
      }
    );

    actions.appendChild(
      banButton
    );


    if (
      moderatorLevel ===
      "master"
    ) {

      const modButton =
        document.createElement(
          "button"
        );

      modButton.textContent =
        "Give Moderator";

      modButton.className =
        "green";

      modButton.addEventListener(
        "click",
        () => {

          openModeratorModal(
            user
          );
        }
      );

      actions.appendChild(
        modButton
      );
    }


    item.appendChild(
      name
    );

    item.appendChild(
      room
    );

    item.appendChild(
      actions
    );

    participantsList.appendChild(
      item
    );
  }
}

        "div"

        "div"
      );

    name.style.fontWeight =

    name.textContent =
      access.name;

    const details =
      document.createElement(

      );

    details.className =

/* KICK */

    JSON.stringify({

banCancel.addEventListener(

moderatorCancel.addEventListener(

);

  }

/* WATCH ROOM */

function joinRoomAnonymously(
  code
) {

  if (
    !ws ||
    ws.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  stopWatching();

  ws.send(
    JSON.stringify({
      type:
        "moderatorJoinRoom",
      code
    })
  );
}


function startWatchingRoom(
  message
) {

  watchingRoom =
    message.room;

  watchParticipants.clear();
  watchPeers.clear();
  watchStreams.clear();
  watchPendingCandidates.clear();
  watchThumbs.clear();

  watchThumbs.innerHTML =
    "";

  watchChatMessages.innerHTML =
    "";

  for (
    const user of
    message.users || []
  ) {

    watchParticipants.set(
      user.id,
      user
    );
  }

  for (
    const messageItem of
    message.messages || []
  ) {

    addWatchChatMessage(
      messageItem
    );
  }

  watchArea.style.display =
    "block";

  /*
   * Create an incoming WebRTC
   * connection to EVERY user.
   *
   * We pass false so the moderator
   * does NOT publish any media.
   */
  for (
    const user of
    message.users || []
  ) {

    createWatchPeer(
      user.id,
      false
    );
  }

  renderWatchThumbs();

  watchLargeVideo.srcObject =
    null;

  watchLargeName.textContent =
    "Select a participant";

  watchArea.scrollIntoView({
    behavior: "smooth"
  });
}


function createWatchPeer(
  userId,
  createOffer
) {

  if (
    watchPeers.has(userId)
  ) {

    return watchPeers.get(
      userId
    );
  }

  const peer =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  watchPeers.set(
    userId,
    peer
  );

  /*
   * IMPORTANT:
   *
   * There is NO addTrack() here.
   *
   * The anonymous moderator therefore
   * sends no microphone or camera.
   */


  peer.addEventListener(
    "icecandidate",
    event => {

      if (!event.candidate) {
        return;
      }

      sendWatchSignal(
        userId,
        {
          type:
            "candidate",
          candidate:
            event.candidate
        }
      );
    }
  );


  peer.addEventListener(
    "track",
    event => {

      let stream =
        watchStreams.get(
          userId
        );

      if (!stream) {

        stream =
          new MediaStream();

        watchStreams.set(
          userId,
          stream
        );
      }

      if (
        !stream
          .getTracks()
          .some(
            track =>
              track.id ===
              event.track.id
          )
      ) {

        stream.addTrack(
          event.track
        );
      }

      updateWatchStream(
        userId,
        stream
      );
    }
  );


  peer.addEventListener(
    "connectionstatechange",
    () => {

      if (
        peer.connectionState ===
          "failed" ||
        peer.connectionState ===
          "closed"
      ) {

        watchPeers.delete(
          userId
        );
      }
    }
  );


  if (createOffer) {

    peer.createOffer()
      .then(
        offer =>
          peer.setLocalDescription(
            offer
          )
      )
      .then(
        () => {

          sendWatchSignal(
            userId,
            {
              type:
                "offer",
              offer:
                peer.localDescription
            }
          );
        }
      )
      .catch(
        console.error
      );
  }

  return peer;
}


function sendWatchSignal(
  target,
  data
) {

  if (
    !ws ||
    ws.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  ws.send(
    JSON.stringify({
      type:
        "signal",
      target,
      data
    })
  );
}


async function handleWatchSignal(
  message
) {

  /*
   * Ignore WebRTC signals from people
   * who aren't in the room we're watching.
   */
  if (
    !watchParticipants.has(
      message.from
    )
  ) {
    return;
  }

  const userId =
    message.from;

  const data =
    message.data;

  let peer =
    watchPeers.get(
      userId
    );

  if (!peer) {

    peer =
      createWatchPeer(
        userId,
        false
      );
  }

  try {

    if (
      data.type ===
      "offer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      await flushWatchCandidates(
        userId,
        peer
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      sendWatchSignal(
        userId,
        {
          type:
            "answer",
          answer:
            peer.localDescription
        }
      );
    }


    else if (
      data.type ===
      "answer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      await flushWatchCandidates(
        userId,
        peer
      );
    }


    else if (
      data.type ===
      "candidate"
    ) {

      if (
        peer.remoteDescription
      ) {

        await peer.addIceCandidate(
          data.candidate
        );

      }

      else {

        if (
          !watchPendingCandidates.has(
            userId
          )
        ) {

          watchPendingCandidates.set(
            userId,
            []
          );
        }

        watchPendingCandidates
          .get(userId)
          .push(
            data.candidate
          );
      }
    }

  }

  catch (error) {

    console.error(
      "Moderator WebRTC error:",
      error
    );
  }
}


async function flushWatchCandidates(
  userId,
  peer
) {

  const candidates =
    watchPendingCandidates.get(
      userId
    );

  if (!candidates) {
    return;
  }

  watchPendingCandidates.delete(
    userId
  );

  for (
    const candidate of
    candidates
  ) {

    try {

      await peer.addIceCandidate(
        candidate
      );

    }

    catch (error) {

      console.error(error);
    }
  }
}


/* WATCH VIDEO */

function updateWatchStream(
  userId,
  stream
) {

  let thumb =
    watchThumbs.get(
      userId
    );

  if (!thumb) {

    thumb =
      createWatchThumb(
        userId
      );
  }

  const video =
    thumb.querySelector(
      "video"
    );

  video.srcObject =
    stream;

  video.play()
    .catch(() => {});

  /*
   * Select first received video
   * automatically.
   */
  if (
    !selectedWatchUser
  ) {

    selectWatchUser(
      userId
    );
  }
}


function createWatchThumb(
  userId
) {

  const thumb =
    document.createElement(
      "div"
    );

  thumb.className =
    "watchThumb";

  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "watchThumbName";

  name.textContent =
    watchParticipants.get(
      userId
    )?.name ||
    "User";

  thumb.appendChild(
    video
  );

  thumb.appendChild(
    name
  );

  thumb.addEventListener(
    "click",
    () => {

      selectWatchUser(
        userId
      );
    }
  );

  watchThumbs.appendChild(
    thumb
  );

  watchThumbs.set(
    userId,
    thumb
  );

  return thumb;
}


function renderWatchThumbs() {

  for (
    const [
      userId,
      user
    ] of watchParticipants
  ) {

    const thumb =
      watchThumbs.get(
        userId
      ) ||
      createWatchThumb(
        userId
      );

    thumb.querySelector(
      ".watchThumbName"
    ).textContent =
      user.name;

    thumb.style.display =
      userId ===
      selectedWatchUser
        ? "none"
        : "";
  }
}


function selectWatchUser(
  userId
) {

  const user =
    watchParticipants.get(
      userId
    );

  const stream =
    watchStreams.get(
      userId
    );

  if (!user || !stream) {
    return;
  }

  selectedWatchUser =
    userId;

  watchLargeVideo.srcObject =
    stream;

  watchLargeVideo.muted =
    false;

  watchLargeName.textContent =
    user.name;

  renderWatchThumbs();
}


function removeWatchUser(
  userId
) {

  watchParticipants.delete(
    userId
  );

  watchStreams.delete(
    userId
  );

  watchPendingCandidates.delete(
    userId
  );

  const peer =
    watchPeers.get(
      userId
    );

  if (peer) {

    try {
      peer.close();
    }

    catch {}

    watchPeers.delete(
      userId
    );
  }

  const thumb =
    watchThumbs.get(
      userId
    );

  if (thumb) {

    thumb.remove();

    watchThumbs.delete(
      userId
    );
  }

  if (
    selectedWatchUser ===
    userId
  ) {

    selectedWatchUser =
      null;

    watchLargeVideo.srcObject =
      null;

    watchLargeName.textContent =
      "Select a participant";

    for (
      const [
        id
      ] of watchStreams
    ) {

      selectWatchUser(
        id
      );

      break;
    }
  }
}


function stopWatching() {

  for (
    const peer of
    watchPeers.values()
  ) {

    try {
      peer.close();
    }

    catch {}
  }

  watchPeers.clear();
  watchStreams.clear();
  watchParticipants.clear();
  watchPendingCandidates.clear();
  watchThumbs.clear();

  watchThumbs.innerHTML =
    "";

  watchLargeVideo.srcObject =
    null;

  watchLargeName.textContent =
    "Select a participant";

  selectedWatchUser =
    null;

  watchingRoom =
    null;

  watchArea.style.display =
    "none";
}


/* WATCH CHAT */

function addWatchChatMessage(
  message,
  moderatorMessage = false
) {

  if (!message) {
    return;
  }

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "chatMessage";

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "chatName";

  name.textContent =
    moderatorMessage
      ? `${message.name} (Moderator)`
      : message.name ||
        "User";

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "chatBubble";

  bubble.textContent =
    message.message ||
    "";

  item.appendChild(
    name
  );

  item.appendChild(
    bubble
  );

  watchChatMessages.appendChild(
    item
  );

  watchChatMessages.scrollTop =
    watchChatMessages.scrollHeight;
}


function sendModeratorChat() {

  const text =
    moderatorChatInput.value.trim();

  if (!text) {
    return;
  }

  if (
    !watchingRoom ||
    !ws ||
    ws.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  /*
   * Moderator messages are kept
   * moderator-only in this version.
   */
  ws.send(
    JSON.stringify({
      type:
        "moderatorChat",
      message:
        text
    })
  );

  /*
   * Show our own message immediately.
   */
  addWatchChatMessage(
    {
      name:
        moderatorName,
      message:
        text
    },
    true
  );

  moderatorChatInput.value =
    "";

  moderatorChatInput.focus();
}


/* FULLSCREEN WATCH VIDEO */

watchLargeBox.addEventListener(
  "click",
  () => {

    if (
      document.fullscreenElement
    ) {

      document.exitFullscreen()
        .catch(() => {});

    }

    else {

      watchLargeBox
        .requestFullscreen()
        .catch(() => {});
    }
  }
);


moderatorChatButton.addEventListener(
  "click",
  sendModeratorChat
);


moderatorChatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendModeratorChat();
    }
  }
);


/* LOGIN */

loginButton.addEventListener(
  "click",
  async () => {

    const name =
      moderatorNameInput.value.trim();

    const pin =
      moderatorPinInput.value.trim();

    if (!name) {

      loginStatus.textContent =
        "Enter a moderator name.";

      return;
    }

    if (!pin) {

      loginStatus.textContent =
        "Enter the moderator PIN.";

      return;
    }

    moderatorName =
      name;

    loginButton.disabled =
      true;

    loginStatus.textContent =
      "Connecting...";

    try {

      await connectModerator();

      loginStatus.textContent =
        "";

    }

    catch (error) {

      console.error(error);

      loginStatus.textContent =
        error.message;

      loginButton.disabled =
        false;
    }
  }
);


/* LOGOUT */

logoutButton.addEventListener(
  "click",
  () => {

    stopWatching();

    if (ws) {

      try {
        ws.close();
      }

      catch {}
    }

    location.reload();
  }
);


/* ENTER KEY LOGIN */

moderatorPinInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      loginButton.click();
    }
  }
);
</script>
