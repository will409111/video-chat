<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

#joinScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.joinBox {
  width: 100%;
  max-width: 480px;
  background: #1c1c1c;
  padding: 30px;
  border-radius: 20px;
}

.joinBox h1 {
  margin-top: 0;
}

.joinBox input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #111;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  outline: none;
}

.joinBox button {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

.joinBox button:hover {
  background: #1d4ed8;
}

#joinStatus {
  min-height: 20px;
  color: #aaa;
}

#app {
  display: none;
  min-height: 100vh;
  padding: 15px;
}

.topBar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.roomName {
  font-size: 20px;
  font-weight: bold;
}

.roomCode {
  color: #aaa;
  font-size: 14px;
  margin-top: 3px;
}

#leaveButton {
  background: #dc2626;
  border: 0;
  border-radius: 10px;
  padding: 11px 18px;
  color: white;
  font-weight: bold;
}

#leaveButton:hover {
  background: #b91c1c;
}

#largeArea {
  width: 100%;
  height: calc(100vh - 165px);
  min-height: 350px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#largeContainer {
  position: relative;
  width: min(1000px, 100%);
  height: 100%;
  background: black;
  border: 3px solid #333;
  border-radius: 18px;
  overflow: hidden;
  transition: .2s;
}

#largeContainer.speaking {
  border-color: #22c55e;
  box-shadow:
    0 0 18px rgba(34,197,94,.7);
}

#largeVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  cursor: pointer;
}

#largeName {
  position: absolute;
  left: 12px;
  bottom: 12px;
  padding: 7px 10px;
  background: rgba(0,0,0,.7);
  border-radius: 8px;
  pointer-events: none;
}

#thumbnails {
  width: 100%;
  min-height: 100px;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 0;
}

.videoTile {
  position: relative;
  flex: 0 0 140px;
  width: 140px;
  height: 90px;
  background: black;
  border: 3px solid #333;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: .2s;
}

.videoTile.speaking {
  border-color: #22c55e;
  box-shadow:
    0 0 15px rgba(34,197,94,.7);
}

.videoTile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}

.videoTileName {
  position: absolute;
  left: 5px;
  right: 5px;
  bottom: 5px;
  padding: 4px 6px;
  background: rgba(0,0,0,.7);
  border-radius: 5px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 700px) {
  #largeArea {
    height: calc(100vh - 210px);
  }

  .videoTile {
    flex-basis: 115px;
    width: 115px;
    height: 75px;
  }
}
</style>
</head>

<body>

<div id="joinScreen">

  <div class="joinBox">

    <h1>Video Chat</h1>

    <input
      id="nameInput"
      type="text"
      placeholder="Your name"
      maxlength="30"
    >

    <input
      id="roomNameInput"
      type="text"
      placeholder="Room name"
      maxlength="40"
    >

    <input
      id="roomCodeInput"
      type="text"
      placeholder="Room code"
      maxlength="12"
    >

    <button id="createButton">
      Create Room
    </button>

    <button id="joinButton">
      Join Room
    </button>

    <p id="joinStatus"></p>

  </div>

</div>


<div id="app">

  <div class="topBar">

    <div>
      <div
        id="roomName"
        class="roomName"
      ></div>

      <div
        id="roomCode"
        class="roomCode"
      ></div>
    </div>

    <button id="leaveButton">
      Leave
    </button>

  </div>


  <div id="largeArea">

    <div id="largeContainer">

      <video
        id="largeVideo"
        autoplay
        playsinline
        muted
      ></video>

      <div id="largeName"></div>

    </div>

  </div>


  <div id="thumbnails"></div>

</div>


<script>

const WS_URL =
  (location.protocol === "https:"
    ? "wss://"
    : "ws://") +
  location.host +
  "/ws";


let socket = null;
let localStream = null;
let myId = null;
let currentRoom = null;
let selectedId = null;

let joining = false;
let leaving = false;


/*
 * One entry per participant.
 */

const participants = new Map();

/*
 * One RTCPeerConnection per participant.
 */

const peers = new Map();

/*
 * One remote MediaStream per participant.
 */

const remoteStreams = new Map();

/*
 * ICE candidates waiting for remote description.
 */

const pendingCandidates = new Map();

/*
 * One video tile per participant.
 */

const tiles = new Map();


/*
 * Persistent user ID.
 */

myId =
  localStorage.getItem(
    "videoChatUserId"
  );

if (!myId) {

  myId =
    crypto.randomUUID();

  localStorage.setItem(
    "videoChatUserId",
    myId
  );
}


/*
 * Elements.
 */

const joinScreen =
  document.getElementById(
    "joinScreen"
  );

const app =
  document.getElementById(
    "app"
  );

const nameInput =
  document.getElementById(
    "nameInput"
  );

const roomNameInput =
  document.getElementById(
    "roomNameInput"
  );

const roomCodeInput =
  document.getElementById(
    "roomCodeInput"
  );

const createButton =
  document.getElementById(
    "createButton"
  );

const joinButton =
  document.getElementById(
    "joinButton"
  );

const leaveButton =
  document.getElementById(
    "leaveButton"
  );

const joinStatus =
  document.getElementById(
    "joinStatus"
  );

const roomName =
  document.getElementById(
    "roomName"
  );

const roomCode =
  document.getElementById(
    "roomCode"
  );

const largeVideo =
  document.getElementById(
    "largeVideo"
  );

const largeName =
  document.getElementById(
    "largeName"
  );

const largeContainer =
  document.getElementById(
    "largeContainer"
  );

const thumbnails =
  document.getElementById(
    "thumbnails"
  );


/*
 * Restore saved name.
 */

const savedName =
  localStorage.getItem(
    "videoChatName"
  );

if (savedName) {
  nameInput.value =
    savedName;
}


/*
 * Get current name.
 */

function getName() {

  const value =
    nameInput.value
      .trim()
      .replace(/\s+/g, " ")
      .slice(0, 30);

  return value || "Guest";
}


/*
 * Connect WebSocket.
 */

function connectSocket() {

  return new Promise(
    (resolve, reject) => {

      socket =
        new WebSocket(
          WS_URL
        );

      let settled =
        false;


      socket.onopen =
        () => {

          socket.send(
            JSON.stringify({
              type: "register",
              id: myId,
              name: getName(),
              role: "user"
            })
          );

          if (!settled) {
            settled = true;
            resolve();
          }
        };


      socket.onerror =
        error => {

          if (!settled) {
            settled = true;
            reject(error);
          }
        };


      socket.onclose =
        () => {

          if (!leaving) {
            console.log(
              "WebSocket closed"
            );
          }
        };


      socket.onmessage =
        event => {

          let message;

          try {
            message =
              JSON.parse(
                event.data
              );
          }

          catch {
            return;
          }

          handleMessage(
            message
          );
        };
    }
  );
}


/*
 * Camera/microphone.
 */

async function getCamera() {

  if (localStream) {
    return localStream;
  }

  localStream =
    await navigator.mediaDevices
      .getUserMedia({
        video: true,
        audio: true
      });

  return localStream;
}


/*
 * CREATE ROOM
 */

createButton.onclick =
  async () => {

    if (joining) {
      return;
    }

    joining = true;

    const name =
      getName();

    localStorage.setItem(
      "videoChatName",
      name
    );

    joinStatus.textContent =
      "Starting camera...";

    try {

      await getCamera();

      joinStatus.textContent =
        "Connecting...";

      await connectSocket();

      const requestedCode =
        roomCodeInput.value
          .trim()
          .toUpperCase();

      socket.send(
        JSON.stringify({
          type: "createRoom",
          name:
            roomNameInput.value.trim(),
          code:
            requestedCode
        })
      );

    }

    catch (error) {

      console.error(error);

      joinStatus.textContent =
        "Could not access camera or connect.";

      joining = false;

      stopLocalStream();
    }
  };


/*
 * JOIN ROOM
 */

joinButton.onclick =
  async () => {

    if (joining) {
      return;
    }

    const code =
      roomCodeInput.value
        .trim()
        .toUpperCase();

    if (!code) {

      joinStatus.textContent =
        "Enter a room code.";

      return;
    }

    joining = true;

    localStorage.setItem(
      "videoChatName",
      getName()
    );

    joinStatus.textContent =
      "Starting camera...";

    try {

      await getCamera();

      joinStatus.textContent =
        "Connecting...";

      await connectSocket();

      socket.send(
        JSON.stringify({
          type: "joinRoom",
          code: code
        })
      );

    }

    catch (error) {

      console.error(error);

      joinStatus.textContent =
        "Could not access camera or connect.";

      joining = false;

      stopLocalStream();
    }
  };


/*
 * Server messages.
 */

async function handleMessage(
  message
) {

  switch (
    message.type
  ) {

    case "roomJoined":

      await handleRoomJoined(
        message
      );

      break;


    case "userJoined":

      if (
        message.user &&
        message.user.id !== myId
      ) {

        addParticipant(
          message.user
        );

        createPeerIfNeeded(
          message.user.id
        );
      }

      break;


    case "userLeft":

      removeParticipant(
        message.userId
      );

      break;


    case "userNameChanged":

      updateParticipantName(
        message.userId,
        message.name
      );

      break;


    case "signal":

      await handleSignal(
        message.from,
        message.data
      );

      break;


    case "error":

      joinStatus.textContent =
        message.message ||
        "Something went wrong.";

      joining = false;

      break;


    case "kicked":

      alert(
        message.message ||
        "You were kicked."
      );

      await leaveRoom();

      break;


    case "banned":

      alert(
        message.message ||
        "You are banned."
      );

      await leaveRoom();

      break;
  }
}


/*
 * ROOM JOINED
 */

async function handleRoomJoined(
  message
) {

  /*
   * Completely destroy anything
   * left from an earlier room.
   */

  clearRoomState();

  currentRoom =
    message.room;

  roomName.textContent =
    message.room.name;

  roomCode.textContent =
    "Code: " +
    message.room.code;


  /*
   * Add ourselves exactly once.
   */

  participants.set(
    myId,
    {
      id: myId,
      name:
        message.self.name,
      local: true
    }
  );


  /*
   * Add existing users.
   */

  for (
    const user
    of message.users || []
  ) {

    if (
      !user ||
      !user.id ||
      user.id === myId
    ) {
      continue;
    }

    participants.set(
      user.id,
      user
    );
  }


  joinScreen.style.display =
    "none";

  app.style.display =
    "block";

  joining = false;


  /*
   * Create our ONE local tile.
   */

  addLocalParticipant();


  /*
   * Connect to each existing
   * participant exactly once.
   */

  for (
    const user
    of participants.values()
  ) {

    if (
      user.id === myId
    ) {
      continue;
    }

    createPeerIfNeeded(
      user.id
    );
  }
}


/*
 * Add local participant.
 */

function addLocalParticipant() {

  if (!localStream) {
    return;
  }

  /*
   * Never make another tile
   * for our own ID.
   */

  if (tiles.has(myId)) {

    const tile =
      tiles.get(myId);

    const video =
      tile.querySelector(
        "video"
      );

    video.srcObject =
      localStream;

    return;
  }

  createParticipantTile(
    myId,
    getName(),
    localStream,
    true
  );

  selectParticipant(
    myId
  );
}


/*
 * Add participant.
 */

function addParticipant(
  user
) {

  if (
    !user ||
    !user.id ||
    user.id === myId
  ) {
    return;
  }

  /*
   * Update existing participant
   * instead of making another one.
   */

  if (
    participants.has(
      user.id
    )
  ) {

    participants.set(
      user.id,
      {
        ...participants.get(
          user.id
        ),
        ...user
      }
    );

    return;
  }

  participants.set(
    user.id,
    user
  );
}


/*
 * Create peer only once.
 */

function createPeerIfNeeded(
  remoteId
) {

  if (
    !remoteId ||
    remoteId === myId
  ) {
    return;
  }

  if (
    peers.has(remoteId)
  ) {
    return;
  }

  const initiator =
    myId < remoteId;

  createPeer(
    remoteId,
    initiator
  );
}


/*
 * Create WebRTC peer.
 */

function createPeer(
  remoteId,
  initiator
) {

  if (
    peers.has(remoteId)
  ) {
    return peers.get(
      remoteId
    );
  }

  const peer =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });


  peers.set(
    remoteId,
    peer
  );


  pendingCandidates.set(
    remoteId,
    []
  );


  /*
   * Add our camera/microphone.
   */

  if (localStream) {

    for (
      const track
      of localStream.getTracks()
    ) {

      peer.addTrack(
        track,
        localStream
      );
    }
  }


  /*
   * ICE.
   */

  peer.onicecandidate =
    event => {

      if (
        !event.candidate ||
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "signal",
          target: remoteId,

          data: {
            type: "candidate",
            candidate:
              event.candidate
          }
        })
      );
    };


  /*
   * REMOTE TRACK.
   *
   * IMPORTANT:
   * Both audio and video tracks are
   * placed into ONE MediaStream.
   */

  peer.ontrack =
    event => {

      if (!event.track) {
        return;
      }

      let stream =
        remoteStreams.get(
          remoteId
        );

      if (!stream) {

        stream =
          new MediaStream();

        remoteStreams.set(
          remoteId,
          stream
        );
      }


      /*
       * Don't add the same track twice.
       */

      const alreadyAdded =
        stream.getTracks()
          .some(
            track =>
              track.id ===
              event.track.id
          );

      if (!alreadyAdded) {

        stream.addTrack(
          event.track
        );
      }


      /*
       * Create/update ONE tile.
       */

      upsertRemoteTile(
        remoteId,
        stream
      );
    };


  /*
   * Connection state.
   */

  peer.onconnectionstatechange =
    () => {

      if (
        peer.connectionState ===
          "failed" ||
        peer.connectionState ===
          "closed"
      ) {

        removePeer(
          remoteId
        );
      }
    };


  /*
   * Negotiation.
   */

  if (initiator) {

    peer.createOffer()
      .then(
        offer =>
          peer.setLocalDescription(
            offer
          )
      )
      .then(
        () => {

          if (
            !socket ||
            socket.readyState !==
              WebSocket.OPEN
          ) {
            return;
          }

          socket.send(
            JSON.stringify({
              type: "signal",
              target: remoteId,

              data: {
                type: "offer",
                offer:
                  peer.localDescription
              }
            })
          );
        }
      )
      .catch(
        console.error
      );
  }


  return peer;
}


/*
 * SIGNALING.
 */

async function handleSignal(
  remoteId,
  data
) {

  if (
    !remoteId ||
    remoteId === myId
  ) {
    return;
  }

  let peer =
    peers.get(
      remoteId
    );

  if (!peer) {

    peer =
      createPeer(
        remoteId,
        false
      );
  }


  try {

    if (
      data.type ===
      "offer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      await flushCandidates(
        remoteId
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      socket.send(
        JSON.stringify({
          type: "signal",
          target: remoteId,

          data: {
            type: "answer",
            answer:
              peer.localDescription
          }
        })
      );
    }


    else if (
      data.type ===
      "answer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      await flushCandidates(
        remoteId
      );
    }


    else if (
      data.type ===
      "candidate"
    ) {

      if (
        peer.remoteDescription
      ) {

        await peer.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

      else {

        if (
          !pendingCandidates.has(
            remoteId
          )
        ) {

          pendingCandidates.set(
            remoteId,
            []
          );
        }

        pendingCandidates
          .get(remoteId)
          .push(
            data.candidate
          );
      }
    }

  }

  catch (error) {

    console.error(
      "WebRTC error:",
      error
    );
  }
}


/*
 * Flush queued ICE.
 */

async function flushCandidates(
  remoteId
) {

  const peer =
    peers.get(
      remoteId
    );

  if (
    !peer ||
    !peer.remoteDescription
  ) {
    return;
  }

  const list =
    pendingCandidates.get(
      remoteId
    ) || [];

  pendingCandidates.set(
    remoteId,
    []
  );

  for (
    const candidate
    of list
  ) {

    try {

      await peer.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }

    catch (error) {

      console.error(
        "ICE error:",
        error
      );
    }
  }
}


/*
 * Create/update ONE remote tile.
 */

function upsertRemoteTile(
  userId,
  stream
) {

  if (
    userId === myId
  ) {
    return;
  }

  remoteStreams.set(
    userId,
    stream
  );


  const existing =
    tiles.get(
      userId
    );


  if (existing) {

    const video =
      existing.querySelector(
        "video"
      );

    if (
      video.srcObject !==
      stream
    ) {

      video.srcObject =
        stream;
    }

    return;
  }


  const participant =
    participants.get(
      userId
    );

  createParticipantTile(
    userId,
    participant?.name ||
      "Guest",
    stream,
    false
  );


  /*
   * If we're currently showing
   * ourselves, automatically switch
   * to the first remote participant.
   */

  if (
    selectedId === myId
  ) {

    selectParticipant(
      userId
    );
  }
}


/*
 * Create exactly ONE tile.
 */

function createParticipantTile(
  userId,
  name,
  stream,
  local
) {

  /*
   * Absolute duplicate protection.
   */

  if (
    tiles.has(userId)
  ) {

    const oldTile =
      tiles.get(userId);

    const video =
      oldTile.querySelector(
        "video"
      );

    if (
      video.srcObject !==
      stream
    ) {

      video.srcObject =
        stream;
    }

    return oldTile;
  }


  const tile =
    document.createElement(
      "div"
    );

  tile.className =
    "videoTile";

  tile.dataset.userId =
    userId;


  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  video.muted =
    local;

  video.srcObject =
    stream;


  const label =
    document.createElement(
      "div"
    );

  label.className =
    "videoTileName";

  label.textContent =
    local
      ? name + " (You)"
      : name;


  tile.appendChild(
    video
  );

  tile.appendChild(
    label
  );


  tile.onclick =
    () => {

      selectParticipant(
        userId
      );
    };


  thumbnails.appendChild(
    tile
  );


  tiles.set(
    userId,
    tile
  );


  return tile;
}


/*
 * Select large video.
 */

function selectParticipant(
  userId
) {

  let stream = null;

  if (
    userId === myId
  ) {

    stream =
      localStream;

  } else {

    stream =
      remoteStreams.get(
        userId
      );
  }


  if (!stream) {
    return;
  }


  selectedId =
    userId;


  largeVideo.srcObject =
    stream;


  const participant =
    participants.get(
      userId
    );


  largeName.textContent =
    userId === myId
      ? getName() + " (You)"
      : participant?.name ||
        "Guest";
}


/*
 * Update participant name.
 */

function updateParticipantName(
  userId,
  name
) {

  const participant =
    participants.get(
      userId
    );

  if (!participant) {
    return;
  }

  participant.name =
    name;


  const tile =
    tiles.get(
      userId
    );

  if (tile) {

    const label =
      tile.querySelector(
        ".videoTileName"
      );

    if (label) {

      label.textContent =
        userId === myId
          ? name + " (You)"
          : name;
    }
  }


  if (
    selectedId === userId
  ) {

    largeName.textContent =
      userId === myId
        ? name + " (You)"
        : name;
  }
}


/*
 * Remove participant.
 */

function removeParticipant(
  userId
) {

  if (
    userId === myId
  ) {
    return;
  }


  removePeer(
    userId
  );


  const tile =
    tiles.get(
      userId
    );

  if (tile) {

    tile.remove();

    tiles.delete(
      userId
    );
  }


  remoteStreams.delete(
    userId
  );

  participants.delete(
    userId
  );


  if (
    selectedId === userId
  ) {

    if (
      localStream
    ) {

      selectParticipant(
        myId
      );

    }

    else {

      largeVideo.srcObject =
        null;

      largeName.textContent =
        "";
    }
  }
}


/*
 * Remove peer.
 */

function removePeer(
  userId
) {

  const peer =
    peers.get(
      userId
    );

  if (peer) {

    try {
      peer.close();
    }

    catch {}
  }

  peers.delete(
    userId
  );

  pendingCandidates.delete(
    userId
  );

  remoteStreams.delete(
    userId
  );
}


/*
 * Completely clear current room.
 */

function clearRoomState() {

  /*
   * Close peers.
   */

  for (
    const peer
    of peers.values()
  ) {

    try {
      peer.close();
    }

    catch {}
  }

  peers.clear();


  pendingCandidates.clear();


  /*
   * Remove every tile.
   */

  for (
    const tile
    of tiles.values()
  ) {

    tile.remove();
  }

  tiles.clear();


  /*
   * Clear participant data.
   */

  participants.clear();

  remoteStreams.clear();


  largeVideo.srcObject =
    null;

  largeName.textContent =
    "";

  selectedId =
    null;
}


/*
 * Stop local camera.
 */

function stopLocalStream() {

  if (!localStream) {
    return;
  }

  for (
    const track
    of localStream.getTracks()
  ) {

    track.stop();
  }

  localStream =
    null;
}


/*
 * LEAVE.
 */

async function leaveRoom() {

  if (leaving) {
    return;
  }

  leaving = true;
  joining = false;


  /*
   * Tell server.
   */

  if (
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {

    try {

      socket.send(
        JSON.stringify({
          type:
            "leaveRoom"
        })
      );

    }

    catch {}
  }


  /*
   * Clear everything.
   */

  clearRoomState();


  stopLocalStream();


  /*
   * Close socket.
   */

  if (socket) {

    try {
      socket.close();
    }

    catch {}

    socket =
      null;
  }


  currentRoom =
    null;


  app.style.display =
    "none";

  joinScreen.style.display =
    "flex";

  joinStatus.textContent =
    "";


  leaving = false;
}


/*
 * Leave button.
 */

leaveButton.onclick =
  () => {

    leaveRoom();
  };


/*
 * Fullscreen.
 */

largeVideo.onclick =
  async () => {

    try {

      if (
        document.fullscreenElement
      ) {

        await document.exitFullscreen();

      }

      else {

        await largeContainer.requestFullscreen();

      }

    }

    catch (error) {

      console.error(
        "Fullscreen error:",
        error
      );
    }
  };


/*
 * Room code formatting.
 */

roomCodeInput.addEventListener(
  "input",
  () => {

    roomCodeInput.value =
      roomCodeInput.value
        .toUpperCase()
        .replace(
          /[^A-Z0-9_-]/g,
          ""
        )
        .slice(
          0,
          12
        );
  }
);


/*
 * Clean up when browser closes.
 */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      socket &&
      socket.readyState ===
        WebSocket.OPEN
    ) {

      try {

        socket.send(
          JSON.stringify({
            type:
              "leaveRoom"
          })
        );

      }

      catch {}
    }


    for (
      const peer
      of peers.values()
    ) {

      try {
        peer.close();
      }

      catch {}
    }


    stopLocalStream();
  }
);

</script>
