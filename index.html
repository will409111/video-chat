<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

#joinScreen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.joinBox {
  width: 100%;
  max-width: 500px;
  background: #1c1c1c;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

.joinBox h1 {
  margin-top: 0;
}

.joinBox input {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: 1px solid #444;
  border-radius: 10px;
  background: #111;
  color: white;
  outline: none;
}

.joinBox button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

.joinBox button:hover {
  background: #1d4ed8;
}

#app {
  display: none;
  min-height: 100vh;
  padding: 15px;
}

.topBar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.roomInfo {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.roomName {
  font-size: 20px;
  font-weight: bold;
}

.roomCode {
  color: #aaa;
  font-size: 14px;
}

#leaveButton {
  background: #dc2626;
  color: white;
  border: 0;
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: bold;
}

#leaveButton:hover {
  background: #b91c1c;
}

#mainVideoArea {
  width: 100%;
  height: calc(100vh - 170px);
  min-height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#largeVideoContainer {
  position: relative;
  width: min(900px, 100%);
  height: 100%;
  max-height: 700px;
  background: #000;
  border: 3px solid #333;
  border-radius: 18px;
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}

#largeVideoContainer.speaking {
  border-color: #22c55e;
  box-shadow: 0 0 18px rgba(34,197,94,.7);
}

#largeVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  cursor: pointer;
}

#largeName {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: rgba(0,0,0,.7);
  padding: 7px 11px;
  border-radius: 8px;
  font-size: 14px;
  pointer-events: none;
}

#thumbnails {
  width: 100%;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 2px;
  min-height: 110px;
}

.videoTile {
  position: relative;
  flex: 0 0 140px;
  width: 140px;
  height: 90px;
  border: 3px solid #333;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  transition: border-color .2s, box-shadow .2s;
  cursor: pointer;
}

.videoTile.speaking {
  border-color: #22c55e;
  box-shadow: 0 0 15px rgba(34,197,94,.7);
}

.videoTile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.videoTile .name {
  position: absolute;
  left: 5px;
  right: 5px;
  bottom: 5px;
  padding: 4px 6px;
  border-radius: 5px;
  background: rgba(0,0,0,.7);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hidden {
  display: none !important;
}

.emptyMessage {
  color: #777;
  text-align: center;
  width: 100%;
  padding: 30px;
}

@media (max-width: 700px) {
  #mainVideoArea {
    height: calc(100vh - 220px);
  }

  #largeVideoContainer {
    border-radius: 12px;
  }

  .videoTile {
    flex-basis: 115px;
    width: 115px;
    height: 75px;
  }
}
</style>
</head>

<body>

<div id="joinScreen">
  <div class="joinBox">
    <h1>Video Chat</h1>

    <input
      id="nameInput"
      type="text"
      placeholder="Your name"
      maxlength="30"
    >

    <input
      id="roomNameInput"
      type="text"
      placeholder="Room name"
      maxlength="40"
    >

    <input
      id="roomCodeInput"
      type="text"
      placeholder="Room code"
      maxlength="12"
    >

    <button id="createButton">
      Create Room
    </button>

    <button id="joinButton">
      Join Room
    </button>

    <p id="joinStatus"></p>
  </div>
</div>


<div id="app">

  <div class="topBar">
    <div class="roomInfo">
      <div class="roomName" id="roomName"></div>
      <div class="roomCode" id="roomCode"></div>
    </div>

    <button id="leaveButton">
      Leave
    </button>
  </div>

  <div id="mainVideoArea">
    <div id="largeVideoContainer">

      <video
        id="largeVideo"
        autoplay
        playsinline
        muted
      ></video>

      <div id="largeName"></div>

    </div>
  </div>

  <div id="thumbnails"></div>

</div>


<script>
const SERVER =
  (location.protocol === "https:" ? "wss://" : "ws://") +
  location.host +
  "/ws";


let socket = null;
let localStream = null;
let roomCode = null;
let myId = null;

let selectedUserId = null;

const peers = new Map();
const streams = new Map();
const users = new Map();
const tiles = new Map();

const pendingCandidates = new Map();
const speakingTimers = new Map();
const audioContexts = new Map();

let joining = false;
let leaving = false;


/* --------------------------------------------------
   STORAGE
-------------------------------------------------- */

myId =
  localStorage.getItem("videoChatUserId");

if (!myId) {
  myId =
    crypto.randomUUID();

  localStorage.setItem(
    "videoChatUserId",
    myId
  );
}

const savedName =
  localStorage.getItem("videoChatName");

if (savedName) {
  document.getElementById("nameInput").value =
    savedName;
}


/* --------------------------------------------------
   ELEMENTS
-------------------------------------------------- */

const joinScreen =
  document.getElementById("joinScreen");

const app =
  document.getElementById("app");

const nameInput =
  document.getElementById("nameInput");

const roomNameInput =
  document.getElementById("roomNameInput");

const roomCodeInput =
  document.getElementById("roomCodeInput");

const createButton =
  document.getElementById("createButton");

const joinButton =
  document.getElementById("joinButton");

const leaveButton =
  document.getElementById("leaveButton");

const joinStatus =
  document.getElementById("joinStatus");

const roomName =
  document.getElementById("roomName");

const roomCode =
  document.getElementById("roomCode");

const largeVideo =
  document.getElementById("largeVideo");

const largeName =
  document.getElementById("largeName");

const largeVideoContainer =
  document.getElementById(
    "largeVideoContainer"
  );

const thumbnails =
  document.getElementById("thumbnails");


/* --------------------------------------------------
   SOCKET
-------------------------------------------------- */

function connectSocket() {
  return new Promise((resolve, reject) => {

    socket = new WebSocket(SERVER);

    socket.onopen = () => {

      socket.send(JSON.stringify({
        type: "register",
        id: myId,
        name: getName(),
        role: "user"
      }));

      resolve();
    };

    socket.onerror = error => {
      reject(error);
    };

    socket.onclose = () => {

      if (!leaving) {
        console.log(
          "WebSocket disconnected"
        );
      }
    };

    socket.onmessage = event => {

      let message;

      try {
        message =
          JSON.parse(event.data);
      } catch {
        return;
      }

      handleMessage(message);
    };
  });
}


/* --------------------------------------------------
   NAME
-------------------------------------------------- */

function getName() {

  const name =
    nameInput.value
      .trim()
      .replace(/\s+/g, " ")
      .slice(0, 30);

  return name || "Guest";
}


/* --------------------------------------------------
   MESSAGES
-------------------------------------------------- */

async function handleMessage(message) {

  switch (message.type) {

    case "roomCreated":

      roomCodeInput.value =
        message.room.code;

      roomNameInput.value =
        message.room.name;

      joinStatus.textContent =
        "Room created. Joining...";

      await joinRoom(
        message.room.code
      );

      break;


    case "roomJoined":

      await roomJoined(message);

      break;


    case "userJoined":

      if (
        message.user &&
        message.user.id !== myId
      ) {

        addUser(
          message.user
        );

        maybeCreatePeer(
          message.user.id
        );
      }

      break;


    case "userLeft":

      removeUser(
        message.userId
      );

      break;


    case "userNameChanged":

      updateUserName(
        message.userId,
        message.name
      );

      break;


    case "signal":

      await handleSignal(
        message.from,
        message.data
      );

      break;


    case "kicked":

      alert(
        message.message ||
        "You were kicked."
      );

      leaveRoom(false);

      break;


    case "banned":

      alert(
        message.message ||
        "You are banned."
      );

      leaveRoom(false);

      break;


    case "error":

      joinStatus.textContent =
        message.message;

      joining = false;

      break;
  }
}


/* --------------------------------------------------
   CREATE ROOM
-------------------------------------------------- */

createButton.onclick = async () => {

  if (joining) {
    return;
  }

  const name =
    getName();

  const roomNameValue =
    roomNameInput.value.trim();

  const customCode =
    roomCodeInput.value.trim();

  localStorage.setItem(
    "videoChatName",
    name
  );

  joining = true;

  joinStatus.textContent =
    "Connecting...";

  try {

    await getCamera();

    await connectSocket();

    socket.send(JSON.stringify({
      type: "createRoom",
      name: roomNameValue,
      code: customCode
    }));

  } catch (error) {

    console.error(error);

    joinStatus.textContent =
      "Could not access camera or connect.";

    joining = false;
  }
};


/* --------------------------------------------------
   JOIN ROOM
-------------------------------------------------- */

joinButton.onclick = async () => {

  if (joining) {
    return;
  }

  const code =
    roomCodeInput.value
      .trim()
      .toUpperCase();

  if (!code) {

    joinStatus.textContent =
      "Enter a room code.";

    return;
  }

  localStorage.setItem(
    "videoChatName",
    getName()
  );

  joining = true;

  joinStatus.textContent =
    "Starting camera...";

  try {

    await getCamera();

    joinStatus.textContent =
      "Connecting...";

    await connectSocket();

    socket.send(JSON.stringify({
      type: "joinRoom",
      code: code
    }));

  } catch (error) {

    console.error(error);

    joinStatus.textContent =
      "Could not access camera or microphone.";

    joining = false;
  }
};


/* --------------------------------------------------
   CAMERA
-------------------------------------------------- */

async function getCamera() {

  if (localStream) {
    return localStream;
  }

  localStream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

  return localStream;
}


/* --------------------------------------------------
   ROOM JOINED
-------------------------------------------------- */

async function roomJoined(message) {

  /*
   * IMPORTANT:
   * Completely clear any old UI before
   * building the new room.
   */

  clearVideoUI();

  roomCode =
    message.room.code;

  roomName.textContent =
    message.room.name;

  roomCode.textContent =
    "Code: " + message.room.code;

  users.clear();

  selectedUserId = myId;

  /*
   * Add ourselves exactly once.
   */

  users.set(myId, {
    id: myId,
    name: message.self.name,
    local: true
  });

  /*
   * Add every other participant exactly once.
   */

  for (
    const user of message.users || []
  ) {

    if (
      !user ||
      !user.id ||
      user.id === myId
    ) {
      continue;
    }

    users.set(
      user.id,
      user
    );
  }

  joinScreen.style.display =
    "none";

  app.style.display =
    "block";

  joining = false;

  /*
   * Show our own camera.
   */

  addLocalVideo();

  /*
   * Create exactly one peer connection
   * for each other participant.
   */

  for (
    const user of users.values()
  ) {

    if (
      user.id === myId
    ) {
      continue;
    }

    maybeCreatePeer(
      user.id
    );
  }

  renderThumbnails();
}


/* --------------------------------------------------
   LOCAL VIDEO
-------------------------------------------------- */

function addLocalVideo() {

  if (!localStream) {
    return;
  }

  /*
   * Never create another local tile if one
   * already exists.
   */

  if (
    tiles.has(myId)
  ) {
    return;
  }

  const tile =
    createTile(
      myId,
      getName(),
      localStream,
      true
    );

  tiles.set(
    myId,
    tile
  );

  streams.set(
    myId,
    localStream
  );

  /*
   * Start with our own camera selected.
   */

  selectUser(
    myId
  );
}


/* --------------------------------------------------
   ADD USER
-------------------------------------------------- */

function addUser(user) {

  if (
    !user ||
    !user.id ||
    user.id === myId
  ) {
    return;
  }

  /*
   * If this user already exists, update
   * their information instead of creating
   * another tile.
   */

  if (
    users.has(user.id)
  ) {

    const existing =
      users.get(user.id);

    Object.assign(
      existing,
      user
    );

    return;
  }

  users.set(
    user.id,
    user
  );
}


/* --------------------------------------------------
   PEER CONNECTION
-------------------------------------------------- */

function maybeCreatePeer(remoteId) {

  if (
    !remoteId ||
    remoteId === myId
  ) {
    return;
  }

  /*
   * NEVER create two PeerConnections
   * for the same participant.
   */

  if (
    peers.has(remoteId)
  ) {
    return;
  }

  createPeer(
    remoteId,
    myId < remoteId
  );
}


function createPeer(
  remoteId,
  initiator
) {

  if (
    peers.has(remoteId)
  ) {
    return peers.get(remoteId);
  }

  const peer =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  peers.set(
    remoteId,
    peer
  );

  pendingCandidates.set(
    remoteId,
    []
  );

  /*
   * Add our camera/microphone exactly once.
   */

  if (localStream) {

    for (
      const track of
      localStream.getTracks()
    ) {

      peer.addTrack(
        track,
        localStream
      );
    }
  }

  peer.onicecandidate =
    event => {

      if (
        event.candidate &&
        socket &&
        socket.readyState === WebSocket.OPEN
      ) {

        socket.send(
          JSON.stringify({
            type: "signal",
            target: remoteId,
            data: {
              type: "candidate",
              candidate:
                event.candidate
            }
          })
        );
      }
    };


  peer.ontrack =
    event => {

      const stream =
        event.streams[0];

      if (!stream) {
        return;
      }

      /*
       * Ignore duplicate track events
       * for the same participant.
       */

      if (
        streams.get(remoteId) !== stream
      ) {

        streams.set(
          remoteId,
          stream
        );

        addRemoteVideo(
          remoteId,
          stream
        );
      }
    };


  peer.onconnectionstatechange =
    () => {

      if (
        peer.connectionState ===
          "failed" ||
        peer.connectionState ===
          "closed"
      ) {

        removePeer(
          remoteId
        );
      }
    };


  if (initiator) {

    peer.createOffer()
      .then(offer =>
        peer.setLocalDescription(
          offer
        )
      )
      .then(() => {

        socket.send(
          JSON.stringify({
            type: "signal",
            target: remoteId,
            data: {
              type: "offer",
              offer:
                peer.localDescription
            }
          })
        );

      })
      .catch(console.error);
  }

  return peer;
}


/* --------------------------------------------------
   SIGNALING
-------------------------------------------------- */

async function handleSignal(
  remoteId,
  data
) {

  if (
    !remoteId ||
    remoteId === myId
  ) {
    return;
  }

  let peer =
    peers.get(remoteId);

  if (!peer) {

    peer =
      createPeer(
        remoteId,
        false
      );
  }

  try {

    if (
      data.type === "offer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      await flushCandidates(
        remoteId
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      socket.send(
        JSON.stringify({
          type: "signal",
          target: remoteId,
          data: {
            type: "answer",
            answer:
              peer.localDescription
          }
        })
      );

    } else if (
      data.type === "answer"
    ) {

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      await flushCandidates(
        remoteId
      );

    } else if (
      data.type === "candidate"
    ) {

      /*
       * ICE candidates can arrive before the
       * remote description. Queue them.
       */

      if (
        peer.remoteDescription
      ) {

        await peer.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      } else {

        if (
          !pendingCandidates.has(
            remoteId
          )
        ) {

          pendingCandidates.set(
            remoteId,
            []
          );
        }

        pendingCandidates
          .get(remoteId)
          .push(
            data.candidate
          );
      }
    }

  } catch (error) {

    console.error(
      "WebRTC signaling error:",
      error
    );
  }
}


async function flushCandidates(
  remoteId
) {

  const peer =
    peers.get(remoteId);

  if (!peer) {
    return;
  }

  if (
    !peer.remoteDescription
  ) {
    return;
  }

  const candidates =
    pendingCandidates.get(
      remoteId
    ) || [];

  pendingCandidates.set(
    remoteId,
    []
  );

  for (
    const candidate of candidates
  ) {

    try {

      await peer.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.error(
        "ICE candidate error:",
        error
      );
    }
  }
}


/* --------------------------------------------------
   REMOTE VIDEO
-------------------------------------------------- */

function addRemoteVideo(
  userId,
  stream
) {

  if (
    userId === myId
  ) {
    return;
  }

  /*
   * If the participant already has a tile,
   * simply update the stream.
   */

  if (
    tiles.has(userId)
  ) {

    const tile =
      tiles.get(userId);

    const video =
      tile.querySelector(
        "video"
      );

    if (
      video.srcObject !== stream
    ) {

      video.srcObject =
        stream;
    }

    streams.set(
      userId,
      stream
    );

    return;
  }

  const user =
    users.get(userId);

  const name =
    user?.name ||
    "Guest";

  const tile =
    createTile(
      userId,
      name,
      stream,
      false
    );

  tiles.set(
    userId,
    tile
  );

  streams.set(
    userId,
    stream
  );

  if (
    !selectedUserId ||
    selectedUserId === myId
  ) {

    selectUser(
      userId
    );
  }
}


/* --------------------------------------------------
   CREATE TILE
-------------------------------------------------- */

function createTile(
  userId,
  name,
  stream,
  local
) {

  /*
   * Absolute duplicate protection.
   */

  const old =
    tiles.get(userId);

  if (old) {

    const video =
      old.querySelector(
        "video"
      );

    if (
      video &&
      video.srcObject !== stream
    ) {

      video.srcObject =
        stream;
    }

    return old;
  }

  const tile =
    document.createElement(
      "div"
    );

  tile.className =
    "videoTile";

  tile.dataset.userId =
    userId;

  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  video.muted =
    !!local;

  video.srcObject =
    stream;

  const nameLabel =
    document.createElement(
      "div"
    );

  nameLabel.className =
    "name";

  nameLabel.textContent =
    local
      ? name + " (You)"
      : name;

  tile.appendChild(
    video
  );

  tile.appendChild(
    nameLabel
  );

  tile.onclick =
    () => {

      selectUser(
        userId
      );
    };

  thumbnails.appendChild(
    tile
  );

  startSpeakingDetection(
    userId,
    stream,
    tile
  );

  return tile;
}


/* --------------------------------------------------
   SELECT VIDEO
-------------------------------------------------- */

function selectUser(userId) {

  if (!users.has(userId)) {
    return;
  }

  selectedUserId =
    userId;

  const stream =
    streams.get(userId);

  if (!stream) {
    return;
  }

  largeVideo.srcObject =
    stream;

  const user =
    users.get(userId);

  largeName.textContent =
    userId === myId
      ? getName() + " (You)"
      : user?.name || "Guest";

  /*
   * Update speaking border for selected video.
   */

  for (
    const [id, tile] of tiles
  ) {

    if (
      id === userId
    ) {

      if (
        tile.classList.contains(
          "speaking"
        )
      ) {

        largeVideoContainer.classList.add(
          "speaking"
        );

      }

    }
  }
}


/* --------------------------------------------------
   THUMBNAILS
-------------------------------------------------- */

function renderThumbnails() {

  /*
   * Remove every tile that no longer
   * belongs to a participant.
   */

  for (
    const [id, tile] of tiles
  ) {

    if (
      !users.has(id)
    ) {

      tile.remove();

      tiles.delete(id);
    }
  }

  /*
   * Make sure every participant with a stream
   * has exactly one tile.
   */

  for (
    const [id, stream] of streams
  ) {

    if (
      !tiles.has(id) &&
      users.has(id)
    ) {

      const user =
        users.get(id);

      const tile =
        createTile(
          id,
          user?.name || "Guest",
          stream,
          id === myId
        );

      tiles.set(
        id,
        tile
      );
    }
  }
}


/* --------------------------------------------------
   REMOVE USER
-------------------------------------------------- */

function removeUser(userId) {

  if (
    !userId ||
    userId === myId
  ) {
    return;
  }

  removePeer(
    userId
  );

  const tile =
    tiles.get(userId);

  if (tile) {

    tile.remove();

    tiles.delete(
      userId
    );
  }

  streams.delete(
    userId
  );

  users.delete(
    userId
  );

  pendingCandidates.delete(
    userId
  );

  if (
    selectedUserId === userId
  ) {

    selectedUserId =
      myId;

    selectUser(
      myId
    );
  }
}


/* --------------------------------------------------
   REMOVE PEER
-------------------------------------------------- */

function removePeer(
  userId
) {

  const peer =
    peers.get(userId);

  if (peer) {

    try {
      peer.close();
    } catch {}
  }

  peers.delete(
    userId
  );

  pendingCandidates.delete(
    userId
  );

  const timer =
    speakingTimers.get(
      userId
    );

  if (timer) {

    clearTimeout(
      timer
    );

    speakingTimers.delete(
      userId
    );
  }

  const audio =
    audioContexts.get(
      userId
    );

  if (audio) {

    try {
      audio.close();
    } catch {}

    audioContexts.delete(
      userId
    );
  }
}


/* --------------------------------------------------
   NAME UPDATE
-------------------------------------------------- */

function updateUserName(
  userId,
  name
) {

  const user =
    users.get(userId);

  if (!user) {
    return;
  }

  user.name =
    name;

  const tile =
    tiles.get(userId);

  if (tile) {

    const label =
      tile.querySelector(
        ".name"
      );

    if (label) {

      label.textContent =
        userId === myId
          ? name + " (You)"
          : name;
    }
  }

  if (
    selectedUserId === userId
  ) {

    largeName.textContent =
      userId === myId
        ? name + " (You)"
        : name;
  }
}


/* --------------------------------------------------
   SPEAKING DETECTION
-------------------------------------------------- */

async function startSpeakingDetection(
  userId,
  stream,
  tile
) {

  if (
    !stream ||
    !stream.getAudioTracks().length
  ) {
    return;
  }

  if (
    audioContexts.has(userId)
  ) {
    return;
  }

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const context =
      new AudioContext();

    const source =
      context.createMediaStreamSource(
        stream
      );

    const analyser =
      context.createAnalyser();

    analyser.fftSize =
      512;

    source.connect(
      analyser
    );

    const data =
      new Uint8Array(
        analyser.frequencyBinCount
      );

    audioContexts.set(
      userId,
      context
    );

    function check() {

      if (
        !tiles.has(userId)
      ) {
        return;
      }

      analyser.getByteFrequencyData(
        data
      );

      let total = 0;

      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        total +=
          data[i];
      }

      const average =
        total /
        data.length;

      if (
        average > 10
      ) {

        tile.classList.add(
          "speaking"
        );

        if (
          selectedUserId === userId
        ) {

          largeVideoContainer.classList.add(
            "speaking"
          );
        }

        const oldTimer =
          speakingTimers.get(
            userId
          );

        if (oldTimer) {
          clearTimeout(
            oldTimer
          );
        }

        const timer =
          setTimeout(() => {

            tile.classList.remove(
              "speaking"
            );

            if (
              selectedUserId ===
              userId
            ) {

              largeVideoContainer.classList.remove(
                "speaking"
              );
            }

          }, 500);

        speakingTimers.set(
          userId,
          timer
        );
      }

      requestAnimationFrame(
        check
      );
    }

    check();

  } catch (error) {

    console.error(
      "Speaking detection error:",
      error
    );
  }
}


/* --------------------------------------------------
   CLEAR EVERYTHING
-------------------------------------------------- */

function clearVideoUI() {

  for (
    const tile of tiles.values()
  ) {

    tile.remove();
  }

  tiles.clear();

  thumbnails.innerHTML =
    "";

  largeVideo.srcObject =
    null;

  largeName.textContent =
    "";

  largeVideoContainer.classList.remove(
    "speaking"
  );
}

   FULLSCREEN
-------------------------------------------------- */

largeVideo.onclick =

    try {

      if (
        document.fullscreenElement
      ) {

        await document.exitFullscreen();

      } else {

        await largeVideoContainer.requestFullscreen();

      }

    } catch (error) {

      console.error(
        "Fullscreen error:",
        error
      );
    }
  };


/* --------------------------------------------------
   LEAVE ROOM
-------------------------------------------------- */

async function leaveRoom(
  reconnect = true
) {

  if (leaving) {
    return;
  }

  leaving = true;
  joining = false;

  /*
   * Tell server first.
   */

  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {

    try {

      socket.send(
        JSON.stringify({
          type: "leaveRoom"
        })
      );

    } catch {}
  }

  /*
   * Close every WebRTC connection.
   */

  for (
    const peer of peers.values()
  ) {

    try {
      peer.close();
    } catch {}
  }

  peers.clear();

  /*
   * Clear ICE queues.
   */

  pendingCandidates.clear();

  /*
   * Stop audio analysis.
   */

  for (
    const timer of speakingTimers.values()
  ) {

    clearTimeout(
      timer
    );
  }

  speakingTimers.clear();

  for (
    const context of audioContexts.values()
  ) {

    try {
      context.close();
    } catch {}
  }

  audioContexts.clear();

  /*
   * Remove every video element.
   */

  clearVideoUI();

  /*
   * Clear participant state.
   */

  users.clear();
  streams.clear();

  selectedUserId =
    null;

  roomCode =
    null;

  /*
   * Stop camera and microphone.
   */

  if (localStream) {

    for (
      const track of
      localStream.getTracks()
    ) {

      track.stop();
    }

    localStream =
      null;
  }

  /*
   * Close WebSocket.
   */

  if (socket) {

    try {
      socket.close();
    } catch {}

    socket =
      null;
  }

  app.style.display =
    "none";

  joinScreen.style.display =
    "flex";

  joinStatus.textContent =
    "";

  leaving = false;

  if (reconnect) {
    roomCodeInput.focus();
  }
}


/* --------------------------------------------------
   LEAVE BUTTON
-------------------------------------------------- */

leaveButton.onclick =
  () => {

    leaveRoom(true);
  };


/* --------------------------------------------------
   PAGE CLOSE
-------------------------------------------------- */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      socket &&
      socket.readyState ===
        WebSocket.OPEN
    ) {

      try {

        socket.send(
          JSON.stringify({
            type: "leaveRoom"
          })
        );

      } catch {}
    }

    for (
      const peer of peers.values()
    ) {

      try {
        peer.close();
      } catch {}
    }

    if (localStream) {

      for (
        const track of
        localStream.getTracks()
      ) {

        track.stop();
      }
    }
  }
);
