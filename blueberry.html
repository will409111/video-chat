<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blueberry Moderator</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #0d0f13;
  color: white;
}

body {
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* LOGIN */

#login {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-card {
  width: min(430px, 100%);
  background: #181b21;
  border: 1px solid #30343d;
  border-radius: 20px;
  padding: 26px;
}

.login-card h1 {
  margin-top: 0;
}

.field {
  margin-top: 14px;
}

.field label {
  display: block;
  color: #bfc5d0;
  font-size: 13px;
  margin-bottom: 6px;
}

.field input,
.field select {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #363a43;
  background: #0d0f13;
  color: white;
}

.login-card button {
  margin-top: 18px;
  width: 100%;
  border: 0;
  padding: 13px;
  border-radius: 10px;
  background: #3978ff;
  color: white;
  font-weight: 800;
}

#loginStatus {
  margin-top: 12px;
  color: #ffb3b3;
}

/* DASHBOARD */

#dashboard {
  min-height: 100vh;
}

.topbar {
  min-height: 62px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #181b21;
  border-bottom: 1px solid #2c3038;
  flex-wrap: wrap;
}

.brand {
  font-weight: 900;
  font-size: 19px;
}

.mod-info {
  color: #aeb4c0;
  font-size: 13px;
  flex: 1;
}

.topbar button {
  border: 0;
  border-radius: 8px;
  background: #2c3038;
  color: white;
  padding: 9px 12px;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 310px minmax(0, 1fr);
  min-height: calc(100vh - 62px);
}

/* SIDEBAR */

.sidebar {
  border-right: 1px solid #2c3038;
  background: #13161b;
  padding: 13px;
  overflow-y: auto;
}

.section-title {
  margin: 12px 0 8px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #7f8794;
}

.room-card {
  background: #1b1e24;
  border: 1px solid #30343d;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
}

.room-card.active {
  border-color: #3978ff;
}

.room-card-title {
  font-weight: 800;
}

.room-card-meta {
  color: #9299a6;
  font-size: 12px;
  margin-top: 4px;
}

.room-buttons {
  display: flex;
  gap: 5px;
  margin-top: 9px;
}

.room-buttons button {
  flex: 1;
  border: 0;
  border-radius: 7px;
  padding: 7px;
  background: #30343d;
  color: white;
  font-size: 12px;
}

.room-buttons .join {
  background: #3978ff;
}

/* MAIN */

.main {
  min-width: 0;
  padding: 14px;
  overflow-y: auto;
}

.panel {
  background: #15181d;
  border: 1px solid #2d3139;
  border-radius: 13px;
  padding: 14px;
  margin-bottom: 14px;
}

.panel h2 {
  margin-top: 0;
  font-size: 17px;
}

.create-room {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
}

.create-room input {
  background: #0c0e12;
  border: 1px solid #363a43;
  color: white;
  padding: 10px;
  border-radius: 8px;
}

.create-room button {
  border: 0;
  border-radius: 8px;
  background: #3978ff;
  color: white;
  padding: 10px 15px;
  font-weight: 700;
}

/* PARTICIPANTS */

.participant {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  background: #1a1d23;
  border-radius: 8px;
  margin-bottom: 7px;
}

.participant-name {
  flex: 1;
  min-width: 0;
  word-break: break-word;
}

.badge {
  font-size: 10px;
  background: #343944;
  padding: 4px 6px;
  border-radius: 5px;
}

.participant button {
  border: 0;
  border-radius: 7px;
  padding: 6px 8px;
  color: white;
  background: #353943;
  font-size: 11px;
}

.participant button.danger {
  background: #c73737;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  z-index: 50;
}

.modal-card {
  width: min(450px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #181b21;
  border: 1px solid #343943;
  border-radius: 14px;
  padding: 18px;
}

.modal-card h2 {
  margin-top: 0;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.modal-actions button {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 10px;
  background: #30343d;
  color: white;
}

.modal-actions .confirm {
  background: #3978ff;
}

.duration-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.duration-row input,
.duration-row select {
  width: 100%;
  background: #0d0f13;
  color: white;
  border: 1px solid #363a43;
  border-radius: 8px;
  padding: 10px;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

/* ROOM VIEW */

.room-view {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 12px;
}

.room-videos {
  min-width: 0;
}

.big-video {
  height: min(60vh, 650px);
  min-height: 250px;
  background: black;
  border-radius: 13px;
  overflow: hidden;
  border: 3px solid #30343d;
}

.big-video.talking {
  border-color: #29d66d;
}

.big-video video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.moderator-video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 8px;
  margin-top: 9px;
}

.mod-video {
  position: relative;
  height: 110px;
  background: black;
  border: 3px solid #30343d;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
}

.mod-video.talking {
  border-color: #29d66d;
}

.mod-video video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mod-video span {
  position: absolute;
  bottom: 4px;
  left: 4px;
  right: 4px;
  background: rgba(0,0,0,.65);
  padding: 4px;
  border-radius: 5px;
  font-size: 11px;
}

/* CHAT */

.mod-chat {
  min-width: 0;
  height: 100%;
  min-height: 400px;
  background: #171a20;
  border: 1px solid #30343d;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
}

.mod-chat-header {
  padding: 12px;
  border-bottom: 1px solid #30343d;
  font-weight: 800;
}

.mod-chat-messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
}

.mod-chat-message {
  margin-bottom: 9px;
}

.mod-chat-name {
  color: #8faeff;
  font-size: 12px;
  font-weight: 700;
}

.mod-chat-text {
  word-break: break-word;
  margin-top: 2px;
}

.mod-chat-form {
  padding: 8px;
  border-top: 1px solid #30343d;
  display: flex;
  gap: 5px;
}

.mod-chat-form input {
  min-width: 0;
  flex: 1;
  background: #0d0f13;
  color: white;
  border: 1px solid #363a43;
  padding: 9px;
  border-radius: 7px;
}

.mod-chat-form button {
  border: 0;
  border-radius: 7px;
  background: #3978ff;
  color: white;
  padding: 0 11px;
}

/* TABLE-LIKE LISTS */

.list-item {
  background: #1a1d23;
  border-radius: 8px;
  padding: 9px;
  margin-bottom: 7px;
  font-size: 13px;
}

.list-item small {
  color: #8c94a1;
}

.log-item {
  border-left: 3px solid #3978ff;
  background: #1a1d23;
  border-radius: 7px;
  padding: 8px;
  margin-bottom: 7px;
  font-size: 12px;
}

/* MOBILE */

@media (max-width: 900px) {

  .dashboard-grid {
    grid-template-columns: 1fr;
  }

  .sidebar {
    border-right: 0;
    border-bottom: 1px solid #2c3038;
    max-height: 350px;
  }

  .create-room {
    grid-template-columns: 1fr;
  }

  .room-view {
    grid-template-columns: 1fr;
  }

  .mod-chat {
    height: 330px;
    min-height: 330px;
  }
}

@media (max-width: 500px) {

  .topbar {
    padding: 8px;
  }

  .brand {
    width: 100%;
  }

  .mod-info {
    width: 100%;
  }

  .main {
    padding: 8px;
  }

  .big-video {
    height: 42vh;
  }

  .moderator-video-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .mod-video {
    height: 95px;
  }

  .duration-row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="login">

  <div class="login-card">

    <h1>🫐 Blueberry Moderator</h1>

    <p>
      Enter your moderator PIN to access the dashboard.
    </p>

    <div class="field">
      <label for="moderatorName">
        Moderator name
      </label>

      <input
        id="moderatorName"
        maxlength="40"
        placeholder="Moderator"
      >
    </div>

    <div class="field">
      <label for="moderatorPin">
        Moderator PIN
      </label>

      <input
        id="moderatorPin"
        type="password"
        placeholder="PIN"
      >
    </div>

    <button id="loginButton">
      Enter Dashboard
    </button>

    <div id="loginStatus"></div>

  </div>

</section>


<!-- DASHBOARD -->

<section id="dashboard" class="hidden">

  <header class="topbar">

    <div class="brand">
      🫐 Blueberry
    </div>

    <div class="mod-info" id="moderatorInfo"></div>

    <button id="refreshButton">
      Refresh
    </button>

    <button id="logoutButton">
      Logout
    </button>

  </header>


  <div class="dashboard-grid">

    <aside class="sidebar">

      <div class="section-title">
        Open Rooms
      </div>

      <div id="roomList"></div>

    </aside>


    <main class="main">

      <!-- CREATE ROOM -->

      <section class="panel">

        <h2>Create Room</h2>

        <div class="create-room">

          <input
            id="moderatorRoomName"
            placeholder="Room name"
            maxlength="60"
          >

          <input
            id="moderatorRoomCode"
            placeholder="Custom code (optional)"
            maxlength="24"
          >

          <button id="moderatorCreateRoom">
            Create
          </button>

        </div>

      </section>


      <!-- CURRENT ROOM -->

      <section
        id="currentRoomPanel"
        class="panel hidden"
      >

        <h2 id="currentRoomTitle">
          Room
        </h2>

        <div
          id="currentRoomParticipants"
          class="room-view"
        >

          <div class="room-videos">

            <div
              class="big-video"
              id="moderatorBigVideoWrap"
            >
              <video
                id="moderatorBigVideo"
                autoplay
                playsinline
              ></video>
            </div>

            <div
              id="moderatorVideoGrid"
              class="moderator-video-grid"
            ></div>

          </div>


          <div class="mod-chat">

            <div class="mod-chat-header">
              Room Chat
            </div>

            <div
              id="moderatorChatMessages"
              class="mod-chat-messages"
            ></div>

            <form
              id="moderatorChatForm"
              class="mod-chat-form"
            >
              <input
                id="moderatorChatInput"
                maxlength="500"
                autocomplete="off"
                placeholder="Send a message..."
              >

              <button type="submit">
                Send
              </button>

            </form>

          </div>

        </div>

      </section>


      <!-- PARTICIPANTS -->

      <section class="panel">

        <h2>Participants</h2>

        <div id="participantList">
          No room selected.
        </div>

      </section>


      <!-- BANS -->

      <section class="panel">

        <h2>Banned Users</h2>

        <div id="banList"></div>

      </section>


      <!-- MODERATOR ACCESS -->

      <section class="panel">

        <h2>Moderator Access</h2>

        <div id="moderatorAccessList"></div>

      </section>


      <!-- LOG -->

      <section class="panel">

        <h2>Moderation History</h2>

        <div id="logList"></div>

      </section>

    </main>

  </div>

</section>


<!-- BAN MODAL -->

<div
  id="banModal"
  class="modal hidden"
>

  <div class="modal-card">

    <h2>Ban User</h2>

    <p id="banTargetText"></p>

    <div class="duration-row">

      <input
        id="banAmount"
        type="number"
        min="1"
        value="10"
      >

      <select id="banUnit">
        <option value="seconds">Seconds</option>
        <option value="minutes" selected>Minutes</option>
        <option value="hours">Hours</option>
        <option value="days">Days</option>
        <option value="weeks">Weeks</option>
        <option value="months">Months</option>
        <option value="years">Years</option>
      </select>

    </div>

    <label class="checkbox">
      <input
        type="checkbox"
        id="banPermanent"
      >
      Permanent
    </label>

    <div class="modal-actions">

      <button id="banCancel">
        Cancel
      </button>

      <button
        class="confirm"
        id="banConfirm"
      >
        Ban User
      </button>

    </div>

  </div>

</div>


<!-- GIVE MODERATOR MODAL -->

<div
  id="moderatorModal"
  class="modal hidden"
>

  <div class="modal-card">

    <h2>Give Moderator Access</h2>

    <p id="moderatorTargetText"></p>

    <div class="field">

      <label>
        Custom moderator PIN
      </label>

      <input
        id="newModeratorPin"
        maxlength="100"
        placeholder="Create a PIN for them"
      >

    </div>

    <div class="duration-row">

      <input
        id="moderatorAmount"
        type="number"
        min="1"
        value="1"
      >

      <select id="moderatorUnit">
        <option value="seconds">Seconds</option>
        <option value="minutes">Minutes</option>
        <option value="hours">Hours</option>
        <option value="days" selected>Days</option>
        <option value="weeks">Weeks</option>
        <option value="months">Months</option>
        <option value="years">Years</option>
      </select>

    </div>

    <label class="checkbox">

      <input
        type="checkbox"
        id="moderatorPermanent"
      >

      Permanent

    </label>

    <div class="modal-actions">

      <button id="moderatorCancel">
        Cancel
      </button>

      <button
        class="confirm"
        id="moderatorConfirm"
      >
        Give Access
      </button>

    </div>

  </div>

</div>


<script>
const login = document.getElementById("login");
const dashboard =
  document.getElementById("dashboard");

const moderatorNameInput =
  document.getElementById("moderatorName");

const moderatorPinInput =
  document.getElementById("moderatorPin");

const loginButton =
  document.getElementById("loginButton");

const loginStatus =
  document.getElementById("loginStatus");

const moderatorInfo =
  document.getElementById("moderatorInfo");

const roomList =
  document.getElementById("roomList");

const participantList =
  document.getElementById("participantList");

const banList =
  document.getElementById("banList");

const moderatorAccessList =
  document.getElementById("moderatorAccessList");

const logList =
  document.getElementById("logList");

const currentRoomPanel =
  document.getElementById("currentRoomPanel");

const currentRoomTitle =
  document.getElementById("currentRoomTitle");

const moderatorVideoGrid =
  document.getElementById("moderatorVideoGrid");

const moderatorBigVideo =
  document.getElementById("moderatorBigVideo");

const moderatorBigVideoWrap =
  document.getElementById("moderatorBigVideoWrap");

const moderatorChatMessages =
  document.getElementById("moderatorChatMessages");

const moderatorChatForm =
  document.getElementById("moderatorChatForm");

const moderatorChatInput =
  document.getElementById("moderatorChatInput");

const refreshButton =
  document.getElementById("refreshButton");

const logoutButton =
  document.getElementById("logoutButton");


/* BAN MODAL */

const banModal =
  document.getElementById("banModal");

const banTargetText =
  document.getElementById("banTargetText");

const banAmount =
  document.getElementById("banAmount");

const banUnit =
  document.getElementById("banUnit");

const banPermanent =
  document.getElementById("banPermanent");

const banCancel =
  document.getElementById("banCancel");

const banConfirm =
  document.getElementById("banConfirm");


/* MODERATOR MODAL */

const moderatorModal =
  document.getElementById("moderatorModal");

const moderatorTargetText =
  document.getElementById("moderatorTargetText");

const newModeratorPin =
  document.getElementById("newModeratorPin");

const moderatorAmount =
  document.getElementById("moderatorAmount");

const moderatorUnit =
  document.getElementById("moderatorUnit");

const moderatorPermanent =
  document.getElementById("moderatorPermanent");

const moderatorCancel =
  document.getElementById("moderatorCancel");

const moderatorConfirm =
  document.getElementById("moderatorConfirm");


let ws = null;

let myId = null;
let myName = "";
let moderatorLevel = null;

let rooms = [];
let bans = [];
let moderatorAccess = [];
let logs = [];

let currentRoom = null;

let banTargetId = null;
let moderatorTargetId = null;

const peers = new Map();


/* ---------------- CONNECTION ---------------- */

function connectSocket() {

  return new Promise((resolve, reject) => {

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
      `${protocol}//${location.host}/ws`
    );

    ws.addEventListener("open", () => {
      resolve();
    }, { once: true });

    ws.addEventListener("error", () => {
      reject(
        new Error("Could not connect.")
      );
    }, { once: true });

    ws.addEventListener(
      "message",
      event => {

        let data;

        try {
          data = JSON.parse(
            event.data
          );
        } catch (_) {
          return;
        }

        handleMessage(data);
      }
    );

    ws.addEventListener("close", () => {

      if (!dashboard.classList.contains("hidden")) {
        alert(
          "Moderator connection closed."
        );
      }

    });

  });
}


function send(data) {

  if (
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ) {
    return false;
  }

  ws.send(JSON.stringify(data));

  return true;
}


/* ---------------- LOGIN ---------------- */

loginButton.addEventListener(
  "click",
  async () => {

    loginStatus.textContent =
      "Connecting...";

    try {

      await connectSocket();

      myName =
        moderatorNameInput.value.trim()
        || "Moderator";

      send({
        type: "moderatorAuth",
        name: myName,
        pin: moderatorPinInput.value
      });

    } catch (error) {

      console.error(error);

      loginStatus.textContent =
        "Could not connect to server.";
    }
  }
);


moderatorPinInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      loginButton.click();
    }

  }
);


/* ---------------- SERVER MESSAGE ---------------- */

function handleMessage(data) {

  if (data.type === "connected") {
    myId = data.id;
    return;
  }

  if (data.type === "moderatorAuthSuccess") {

    myId = data.id;
    myName = data.name;
    moderatorLevel = data.level;

    rooms = data.rooms || [];
    bans = data.bans || [];
    moderatorAccess =
      data.moderatorAccess || [];
    logs = data.logs || [];

    login.classList.add("hidden");
    dashboard.classList.remove("hidden");

    moderatorInfo.textContent =
      `${myName} • ${moderatorLevel}`;

    renderEverything();

    return;
  }

  if (data.type === "moderatorData") {

    rooms = data.rooms || [];
    bans = data.bans || [];
    moderatorAccess =
      data.moderatorAccess || [];
    logs = data.logs || [];

    renderEverything();

    return;
  }

  if (data.type === "roomList") {

    rooms = data.rooms || [];

    renderRooms();

    return;
  }

  if (data.type === "moderatorRoomCreated") {

    joinModeratorRoom(
      data.roomCode
    );

    return;
  }

  if (data.type === "moderatorRoomJoined") {

    currentRoom = data.room;

    showCurrentRoom();

    renderCurrentParticipants(
      data.room.participants || []
    );

    renderModeratorChat(
      data.room.messages || []
    );

    /*
      Start WebRTC receiving.
      We DO NOT getUserMedia here.
    */
    for (
      const participant
      of data.room.participants || []
    ) {

      if (
        participant.id !== myId &&
        participant.role === "user"
      ) {
        prepareModeratorPeer(
          participant
        );
      }
    }

    return;
  }

  if (data.type === "participants") {

    if (!currentRoom) {
      return;
    }

    /*
      Server gives moderator the complete list.
    */
    renderCurrentParticipants(
      data.participants || []
    );

    for (
      const participant
      of data.participants || []
    ) {

      if (
        participant.id !== myId &&
        participant.role === "user"
      ) {
        prepareModeratorPeer(
          participant
        );
      }
    }

    return;
  }

  if (data.type === "signal") {

    handleModeratorSignal(data);

    return;
  }

  if (data.type === "chatMessage") {

    addModeratorChatMessage(
      data.message
    );

    return;
  }

  if (data.type === "moderatorAccessCreated") {

    /*
      Show the PIN once to the master moderator.
    */
    alert(
      `Moderator access created.\n\n` +
      `Name: ${data.access.name}\n` +
      `PIN: ${data.access.pin}\n` +
      `Duration: ${data.access.durationText}`
    );

    return;
  }

  if (data.type === "moderatorAccessGranted") {

    alert(
      `You have been granted moderator access.\n\n` +
      `Duration: ${data.durationText}`
    );

    return;
  }

  if (data.type === "moderatorAccessRevoked") {

    alert(
      data.reason ||
      "Moderator access revoked."
    );

    logout();

    return;
  }

  if (data.type === "error") {

    alert(
      data.message ||
      "An error occurred."
    );

    return;
  }

  if (data.type === "kicked") {

    alert(
      data.message ||
      "Kicked."
    );

    return;
  }

  if (data.type === "banned") {

    alert(
      data.message ||
      "Banned."
    );

    return;
  }
}

/* ---------------- MODERATOR WEBRTC ---------------- */

/*
  The moderator DOES NOT call getUserMedia.

  That means:
    - no moderator camera
    - no moderator microphone
    - no publishing tracks

  The normal user creates an offer containing their camera/mic.
  The moderator answers that offer and receives those tracks.
*/

function createModeratorPeer(
  remote
) {

  const existing =
    peers.get(remote.id);

  if (existing) {
    return existing.pc;
  }

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  pc.onicecandidate =
    event => {

      if (!event.candidate) {
        return;
      }

      send({
        type: "signal",
        target: remote.id,
        signal: {
          type: "ice",
          candidate:
            event.candidate
        }
      });
    };

  pc.ontrack =
    event => {

      let entry =
        peers.get(remote.id);

      if (!entry) {
        entry = {
          pc,
          stream:
            new MediaStream(),
          name: remote.name,
          tile: null,
          video: null
        };

        peers.set(
          remote.id,
          entry
        );
      }

      const exists =
        entry.stream
          .getTracks()
          .some(
            track =>
              track.id ===
              event.track.id
          );

      if (!exists) {
        entry.stream.addTrack(
          event.track
        );
      }

      createModeratorVideo(
        remote.id,
        remote.name,
        entry.stream
      );
    };

  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
          "failed" ||
        pc.connectionState ===
          "closed"
      ) {

        closeModeratorPeer(
          remote.id
        );
      }
    };

  peers.set(
    remote.id,
    {
      pc,
      stream:
        new MediaStream(),
      name: remote.name,
      tile: null,
      video: null,
      pendingIce: []
    }
  );

  return pc;
}


function prepareModeratorPeer(
  remote
) {

  if (!remote || remote.id === myId) {
    return;
  }

  createModeratorPeer(remote);
}


async function handleModeratorSignal(
  data
) {

  const participant = {
    id: data.from,
    name:
      data.fromName ||
      "Participant",
    role:
      data.fromRole ||
      "user"
  };

  const pc =
    createModeratorPeer(
      participant
    );

  const entry =
    peers.get(data.from);

  try {

    if (
      data.signal.type ===
      "offer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.signal.sdp
        )
      );

      if (entry.pendingIce) {

        for (
          const candidate
          of entry.pendingIce
        ) {

          try {
            await pc.addIceCandidate(
              candidate
            );
          } catch (_) {}

        }

        entry.pendingIce = [];
      }

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      send({
        type: "signal",
        target: data.from,
        signal: {
          type: "answer",
          sdp:
            pc.localDescription
        }
      });

      return;
    }

    if (
      data.signal.type ===
      "answer"
    ) {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.signal.sdp
        )
      );

      if (entry.pendingIce) {

        for (
          const candidate
          of entry.pendingIce
        ) {

          try {
            await pc.addIceCandidate(
              candidate
            );
          } catch (_) {}

        }

        entry.pendingIce = [];
      }

      return;
    }

    if (
      data.signal.type ===
      "ice"
    ) {

      const candidate =
        new RTCIceCandidate(
          data.signal.candidate
        );

      if (
        !pc.remoteDescription
      ) {

        entry.pendingIce.push(
          candidate
        );

      } else {

        await pc.addIceCandidate(
          candidate
        );
      }
    }

  } catch (error) {

    console.error(
      "Moderator WebRTC error:",
      error
    );
  }
}


/* ---------------- MODERATOR VIDEO UI ---------------- */

function createModeratorVideo(
  id,
  name,
  stream
) {

  const entry =
    peers.get(id);

  if (!entry) {
    return;
  }

  if (entry.tile) {

    if (
      entry.video.srcObject !==
      stream
    ) {
      entry.video.srcObject =
        stream;
    }

    return;
  }

  const tile =
    document.createElement("div");

  tile.className =
    "mod-video";

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  const label =
    document.createElement("span");

  label.textContent = name;

  tile.appendChild(video);
  tile.appendChild(label);

  tile.addEventListener(
    "click",
    () => {

      moderatorBigVideo.srcObject =
        stream;
    }
  );

  moderatorVideoGrid.appendChild(
    tile
  );

  entry.tile = tile;
  entry.video = video;

  video.play().catch(() => {});
}


function closeModeratorPeer(id) {

  const entry =
    peers.get(id);

  if (!entry) {
    return;
  }

  try {
    entry.pc.close();
  } catch (_) {}

  if (entry.tile) {
    entry.tile.remove();
  }

  peers.delete(id);
}

function formatRemaining(
  expiresAt
) {

  if (expiresAt === null) {
    return "Permanent";
  }

  const difference =
    expiresAt - Date.now();

  if (difference <= 0) {
    return "Expired";
  }

  let seconds =
    Math.floor(
      difference / 1000
    );

  const days =
    Math.floor(
      seconds / 86400
    );

  seconds %= 86400;

  const hours =
    Math.floor(
      seconds / 3600
    );

  seconds %= 3600;

  const minutes =
    Math.floor(
      seconds / 60
    );

  if (days > 0) {
    return `${days}d ${hours}h`;
  }

  if (hours > 0) {
    return `${hours}h ${minutes}m`;
  }

  return `${minutes}m`;
}


function renderModeratorAccess() {

  moderatorAccessList.innerHTML =
    "";

    details.textContent =

        access.expiresAt

    item.appendChild(name);

    item.appendChild(
      document.createElement("br")
    );

    item.appendChild(details);

    /*
      Only master moderator can revoke.
    */

      moderatorLevel === "master"
    ) {

      const revoke =
        document.createElement("button");

      revoke.textContent =
        "Revoke";

      );

        document.createElement("br")
      );

    }

    moderatorAccessList.appendChild(

    );
  }
}


/* ---------------- LOGS ---------------- */

function renderLogs() {

  logList.innerHTML = "";

  if (!logs.length) {

    logList.textContent =
      "No moderation history.";

    return;
  }

  for (const log of logs) {

    const item =
      document.createElement("div");

    item.className =
      "log-item";

    const moderator =
      log.moderator
        ? log.moderator.name
        : "System";

    const target =
      log.target
        ? log.target.name
        : "";

    const time =
      new Date(
        log.time
      ).toLocaleString();

    let text =
      `${log.action} • ${moderator}`;

    if (target) {
      text += ` → ${target}`;
    }

    if (log.durationText) {
      text += ` • ${log.durationText}`;
    }

    const line =
      document.createElement("div");

    line.textContent =
      text;

    const small =
      document.createElement("small");

    small.textContent =
      time;

    item.appendChild(line);
    item.appendChild(
      document.createElement("br")
    );
    item.appendChild(small);

    logList.appendChild(item);
  }
}

  renderModeratorAccess();

function logout() {

  for (
    const id
    of peers.keys()
  ) {

    closeModeratorPeer(id);
  }

  currentRoom = null;

  currentRoomPanel.classList.add(
    "hidden"
  );

  if (ws) {

    try {
      ws.close();
    } catch (_) {}
  }

  ws = null;

  dashboard.classList.add(
    "hidden"
  );

  login.classList.remove(
    "hidden"
  );

  moderatorPinInput.value = "";
}
