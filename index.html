<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #101114;
  color: white;
}

body {
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* ---------------- HOME ---------------- */

#home {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.home-card {
  width: min(560px, 100%);
  background: #191b20;
  border: 1px solid #30333b;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.home-card h1 {
  margin-top: 0;
  font-size: 32px;
}

.home-card p {
  color: #aeb4c0;
}

.field {
  margin-top: 16px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  color: #cbd0da;
  font-size: 14px;
}

.field input {
  width: 100%;
  padding: 13px 14px;
  border-radius: 11px;
  border: 1px solid #3a3e47;
  background: #101216;
  color: white;
  outline: none;
}

.field input:focus {
  border-color: #5e9cff;
}

.home-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.primary,
.secondary,
.danger {
  border: 0;
  border-radius: 11px;
  padding: 13px 16px;
  font-weight: 700;
}

.primary {
  background: #3978ff;
  color: white;
}

.secondary {
  background: #2a2d34;
  color: white;
}

.danger {
  background: #c73737;
  color: white;
}

.status {
  min-height: 22px;
  margin-top: 15px;
  color: #ffb5b5;
}

/* ---------------- CALL ---------------- */

#call {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 64px;
  padding: 10px 14px;
  background: #181a1f;
  border-bottom: 1px solid #2c2f36;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.room-info {
  flex: 1;
  min-width: 160px;
}

.room-name {
  font-weight: 800;
}

.room-code {
  font-size: 12px;
  color: #969dab;
  margin-top: 2px;
}

.top-actions {
  display: flex;
  gap: 7px;
}

.top-actions button {
  border: 0;
  border-radius: 9px;
  padding: 9px 12px;
  background: #2b2e35;
  color: white;
}

.top-actions .leave {
  background: #c73737;
}

/* ---------------- MAIN ---------------- */

.call-layout {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  min-height: 0;
}

.video-area {
  min-width: 0;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.main-video-wrap {
  position: relative;
  width: 100%;
  height: min(62vh, 650px);
  min-height: 260px;
  background: #050506;
  border-radius: 16px;
  overflow: hidden;
  border: 3px solid #30343c;
}

.main-video-wrap.talking {
  border-color: #29d66d;
}

#mainVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

.main-label {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: rgba(0,0,0,.65);
  padding: 6px 9px;
  border-radius: 8px;
  font-size: 13px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 9px;
}

.video-tile {
  position: relative;
  height: 115px;
  background: #050506;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #30343c;
  cursor: pointer;
}

.video-tile.talking {
  border-color: #29d66d;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}

.video-tile .tile-name {
  position: absolute;
  bottom: 5px;
  left: 5px;
  right: 5px;
  background: rgba(0,0,0,.65);
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 12px;
}

/* ---------------- CHAT ---------------- */

.chat-panel {
  min-width: 0;
  border-left: 1px solid #2c2f36;
  background: #17191e;
  display: flex;
  flex-direction: column;
}

.chat-header {
  padding: 13px;
  border-bottom: 1px solid #2c2f36;
  font-weight: 800;
}

.chat-messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px;
}

.chat-message {
  margin-bottom: 10px;
  word-break: break-word;
}

.chat-name {
  font-size: 12px;
  color: #8faeff;
  font-weight: 700;
}

.chat-text {
  margin-top: 3px;
  line-height: 1.35;
}

.chat-time {
  color: #707680;
  font-size: 10px;
  margin-left: 5px;
}

.chat-form {
  padding: 10px;
  border-top: 1px solid #2c2f36;
  display: flex;
  gap: 7px;
}

.chat-form input {
  flex: 1;
  min-width: 0;
  background: #0e1014;
  border: 1px solid #343842;
  color: white;
  border-radius: 9px;
  padding: 10px;
}

.chat-form button {
  border: 0;
  border-radius: 9px;
  padding: 0 14px;
  background: #3978ff;
  color: white;
  font-weight: 700;
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 800px) {
  #home {
    padding: 12px;
    align-items: flex-start;
    padding-top: 35px;
  }

  .home-card {
    padding: 20px;
    border-radius: 16px;
  }

  .home-buttons {
    grid-template-columns: 1fr;
  }

  .topbar {
    padding: 8px;
  }

  .top-actions {
    width: 100%;
  }

  .top-actions button {
    flex: 1;
  }

  .call-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 320px;
  }

  .video-area {
    padding: 8px;
  }

  .main-video-wrap {
    height: 45vh;
    min-height: 220px;
  }

  .video-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .video-tile {
    height: 105px;
  }

  .chat-panel {
    border-left: 0;
    border-top: 1px solid #2c2f36;
  }

  .chat-messages {
    max-height: 250px;
  }
}

@media (max-width: 450px) {
  .room-info {
    width: 100%;
    flex-basis: 100%;
  }

  .main-video-wrap {
    height: 38vh;
  }

  .video-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .video-tile {
    height: 90px;
  }
}
</style>
</head>

<body>

<section id="home">
  <div class="home-card">
    <h1>Video Chat</h1>
    <p>Create a temporary room or join someone else's room.</p>

    <div class="field">
      <label for="nameInput">Your display name</label>
      <input id="nameInput" maxlength="40" placeholder="Your name">
    </div>

    <div class="field">
      <label for="roomNameInput">Room name</label>
      <input id="roomNameInput" maxlength="60" placeholder="My Video Room">
    </div>

    <div class="field">
      <label for="roomCodeInput">Room code</label>
      <input id="roomCodeInput" maxlength="24" placeholder="Leave blank for a random code">
    </div>

    <div class="home-buttons">
      <button class="primary" id="createButton">Create Room</button>
      <button class="secondary" id="joinButton">Join Room</button>
    </div>

    <div class="status" id="homeStatus"></div>
  </div>
</section>


<section id="call" class="hidden">

  <div class="topbar">

    <div class="room-info">
      <div class="room-name" id="displayRoomName">Room</div>
      <div class="room-code" id="displayRoomCode"></div>
    </div>

    <div class="top-actions">
      <button id="muteButton">Mute</button>
      <button id="cameraButton">Camera Off</button>
      <button class="leave" id="leaveButton">Leave Room</button>
    </div>

  </div>

  <div class="call-layout">

    <main class="video-area">

      <div class="main-video-wrap" id="mainVideoWrap">
        <video id="mainVideo" autoplay playsinline></video>
        <div class="main-label" id="mainVideoLabel">You</div>
      </div>

      <div class="video-grid" id="videoGrid"></div>

    </main>

    <aside class="chat-panel">

      <div class="chat-header">
        Room Chat
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <form class="chat-form" id="chatForm">
        <input
          id="chatInput"
          maxlength="500"
          autocomplete="off"
          placeholder="Type a message..."
        >
        <button type="submit">Send</button>
      </form>

    </aside>

  </div>
</section>


<script>
const home = document.getElementById("home");
const call = document.getElementById("call");

const nameInput = document.getElementById("nameInput");
const roomNameInput = document.getElementById("roomNameInput");
const roomCodeInput = document.getElementById("roomCodeInput");

const createButton = document.getElementById("createButton");
const joinButton = document.getElementById("joinButton");

const homeStatus = document.getElementById("homeStatus");

const displayRoomName = document.getElementById("displayRoomName");
const displayRoomCode = document.getElementById("displayRoomCode");

const mainVideo = document.getElementById("mainVideo");
const mainVideoWrap = document.getElementById("mainVideoWrap");
const mainVideoLabel = document.getElementById("mainVideoLabel");
const videoGrid = document.getElementById("videoGrid");

const chatMessages = document.getElementById("chatMessages");
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");

const muteButton = document.getElementById("muteButton");
const cameraButton = document.getElementById("cameraButton");
const leaveButton = document.getElementById("leaveButton");

let ws = null;

let myId = null;
let myName = "";

let currentRoom = null;

let localStream = null;

const peers = new Map();

/*
  Each entry:

  {
    pc,
    stream,
    name,
    role,
    tile,
    video
  }
*/

const participants = new Map();

let selectedParticipantId = null;


/* ---------------- WEBSOCKET ---------------- */

function connectSocket() {
  return new Promise((resolve, reject) => {

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
      `${protocol}//${location.host}/ws`
    );

    ws.addEventListener("open", () => {
      resolve();
    }, { once: true });

    ws.addEventListener("error", () => {
      reject(new Error("Unable to connect to server."));
    }, { once: true });

    ws.addEventListener("message", event => {
      let data;

      try {
        data = JSON.parse(event.data);
      } catch (_) {
        return;
      }

      handleServerMessage(data);
    });

    ws.addEventListener("close", () => {
      if (!call.classList.contains("hidden")) {
        homeStatus.textContent =
          "Connection lost. Refresh the page to reconnect.";
      }
    });
  });
}


function send(data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return false;
  }

  ws.send(JSON.stringify(data));
  return true;
}


/* ---------------- NAME / JOIN ---------------- */

async function ensureConnected() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    return;
  }

  await connectSocket();
}


async function getCameraAndMic() {
  if (localStream) {
    return localStream;
  }

  /*
    Get media BEFORE joining.

    This is important because it makes sure the normal user has
    tracks available when WebRTC offers are created.
  */
  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });

  mainVideo.srcObject = localStream;
  mainVideo.muted = true;

  return localStream;
}


async function registerUser() {
  myName = nameInput.value.trim() || "Guest";

  send({
    type: "register",
    name: myName
  });
}


/* ---------------- CREATE / JOIN ---------------- */

createButton.addEventListener("click", async () => {
  try {
    homeStatus.textContent = "Starting camera and microphone...";

    await ensureConnected();
    await getCameraAndMic();
    await registerUser();

    const roomName =
      roomNameInput.value.trim() || "My Video Room";

    const roomCode =
      roomCodeInput.value.trim();

    /*
      IMPORTANT:
      The exact custom room code is sent to the server.
      The server only generates a random code when this is blank.
    */
    send({
      type: "createRoom",
      roomName,
      roomCode
    });

  } catch (error) {
    console.error(error);

    homeStatus.textContent =
      "Camera/microphone permission is required. " +
      "Make sure you allowed access.";
  }
});


joinButton.addEventListener("click", async () => {
  try {
    const code = roomCodeInput.value.trim();

    if (!code) {
      homeStatus.textContent = "Enter a room code.";
      return;
    }

    homeStatus.textContent =
      "Starting camera and microphone...";

    await ensureConnected();
    await getCameraAndMic();
    await registerUser();

    send({
      type: "joinRoom",
      roomCode: code
    });

  } catch (error) {
    console.error(error);

    homeStatus.textContent =
      "Camera/microphone permission is required.";
  }
});


/* ---------------- SERVER MESSAGES ---------------- */

function handleServerMessage(data) {

  if (data.type === "connected") {
    myId = data.id;
    return;
  }

  if (data.type === "registered") {
    myId = data.id;
    myName = data.name;
    return;
  }

  if (data.type === "roomCreated") {
    /*
      DO NOT call joinRoom here.
      The server already joined the creator.
    */

    currentRoom = data.room;

    showCall();
    return;
  }

  if (data.type === "roomJoined") {
    currentRoom = data.room;

    showCall();

    /*
      Existing participants are now known.
      Start WebRTC connections.
    */
    updateParticipants(data.room.participants);

    renderChat(data.room.messages || []);

    /*
      The server will also send participants immediately,
      but this makes the initial connection reliable.
    */
    for (const participant of data.room.participants || []) {
      preparePeer(participant);
    }

    return;
  }

  if (data.type === "participants") {
    updateParticipants(data.participants || []);
    return;
  }

  if (data.type === "signal") {
    handleSignal(data);
    return;
  }

  if (data.type === "chatMessage") {
    addChatMessage(data.message);
    return;
  }

  if (data.type === "kicked") {
    alert(data.message || "You were kicked.");

    cleanupCall();
    return;
  }

  if (data.type === "banned") {
    alert(data.message || "You are banned.");

    cleanupCall();
    return;
  }

  if (data.type === "leftRoom") {
    cleanupCall();
    return;
  }

  if (data.type === "error") {
    homeStatus.textContent = data.message || "An error occurred.";

    if (!call.classList.contains("hidden")) {
      alert(data.message || "An error occurred.");
    }

    return;
  }
}


/* ---------------- PARTICIPANTS ---------------- */

function updateParticipants(list) {

  const incoming = new Set();

  for (const participant of list) {

    if (!participant || participant.id === myId) {
      continue;
    }

    incoming.add(participant.id);

    participants.set(participant.id, participant);

    preparePeer(participant);
  }

  /*
    Remove participants that are no longer present.
  */
  for (const [id] of participants) {

    if (!incoming.has(id)) {

      participants.delete(id);

      closePeer(id);
      removeVideoTile(id);

      if (selectedParticipantId === id) {
        selectedParticipantId = null;
        showLocalVideo();
      }
    }
  }
}


/* ---------------- WEBRTC ---------------- */

function createPeerConnection(remote) {

  const existing = peers.get(remote.id);

  if (existing) {
    return existing.pc;
  }

  const pc = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  });

  /*
    Normal users always publish their camera/microphone.
  */
  if (localStream) {
    for (const track of localStream.getTracks()) {
      pc.addTrack(track, localStream);
    }
  }

  pc.onicecandidate = event => {

    if (!event.candidate) {
      return;
    }

    send({
      type: "signal",
      target: remote.id,
      signal: {
        type: "ice",
        candidate: event.candidate
      }
    });
  };

  pc.ontrack = event => {

    let entry = peers.get(remote.id);

    if (!entry) {
      entry = {
        pc,
        stream: new MediaStream(),
        name: remote.name,
        role: remote.role,
        tile: null,
        video: null
      };

      peers.set(remote.id, entry);
    }

    /*
      Add each received track to the remote MediaStream.
    */
    const alreadyThere =
      entry.stream.getTracks()
        .some(track => track.id === event.track.id);

    if (!alreadyThere) {
      entry.stream.addTrack(event.track);
    }

    createOrUpdateVideoTile(
      remote.id,
      remote.name,
      entry.stream
    );
  };

  pc.onconnectionstatechange = () => {

    const state = pc.connectionState;

    if (
      state === "failed" ||
      state === "closed"
    ) {
      closePeer(remote.id);
    }
  };

  peers.set(remote.id, {
    pc,
    stream: new MediaStream(),
    name: remote.name,
    role: remote.role,
    tile: null,
    video: null
  });

  return pc;
}


/*
  IMPORTANT NEGOTIATION RULE:

  Normal user A/B:
    lower ID creates offer.

  Normal user -> anonymous moderator:
    NORMAL USER creates offer.

  This guarantees the moderator receives the normal user's
  camera and microphone even though the moderator publishes
  no tracks.
*/
function shouldCreateOffer(remote) {
  return remote.role === "moderator"
    ? true
    : myId < remote.id;
}


async function preparePeer(remote) {

  if (!remote || remote.id === myId) {
    return;
  }

  const pc = createPeerConnection(remote);

  /*
    Wait a tiny moment so the RTCPeerConnection has its
    media transceivers/tracks fully established.
  */
  if (!shouldCreateOffer(remote)) {
    return;
  }

  const entry = peers.get(remote.id);

  if (entry.offerCreated) {
    return;
  }

  entry.offerCreated = true;

  try {

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    send({
      type: "signal",
      target: remote.id,
      signal: {
        type: "offer",
        sdp: pc.localDescription
      }
    });

  } catch (error) {
    console.error(
      "Offer creation failed:",
      error
    );

    entry.offerCreated = false;
  }
}


async function handleSignal(data) {

  const remote = participants.get(data.from);

  /*
    If the remote participant isn't known yet, create a
    minimal participant record from the signal itself.
  */
  const participant = remote || {
    id: data.from,
    name: data.fromName || "Participant",
    role: data.fromRole || "user"
  };

  participants.set(participant.id, participant);

  const pc = createPeerConnection(participant);
  const entry = peers.get(participant.id);

  try {

    if (data.signal.type === "offer") {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.signal.sdp
        )
      );

      /*
        If ICE candidates arrived before the offer,
        they are added after the remote description.
      */
      if (entry.pendingIce) {

        for (const candidate of entry.pendingIce) {
          try {
            await pc.addIceCandidate(candidate);
          } catch (_) {}
        }

        entry.pendingIce = [];
      }

      const answer = await pc.createAnswer();

      await pc.setLocalDescription(answer);

      send({
        type: "signal",
        target: participant.id,
        signal: {
          type: "answer",
          sdp: pc.localDescription
        }
      });

      return;
    }

    if (data.signal.type === "answer") {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.signal.sdp
        )
      );

      if (entry.pendingIce) {

        for (const candidate of entry.pendingIce) {
          try {
            await pc.addIceCandidate(candidate);
          } catch (_) {}
        }

        entry.pendingIce = [];
      }

      return;
    }

    if (data.signal.type === "ice") {

      const candidate =
        new RTCIceCandidate(
          data.signal.candidate
        );

      /*
        ICE can arrive before SDP.
        Queue it until remote description exists.
      */
      if (!pc.remoteDescription) {

        if (!entry.pendingIce) {
          entry.pendingIce = [];
        }

        entry.pendingIce.push(candidate);

      } else {

        await pc.addIceCandidate(candidate);
      }
    }

  } catch (error) {
    console.error(
      "WebRTC signal error:",
      error
    );
  }
}


/* ---------------- VIDEO UI ---------------- */

function createOrUpdateVideoTile(id, name, stream) {

  let entry = peers.get(id);

  if (!entry) {
    return;
  }

  if (entry.tile) {

    if (entry.video.srcObject !== stream) {
      entry.video.srcObject = stream;
    }

    return;
  }

  const tile = document.createElement("div");

  tile.className = "video-tile";
  tile.dataset.id = id;

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  const label = document.createElement("div");

  label.className = "tile-name";
  label.textContent = name;

  tile.appendChild(video);
  tile.appendChild(label);

  tile.addEventListener("click", () => {
    selectedParticipantId = id;

    mainVideo.srcObject = stream;
    mainVideo.muted = false;
    mainVideoLabel.textContent = name;

    mainVideoWrap.classList.remove("talking");
  });

  videoGrid.appendChild(tile);

  entry.tile = tile;
  entry.video = video;

  /*
    Try to start audio immediately.
  */
  video.play().catch(() => {});
}


function removeVideoTile(id) {

  const entry = peers.get(id);

  if (!entry) {
    return;
  }

  if (entry.tile) {
    entry.tile.remove();
  }
}


function showLocalVideo() {

  selectedParticipantId = null;

  if (localStream) {
    mainVideo.srcObject = localStream;
    mainVideo.muted = true;
    mainVideoLabel.textContent =
      `${myName} (You)`;
  }
}


mainVideoWrap.addEventListener("click", async () => {

  if (
    document.fullscreenElement === mainVideoWrap
  ) {
    await document.exitFullscreen();
    return;
  }

  try {
    await mainVideoWrap.requestFullscreen();
  } catch (_) {}
});


/* ---------------- TALKING INDICATOR ---------------- */

let audioContext = null;
let audioAnalyser = null;
let audioSource = null;
let talkingAnimation = null;

function startTalkingDetection() {

  if (!localStream) {
    return;
  }

  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioAnalyser =
      audioContext.createAnalyser();

    audioAnalyser.fftSize = 512;

    audioSource =
      audioContext.createMediaStreamSource(
        localStream
      );

    audioSource.connect(audioAnalyser);

    const buffer =
      new Uint8Array(
        audioAnalyser.fftSize
      );

    function check() {

      if (!audioAnalyser) {
        return;
      }

      audioAnalyser.getByteTimeDomainData(buffer);

      let sum = 0;

      for (const value of buffer) {
        const normalized =
          (value - 128) / 128;

        sum += normalized * normalized;
      }

      const volume =
        Math.sqrt(sum / buffer.length);

      mainVideoWrap.classList.toggle(
        "talking",
        volume > 0.06
      );

      talkingAnimation =
        requestAnimationFrame(check);
    }

    check();

  } catch (error) {
    console.warn(
      "Talking detection unavailable:",
      error
    );
  }
}


/* ---------------- CHAT ---------------- */

function escapeText(text) {
  return String(text);
}


function addChatMessage(message) {

  if (!message) {
    return;
  }

  const wrapper =
    document.createElement("div");

  wrapper.className = "chat-message";

  const name =
    document.createElement("div");

  name.className = "chat-name";

  name.textContent =
    message.name +
    (message.moderator ? " • Moderator" : "");

  const text =
    document.createElement("div");

  text.className = "chat-text";
  text.textContent =
    escapeText(message.text);

  const time =
    document.createElement("span");

  time.className = "chat-time";

  time.textContent =
    new Date(
      message.timestamp
    ).toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  name.appendChild(time);

  wrapper.appendChild(name);
  wrapper.appendChild(text);

  chatMessages.appendChild(wrapper);

  chatMessages.scrollTop =
    chatMessages.scrollHeight;
}


function renderChat(messages) {

  chatMessages.innerHTML = "";

  for (const message of messages || []) {
    addChatMessage(message);
  }
}


chatForm.addEventListener("submit", event => {

  event.preventDefault();

  const text =
    chatInput.value.trim();

  if (!text) {
    return;
  }

  send({
    type: "chatMessage",
    text
  });

  chatInput.value = "";
});


/* ---------------- CONTROLS ---------------- */

muteButton.addEventListener("click", () => {

  if (!localStream) {
    return;
  }

  const tracks =
    localStream.getAudioTracks();

  if (!tracks.length) {
    return;
  }

  const enabled =
    !tracks[0].enabled;

  for (const track of tracks) {
    track.enabled = enabled;
  }

  muteButton.textContent =
    enabled ? "Mute" : "Unmute";
});


cameraButton.addEventListener("click", () => {

  if (!localStream) {
    return;
  }

  const tracks =
    localStream.getVideoTracks();

  if (!tracks.length) {
    return;
  }

  const enabled =
    !tracks[0].enabled;

  for (const track of tracks) {
    track.enabled = enabled;
  }

  cameraButton.textContent =
    enabled ? "Camera Off" : "Camera On";
});


leaveButton.addEventListener("click", () => {

  send({
    type: "leaveRoom"
  });

  cleanupCall();
});


/* ---------------- CALL START / CLEANUP ---------------- */

function showCall() {

  home.classList.add("hidden");
  call.classList.remove("hidden");

  if (currentRoom) {

    displayRoomName.textContent =
      currentRoom.name;

    displayRoomCode.textContent =
      `Code: ${currentRoom.code}`;
  }

  showLocalVideo();

  startTalkingDetection();
}


function closePeer(id) {

  const entry = peers.get(id);

  if (!entry) {
    return;
  }

  try {
    entry.pc.close();
  } catch (_) {}

  if (entry.tile) {
    entry.tile.remove();
  }

  peers.delete(id);
}


function cleanupCall() {

  for (const id of peers.keys()) {
    closePeer(id);
  }

  participants.clear();

  selectedParticipantId = null;

  if (talkingAnimation) {
    cancelAnimationFrame(
      talkingAnimation
    );

    talkingAnimation = null;
  }

  if (audioSource) {
    try {
      audioSource.disconnect();
    } catch (_) {}

    audioSource = null;
  }

  if (audioContext) {
    try {
      audioContext.close();
    } catch (_) {}

    audioContext = null;
  }

  if (localStream) {

    for (const track of localStream.getTracks()) {
      track.stop();
    }

    localStream = null;
  }

  mainVideo.srcObject = null;

  videoGrid.innerHTML = "";
  chatMessages.innerHTML = "";

  currentRoom = null;

  call.classList.add("hidden");
  home.classList.remove("hidden");

  displayRoomName.textContent = "Room";
  displayRoomCode.textContent = "";

  muteButton.textContent = "Mute";
  cameraButton.textContent = "Camera Off";
}


/* ---------------- START ---------------- */

nameInput.value =
  localStorage.getItem("videoChatName") || "";

nameInput.addEventListener("change", () => {
  localStorage.setItem(
    "videoChatName",
    nameInput.value
  );
});

roomCodeInput.addEventListener("input", () => {
  roomCodeInput.value =
    roomCodeInput.value
      .toUpperCase()
      .replace(/\s+/g, "");
});
</script>
